/* ============================================================
   分类管理：加、改名、删。分类只是给你自己逛冰箱用的，
   删掉一类不会删食材——里面的东西全部挪到「其他」。
   ============================================================ */
function sheetCat(){
  var g = groupsOf();
  var h = '<h3>分类</h3>';
  h += '<div style="font-size:12px;color:#8A8478;line-height:1.7;margin:-8px 0 10px">' +
       '点一类展开，点里面的食材就能换到别的类。<br>' +
       '分类只决定你逛冰箱时怎么分组，不影响推荐。删掉一类，里面的食材会挪到「其他」，不会丢。</div>';
  g.forEach(function(name){
    var ids = groupIds(name);
    if(ui.catEdit === name){
      h += '<div class="catrow"><input id="catName" type="text" value="' + esc(ui.catName == null ? name : ui.catName) + '">' +
           '<button data-act="catSave" data-g="' + esc(name) + '">存</button>' +
           '<button class="ghost" data-act="catCancel">取消</button></div>';
      return;
    }
    var open = ui.catOpen === name;
    /* 整行可点：展开这一类里的食材。原来只有「改名 / 删」，
       结果是有库存的才能点开去改分类，没买过的那样东西永远改不了 */
    h += '<div class="catrow" data-act="catOpen" data-g="' + esc(name) + '" style="cursor:pointer">' +
         '<div class="ib"><div class="nm">' + esc(name) + (open ? ' ▾' : ' ›') + '</div>' +
         '<div class="mt">' + ids.length + ' 样食材' + (ids.length && !open ? ' · 点开看 / 改' : '') + '</div></div>' +
         '<button class="ghost" data-act="catRename" data-g="' + esc(name) + '">改名</button>' +
         (g.length > 1 ? '<button class="ghost del" data-act="catDel" data-g="' + esc(name) + '">删</button>' : '') +
         '</div>';
    if(!open) return;
    if(!ids.length){
      h += '<div class="empty" style="padding:6px 0 14px">这一类还空着。记一笔时选它，或者把别的类里的东西挪过来。</div>';
      return;
    }
    h += '<div class="chips wrap" style="padding:8px 0 6px">';
    ids.forEach(function(id){
      h += '<button class="chip' + (ui.gMove === id ? ' on' : '') + '" data-act="gMoveOpen" data-id="' + id + '">' +
           esc(ingName(id)) + '</button>';
    });
    h += '</div>';
    /* 点中哪样，就在下面出「挪到哪一类」。只在这一类展开时才显示，
       免得收起别的类时还挂着上一次选中的东西 */
    if(ui.gMove && ids.indexOf(ui.gMove) >= 0){
      h += '<div style="font-size:12px;color:#8A8478;margin:0 0 6px">把「' + esc(ingName(ui.gMove)) + '」挪到：</div>';
      h += '<div class="chips wrap" style="padding-bottom:10px">';
      g.forEach(function(g2){
        h += '<button class="chip' + (gOf(ui.gMove) === g2 ? ' on' : '') + '" data-act="gMoveTo" data-id="' + ui.gMove +
             '" data-g="' + esc(g2) + '">' + esc(g2) + '</button>';
      });
      h += '</div>';
    }
  });
  h += '<div class="catrow"><input id="catNew" type="text" placeholder="新分类名，比如「冷冻」" value="' + esc(ui.catNew || '') + '">' +
       '<button data-act="catAdd">增加</button></div>';
  /* 从「记一笔」或「保质期设置」进来的，看完分类要能原地回去，别让人重新点一遍 */
  var back = ui.catFrom === 'add' ? 'add' : (ui.catFrom === 'shelf' ? 'shelf' : '');
  h += '<div class="actions" style="margin-top:16px">' +
       (back ? '<button class="btn btn-ghost" data-act="catBack" style="font-size:14px">回到' +
               (back === 'add' ? '记一笔' : '保质期设置') + '</button>' : '') +
       '<button class="btn btn-primary" data-act="' + (back ? 'catBack' : 'closesheet') + '" style="font-size:14px">好了</button></div>';
  return h;
}

/* 改名 / 删除时，把那一类里的食材全部改指到新名字。
   内置食材的分类原本写在 SHELF 里改不动，所以统一用 ingG 记住你的选择 */
function relocateGroup(from, to){
  if(!to || from === to) return;
  allIngIds().forEach(function(id){
    if(gOf(id) !== from) return;
    state.ingG[id] = to;
    if(state.ings[id]) state.ings[id].g = to;
  });
}
function renameGroup(from, to){
  var g = groupsOf();
  if(!from || !to) return false;
  if(from === to) return true;
  if(g.indexOf(from) < 0 || g.indexOf(to) >= 0) return false;
  state.groups[g.indexOf(from)] = to;
  relocateGroup(from, to);
  if(ui.addGrp === from) ui.addGrp = to;
  save();
  return true;
}
function deleteGroup(name){
  var g = groupsOf();
  if(g.length <= 1 || g.indexOf(name) < 0) return false;
  var target = (name === '其他') ? g.filter(function(x){ return x !== name; })[0] : '其他';
  if(g.indexOf(target) < 0) target = g.filter(function(x){ return x !== name; })[0];
  g.splice(g.indexOf(name), 1);
  relocateGroup(name, target);
  if(ui.addGrp === name) ui.addGrp = target;
  save();
  return true;
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* 选备份文件：读进来直接走跟粘贴一样的检查 */

/* 自定义输入：回车直接加入，不用去点按钮 */
document.addEventListener('keydown', function(e){
  /* 菜谱搜索：回车收键盘（手机上收起来才看得见结果），Esc 清空重来 */
  var sb = e.target;
  if(sb && sb.id === 'libQ'){
    if(e.key === 'Enter'){ e.preventDefault(); if(sb.blur) sb.blur(); }
    else if(e.key === 'Escape'){ e.preventDefault(); ui.libQ = ''; render(); }
    return;
  }
  if(e.key !== 'Enter') return;
  var t = e.target;
  if(!t) return;
  /* 补录表单：菜名框回车跳到作者，作者框回车直接记下来 */
  if(t.id === 'nmName'){
    e.preventDefault();
    var aBox = document.getElementById('nmAuthor');
    if(aBox) aBox.focus();
    return;
  }
  if(t.id === 'nmAuthor'){ e.preventDefault(); doAddByName(); return; }
  /* 找食材：回车有候选就选第一个，没有就当成新食材加进去 */
  if(t.id === 'f_ingq'){
    e.preventDefault();
    if(!ui.draft) return;
    ui.ingQ = t.value;
    var q = String(ui.ingQ || '').trim();
    if(!q) return;
    var hit = allIngIds().filter(function(x){

  demoLog.forEach(function(r){
    state.history.push({date:dstr(r[0]), p:r[1], f:r[2], c:r[3], t:null, name:r[4]});
  });
  save();
}

render();

/* 先出首屏，再去取当天的灵感清单：取不到（没网 / 还没生成）就当没有，
   不能因为一个请求把「今天吃什么」挡在门外 */
if(location.search.indexOf('test') < 0){
  loadRecs();
  /* 顺带问一句菜谱包有没有新版：只取几百字节的 pack-ver.json，
     有更新才在菜谱页顶部提示，不自动装 */
  checkPack();
  /* 早上把 app 挂在后台、再切回来时顺手再问一次，不用手动刷新也能看到新菜。
     两个函数自己都会挡：今天已经取到 / 20 分钟内问过，就直接返回 */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    loadRecs(); checkPack();
  });
}

/* ?new=1 直接打开「加一道菜」，方便在电脑上看版式；?edit=1 打开改菜谱 */
if(location.search.indexOf('edit=1') >= 0){
  ui.tab = 'lib';
  openEditor(findItem('p04'));
}
else if(location.search.indexOf('new=1') >= 0){
  ui.tab = 'lib';
  openEditor(null);
  if(location.search.indexOf('more=1') >= 0){ ui.draft._more = 1; renderSheet(); }
  if(location.search.indexOf('demo=1') >= 0){
    ui.pasteTxt = '番茄炒蛋\n作者：爱做饭的姥姥\n用料\n番茄 2个\n鸡蛋 2个\n小葱 1根\n做法\n1. 番茄去皮切块。\n2. 鸡蛋打散，热锅倒油炒熟盛出。\n3. 下番茄炒出汁，倒回鸡蛋翻炒，撒葱花。\n小贴士\n番茄先用开水烫一下更好去皮。';
    document.getElementById('f_paste').value = ui.pasteTxt;
    doPasteParse();
  }
}
else if(location.search.indexOf('one=') >= 0){
  var keepId = location.search.split('one=')[1].split('&')[0];
  ui.tab = 'lib'; ui.libCat = 'all';
  state.hidden = ITEMS.filter(function(x){ return x.id !== keepId; }).map(function(x){ return x.id; });
  rebuildItems(); render();
}
else if(location.search.indexOf('cat=') >= 0){
  ui.tab = 'lib';
  ui.libCat = location.search.split('cat=')[1].split('&')[0] || 'all';
  render();
}
else if(location.search.indexOf('pend=1') >= 0){
  ui.tab = 'lib';
  state.pending = [{n:'肉末嫩豆腐｜嫩滑口感爽口！这道快手菜超级下饭！！（减脂少油版）', author:'小何的减脂日常'},
                   {n:'银鱼蒸蛋', author:'某人'}];
  ui.sheet = true; ui.sheetType = 'pending'; renderSheet();
}
/* 版式调试：?set=1 设置页 / ?bk=1 导出 / ?rs=1 导入 */
else if(location.search.indexOf('set=1') >= 0){
  ui.sheet = true; ui.sheetType = 'settings'; renderSheet();
}
else if(location.search.indexOf('bk=1') >= 0){
  ui.bkText = backupText(); ui.sheet = true; ui.sheetType = 'backup'; renderSheet();
}
else if(location.search.indexOf('rs=1') >= 0){
  ui.sheet = true; ui.sheetType = 'restore'; renderSheet();
}

/* 只有 https（或 localhost）才注册 sw。file:// 和局域网 http 下注册会报错，直接跳过 */
if('serviceWorker' in navigator &&
   (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', function(){
    try{
      /* 新版本接管时自己刷一次。以前改了代码，装到桌面上的那个窗口
         死活不换，得手动去清缓存才看得到新版 */
      var hadCtrl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(hadCtrl && !window.__swReload){ window.__swReload = 1; location.reload(); }
      });
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    }catch(e){}
  });
}
</script>
