/* 待补录：只有菜名和作者的菜攒在这里。两条路都能只靠手机走完：
   A 自己照着填（点「照着填内容」，两分钟一条，不依赖任何人）
   B 攒清单发出去（我搜了写进文件） */
function sheetPending(){
  var rows = state.pending || [];
  var doneN = rows.filter(pendingIsDone).length;
  var h = '<h3>待补录</h3>';
  if(!rows.length){
    h += '<div class="empty">还没有。在「导入 / 补录」里填个菜名，就会记进来。</div>';
  } else {
    h += '<div class="pendstep">' +
         '<b>A 自己补（手机就能做，不求人）</b>' +
         '<div>点「照着填内容」→ 把菜谱文字粘进去（没有就照自己的做法写个大概）→ 保存，这条自动从清单里消失。</div>' +
         '<b style="display:block;margin-top:8px">B 攒着让我查</b>' +
         '<div>点下面那个绿色按钮 → 在分享面板里选 WorkBuddy（微信也行）→ 直接发出去，不用复制粘贴。我搜出来写进菜谱，你刷新页面，这条自动标成「已在菜谱里」。</div>' +
         '</div>';
    h += '<textarea id="pendTxt" class="pendbox" readonly>' + esc(pendingText()) + '</textarea>';
    h += '<div class="actions" style="margin-top:10px">' +
         '<button class="btn btn-primary" data-act="pendShare" style="width:100%;font-size:14.5px">发给 WorkBuddy</button>' +
         '</div>';
    h += '<div class="actions" style="margin-top:8px">' +
         '<button class="btn btn-ghost" data-act="pendCopy" style="font-size:13px">只复制</button>' +
         (doneN ? '<button class="btn btn-ghost" data-act="pendDropDone" style="font-size:13px">清掉已补录的 ' + doneN + ' 条</button>' : '') +
         '</div>';
    h += '<div class="actions" style="margin-top:8px">' +
         '<button class="btn btn-ghost" data-act="pendClear" style="color:#A0503A;font-size:13px">清空清单</button></div>';
    h += '<div class="card" style="margin-top:12px">';
    rows.forEach(function(x, k){
      var done = pendingIsDone(x);
      h += '<div class="rc"><div class="r1"><span class="n">' + esc(x.n) + '</span>' +
           (done ? '<span class="tag ok">已在菜谱里</span>' : '') +
           '<button data-act="pendDel" data-i="' + k + '">' + (done ? '清掉' : '删掉') + '</button></div>' +
           '<div class="r2"><span class="byline">@' + esc(x.author || '没记作者') + '</span>' +
           srcLink(x.src) + '</div>' +
           (done ? '' :
             '<div class="prow">' +
               '<button class="pbtn primary" data-act="pendFill" data-i="' + k + '">照着填内容</button>' +
               '<button class="pbtn" data-act="pendSearch" data-i="' + k + '">去下厨房搜这道</button>' +
             '</div>') +
           '</div>';
    });
    h += '</div>';
  }
  h += '<div class="actions" style="margin-top:12px">' +
       '<button class="btn btn-ghost" data-act="pendAdd">＋ 再补一道</button>' +
       '<button class="btn btn-ghost" data-act="closesheet">关闭</button></div>';
  return h;
}

/* 从待补录那一条起一个草稿：菜名、作者、链接先带过去，粘贴框留在最上面 */
function pendingToDraft(x){
  var d = emptyDraft('protein');
  d._new = true;
  d._pasteOpen = 1;
  d.n = x && x.n ? x.n : '';
  d.author = (x && x.author) || '';
  d.src = pickSrc(x && x.src) || '';
  return d;
}

/* 自己填完存盘后，把清单里那条同名（且作者不冲突）的去掉，不用手动删 */
function dropFilledPending(d){
  var a = dishCore(d && d.n);
  if(!a) return 0;
  var before = (state.pending || []).length;
  state.pending = (state.pending || []).filter(function(x){
    if(dishCore(x.n) !== a) return true;
    /* 两边都写了作者且不是同一个，说明是同名的另一版，留着 */
    if(d.author && x.author && normDish(d.author) !== normDish(x.author)) return true;
    /* 自己填的这道没写作者，就别去认领「指明要某位作者」的那条：
       认领了等于静默删掉用户的需求，之后也发不出去了 */
    if(!d.author && x.author) return true;
    return false;
  });
  var n = before - state.pending.length;
  if(n) save();
  return n;
}

/* 这条是不是已经补进菜谱了：按菜名对（去掉括号内容和空格）。
   严格相等，是因为「凉拌菠菜」不该被「凉拌菠菜粉丝」顶掉。 */
function normDish(s){
  return String(s || '').replace(/[（(][^）)]*[）)]/g, '').replace(/[\s·]+/g, '').toLowerCase();
}
/* 下厨房的标题常带一长串卖点：「肉末嫩豆腐｜嫩滑爽口！超级下饭！！（减脂版）」。
   只取竖线/叹号/冒号前面那段当菜名，否则跟库里的「肉末嫩豆腐」永远对不上。 */
function dishCore(s){
  return normDish(s).split(/[|｜!！?？。，,、:：;；~～—–]+/)[0];
}
function pendingIsDone(x){
  var a = dishCore(x.n);
  if(!a) return false;
  return ITEMS.some(function(it){ return dishCore(it.n) === a; });
}

/* 一键复制清单。剪贴板不可用（老浏览器 / 权限被拒）就退回全选，
   让人自己按 Ctrl+C —— 手机上长按也能复制 */
function copyPending(){
  var txt = pendingText();
  var fallback = function(){
    var pt = document.getElementById('pendTxt');
    if(pt && pt.select){
      pt.focus(); pt.select();
      if(pt.setSelectionRange) pt.setSelectionRange(0, pt.value.length);
    }
    toast('已全选，按 Ctrl+C 或长按「复制」');
  };
  if(typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      toast('复制好了，粘到 WorkBuddy 对话框发我');
    })['catch'](fallback);
  } else fallback();
}

/* 手机上一键把清单发出去：调系统分享面板，选 WorkBuddy / 微信，不用复制粘贴 */
function sharePending(){
  var txt = pendingText();
  if(typeof navigator !== 'undefined' && navigator.share){
    navigator.share({ title: '待补录的菜', text: txt })['catch'](function(err){
      if(err && err.name === 'AbortError') return;   /* 自己点了取消，不要紧 */
      copyPending();
    });
  } else {
    copyPending();   /* 电脑浏览器多数没有分享面板，退回复制 */
  }
}

/* 解析完给一句「我填好了什么」，缺的部分点出来，不用人自己找 */
function impSummary(d){
  var step = (d.m || '').split('\n').filter(function(x){ return x.trim(); }).length;
  var p = [d.n ? '菜名「' + esc(d.n) + '」' : '<b>没认出菜名</b>'];
  if(d.author) p.push('作者「' + esc(d.author) + '」');
  p.push(d.needs.length ? '用料 ' + d.needs.length + ' 样' : '<b>没认出用料</b>');
  p.push(step ? '做法 ' + step + ' 步' : '<b>没认出做法</b>');
  return '已填好 · ' + p.join(' · ');
}


/* 待补录：只有菜名和作者、还缺内容的菜，攒着等联网去查 */
function addPending(row){
  state.pending = state.pending || [];
  var hit = -1;
  state.pending.forEach(function(x, k){
    if(x.n === row.n && (x.author || '') === (row.author || '')) hit = k;
  });
  if(hit >= 0){
    if(row.src) state.pending[hit].src = row.src;
  } else {
    state.pending.unshift({ n:row.n, author:row.author || '', src:row.src || '', at:todayStr() });
  }
  save();
}
/* 给用户复制的一段清单，直接发出去就能查。已经补过的不用再发 */
function pendingText(){
  var rows = (state.pending || []).filter(function(x){ return !pendingIsDone(x); }).map(function(x){
    return x.n + (x.author ? ' / ' + x.author : '') + (x.src ? ' / ' + x.src : '');
  });
  if(!rows.length) return '（清单里的都补好了）';
  return '这几道菜帮我补一下（菜名 / 作者 / 链接）：\n' + rows.join('\n');
}

/* 只有菜名和作者：不开解析器，直接记进待补录。
   这个页面离线，上不了网也抓不了下厨房（对方对非浏览器请求一律 404 / 滑动验证），
   所以这里只负责「记下来」，内容由联网那边补。 */
function doAddByName(){
  var nEl = document.getElementById('nmName');
  var aEl = document.getElementById('nmAuthor');
  var sEl = document.getElementById('nmSrc');
  var n = nEl ? nEl.value.trim() : '';
  var a = aEl ? aEl.value.trim() : '';
  var s = sEl ? sEl.value : '';
  ui.nmName = n; ui.nmAuthor = a; ui.nmSrc = s;

  /* 「作者：xxx」这种前缀随手去掉 */
  a = a.replace(/^(作者|出自|原作者|by)\s*[:：]?\s*/i, '').trim().slice(0, 40);

  if(!n){
    ui.impMsg = {t:'err', m:'菜名得填一个，不然我不知道要搜什么。'};
    renderSheet(); return;
  }
  var url = pickSrc(s);
  if(String(s || '').trim() && !url){
    ui.impMsg = {t:'err', m:'链接没认出来，要以 http:// 或 https:// 开头；不填也行，只填菜名和作者就够。'};
    renderSheet(); return;
  }

  addPending({ n:n, author:a, src:url });
  /* 清空表单，方便接着填下一道 */
  ui.nmName = ''; ui.nmAuthor = ''; ui.nmSrc = '';
  ui.impMsg = {t:'ok', m:'记好了：' + n + (a ? ' / ' + a : '') +
    '。待补录现在 ' + state.pending.length + ' 道——想自己录，去清单点「照着填内容」；想省事，点「发给 WorkBuddy」一键甩给我。'};
  renderSheet(); render();
}

function addIngToDraft(name){
  var t = normIngName(name);
  if(!t) return;
  var id = matchIng(t);
  if(!id){
    /* 菜谱里新起的食材也进同一份食材库：给它一个分类和保质期，
       这样它马上就能在冰箱里记、也能被其他菜谱认出来 */
    id = newIngId();
    state.ings[id] = { n: t, g: ui.addGrp && groupsOf().indexOf(ui.addGrp) >= 0 ? ui.addGrp : otherGroup(),
                       d: state.shelfName[t] || 3 };
    state.extraIng[id] = t;
    save();
  }
  if(ui.draft.needs.indexOf(id) < 0) ui.draft.needs.push(id);
}
/* 老数据或手改过的备份可能缺字段（没有 taste 数组，
   tastePenalty 里读 x.taste[1] 就会抛错，而它在渲染链上，一崩就是白屏） */
function normItem(it){
  it.needs = Array.isArray(it.needs) ? it.needs : [];
  it.taste = (Array.isArray(it.taste) && it.taste.length === 3) ? it.taste : [0, 0, 0];
  it.prep = Array.isArray(it.prep) ? it.prep : [];
  it.wk = it.wk ? 1 : 0;
  if(it.hand == null) it.hand = 5;
  if(it.wall == null) it.wall = it.hand;
  return it;
}
function rebuildItems(){
  var out = [];
  /* 只有一份来源：你自己存下来的菜谱。没有代码里的常量参与，
     所以删除就是真删，不会哪天又冒出来 */
  state.recipes.forEach(function(it){
    if(state.hidden.indexOf(it.id) >= 0) return;
    out.push(normItem(it));
  });
  ITEMS.length = 0;
  Array.prototype.push.apply(ITEMS, out);
  return ITEMS;
}
/* 以前用来区分「代码自带」和「自己建的」。现在只有自己建的，
   留着空实现是因为老数据的 hidden / edits 里还带 p01… 这类 id */
function isBuiltin(id){ return false; }
/* ============================================================
   食材库 + 分类
   以前有两条互不相干的线：菜谱用料认得的是 ING 里那批 id，
   而你在冰箱里自己加的东西只有一个名字挂在库存行上（cus_xxx）。
   菜谱写「塔菜」时认不出库存里的塔菜，于是「冰箱明明有」照样进今天要买，
   吃完也不会扣那一行。这里把两边并成一份：
   自建食材先进 state.ings（名字 / 分类 / 保质期），
   菜谱用料、库存、采购清单都按同一套 id 说话。
   ============================================================ */
function groupsOf(){
  var g = (state && state.groups) ? state.groups : null;
  return (g && g.length) ? g : DEFAULT_GROUPS;
}
function otherGroup(){
  var g = groupsOf();
  return g.indexOf('其他') >= 0 ? '其他' : g[g.length - 1];
}
function isUserIng(id){ return !!(id && state.ings && state.ings[id]); }
/* 一样东西归哪一类：手改过的 > 自建时选的 > 内置推荐 > 兜底「其他」 */
function gOf(id){
  if(state.ingG && state.ingG[id]) return state.ingG[id];
  if(state.ings && state.ings[id] && state.ings[id].g) return state.ings[id].g;
  if(SHELF[id] && SHELF[id].g) return SHELF[id].g;
  return otherGroup();
}
function setIngGroup(id, g){
  if(!id || groupsOf().indexOf(g) < 0) return false;
  state.ingG[id] = g;
  if(state.ings[id]) state.ings[id].g = g;
  save();
  return true;
}
/* 输入的名字先归一：「新鲜 菠菜（一把）500g」→「新鲜菠菜」。
   数字+量词才剪，免得「面条」被剪成「面」、「粉条」被剪成「粉」 */
function normIngName(s){
  var t = String(s == null ? '' : s);
  t = t.replace(/[\u3000\s]+/g, '');
  t = t.replace(/[（(][^）)]*[)）]/g, '');
  t = t.replace(/^[·•\-—_+＊*]+/, '').replace(/[·•\-—_+＊*]+$/, '');
  var cut = t.replace(/[\d一二三四五六七八九十半]+(?:kg|g|ml|毫升|升|克|斤|个|把|袋|盒|颗|根|只|包|瓶|罐|块|条|片|束|棵|朵|段|头|匙)$/i, '');
  if(cut && cut !== t && cut.length >= 2) t = cut;
  return t.trim();
}
/* 打的名字 → 已有食材 id：精确 > 别名 > 互相包含，跟菜谱用料识别同一套规则。
   所以「西红柿」会落到番茄，「新鲜菠菜」会落到菠菜，不会各记一条 */
function matchIngName(name){ return matchIng(normIngName(name)); }

/* 老数据搬家：库存里的 cus_xxx、菜谱里的 extraIng，全部注册成正式食材。
   同名历史上可能建过好几条（就是「打已有名字又新建一条」造成的），按名字并到一个 id 上 */
function migrateIngs(){
  state.ings = state.ings || {};
  state.ingG = state.ingG || {};
  var g = Array.isArray(state.groups)
    ? state.groups.filter(function(x){ return x && x !== '自定义'; })
    : null;
  state.groups = (g && g.length) ? g : DEFAULT_GROUPS.slice();
  Object.keys(state.extraIng || {}).forEach(function(id){
    if(!state.ings[id]) state.ings[id] = { n: state.extraIng[id], g: otherGroup(), d: state.shelf[id] || 3 };
  });
  var byName = {};
  Object.keys(state.ings).forEach(function(id){
    var nm = normIngName(state.ings[id] && state.ings[id].n);
    if(nm && !byName[nm]) byName[nm] = id;
  });
  (state.inventory || []).forEach(function(x){
    if(!x || !x.qty) return;
    if(SHELF[x.id] || ING[x.id]) return;          /* 内置食材本来就在库里 */
    var nm = normIngName(x.name || (state.ings[x.id] && state.ings[x.id].n) || '');
    if(!nm) return;
    var built = matchIng(nm);
    if(built && !state.ings[built]){ x.id = built; delete x.custom; delete x.name; return; }
    var keep = byName[nm];
    if(!keep){
      keep = x.id || newIngId();
      byName[nm] = keep;
      if(!state.ings[keep]) state.ings[keep] = { n: x.name || nm, g: otherGroup(), d: state.shelfName[x.name] || 3 };
    }
    x.id = keep;
    if(!x.name && state.ings[keep]) x.name = state.ings[keep].n;
    x.custom = 1;
  });
  dedupeInventory();
}
/* 同一个 id 的多条「还没过期」的行并成一条（数量相加、到期取晚的）。
   这本来就是 invAdd 的口径；老数据里同一样东西建了两三条的，在这里收拢。
   过期行保留：它是另一批货，不该被新货续命 */
function dedupeInventory(){
  var keep = {}, out = [];
  (state.inventory || []).forEach(function(x){
    if(!x || !(x.qty > 0)) return;
    if(daysBetween(todayStr(), x.exp) < 0){ out.push(x); return; }
    if(!keep[x.id]){ keep[x.id] = x; out.push(x); return; }
    var t = keep[x.id];
    t.qty += x.qty;
    if(x.exp > t.exp) t.exp = x.exp;
    if(x.name && !t.name) t.name = x.name;
  });
  state.inventory = out;
}
function newIngId(){ return 'ing' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
/* 现存的食材总数：逛冰箱、分类计数都按这个口径 */
function groupIds(g){
  return allIngIds().filter(function(id){ return !isPantry(id) && gOf(id) === g; });
}

/* 食材显示名：内置表 > 自建食材库 > 老版本 extraIng > 原样返回 */
function ingName(id){
  if(!id) return '';
  return ING[id] || (state.ings && state.ings[id] && state.ings[id].n) || state.extraIng[id] || id;
}

/* 存一条：id 为空即新建；同 id 就是整条替换 */
function saveRecipe(d){
  /* 新建的草稿 id 是空串。不补的话，第二道会命中「id 也是空串」的第一道，直接把它覆盖掉。
     原来只有测试代码在补 id，生产路径没补——连存两道自建菜，库里只会剩最后一道。 */
  if(!d.id) d.id = newRecipeId();
  d._new = 0;
  var oldRec = null;
  state.recipes.forEach(function(x){ if(x && x.id === d.id) oldRec = x; });
  var item = {
    id:d.id, n:d.n, cat:d.cat, hand:d.hand, wall:d.wall, fire:d.fire, vessel:d.vessel,
    staple:d.staple, needs:d.needs.slice(), taste:(d.taste || [0,0,0]).slice(), cuisine:d.cuisine,
    lv:d.lv, m:d.m, prep:(d.prep || []).slice(), src:pickSrc(d.src)
  };
  /* 现在只有一种来源：你自己存下来的，整条替换。所以空值就是不写，
     清空作者、取消限量都能如实存下去 */
  if(d.author) item.author = d.author;
  if(d.note) item.note = d.note;
  if(d.cap != null) item.cap = d.cap;
  if(d.red) item.red = 1;
  if(d.fiber) item.fiber = 1;
  /* 整条替换：写成 1 才留，改成工作日就不写，旧值不会挂着 */
  if(d.wk) item.wk = 1;
  if(d.ext) item.ext = 1;
  /* key 是「这道菜从包里来」的凭证。编辑一次就丢的话，下次装包会当成新菜再加一条 */
  if(d.key) item.key = d.key;
  /* 手动存过一次就打上记号：以后装包带来更新的做法，也不覆盖你这条 */
  item.my = 1;
  if(oldRec && oldRec.v) item.v = oldRec.v;
  var hit = -1;
  state.recipes.forEach(function(x, k){ if(x.id === d.id) hit = k; });
  if(hit >= 0) state.recipes[hit] = item; else state.recipes.push(item);
  rebuildItems(); dropPickIfTouched(d.id); save();
  return d.id;
}
/* 改了/删了正在今天这顿里的菜，就让它重排，别留一道已经不存在的菜 */
function dropPickIfTouched(id){
  var pk = state.today && state.today.pick;
  if(!pk || !pk.combo) return;
  var hit = slotsOf(pk.combo).some(function(x){ return x && x.id === id; });
  /* 只重排，不动 eaten：已经记过账了，把记账状态清掉会让「就吃这个」再记一次，
     同一天写两条记录、库存扣两轮，而 consumed 已被覆盖，多扣的那份永远还不回来 */
  if(hit){ state.today.pick = null; }
}
/* 删除：每类至少留 3 道，否则组合就凑不齐了 */
function deleteRecipe(id){
  var it = findItem(id);
  if(!it) return '没找到这道菜';
  var same = ITEMS.filter(function(x){ return x.cat === it.cat; });
  if(same.length <= 3) return '这类只剩 ' + same.length + ' 道，再删就排不出今天这顿了';
  if(state.hidden.indexOf(id) < 0) state.hidden.push(id);
  /* 删除只藏不删：id 记进 hidden，条目还留在 recipes 里，
     这样「恢复」能原样拿回来，也不至于手滑一次就没了 */
  dropPickIfTouched(id);
  rebuildItems(); save();
  return null;
}
function restoreRecipe(id){
  state.hidden = state.hidden.filter(function(x){ return x !== id; });
  rebuildItems(); save();
}
function newRecipeId(){ return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

function pool(cat){ return ITEMS.filter(function(x){ return x.cat === cat; }); }
function findItem(id){ return ITEMS.filter(function(x){ return x.id === id; })[0]; }

/* 库存口径：qty>0 且未过期才算「有」。过期的不参与推荐，在冰箱页单独提示。
   常备品（PANTRY）不进库存表，视为家里总有，所以 invOf 对它返回 null，
   但 stockedOf 才是「要不要买」的唯一口径。 */
/* 生效的常备品清单：出厂那批 − 你移出的 + 你自己加的，顺序按加入先后。
   每次现算，不做缓存——清单最多几十项，比起「改了没生效」的坑，这点开销不算什么 */
function pantryList(){
  var off = state.notPantry || [];
  var out = PANTRY.filter(function(id){ return off.indexOf(id) < 0; });
  (state.pantry || []).forEach(function(id){
    if(out.indexOf(id) < 0) out.push(id);
  });
  return out;
}
function isPantry(id){ return pantryList().indexOf(id) >= 0; }
/* 自己加的那几项（不是出厂自带的），列表里要能认出来 */
function isMyPantry(id){ return (state.pantry || []).indexOf(id) >= 0; }
function invOf(id){
  return state.inventory.filter(function(x){
    return x.id === id && x.qty > 0 && daysBetween(todayStr(), x.exp) >= 0;
  })[0];
}
/* 家里有没有：常备品永远算有；生鲜看库存且不能过期 */
function stockedOf(id){
  if(isPantry(id)) return true;
  return !!invOf(id);
}
function invAll(id){ return state.inventory.filter(function(x){ return x.id === id && x.qty > 0; })[0]; }
/* 冰箱页只显示生鲜层：老数据里可能还有蛋奶干货，一律过滤掉 */
function invList(){ return state.inventory.filter(function(x){ return x.qty > 0 && !isPantry(x.id); }); }
function invDays(x){ return daysBetween(todayStr(), x.exp); }
function invPurge(){ state.inventory = state.inventory.filter(function(x){ return x.qty > 0; }); }

/* 显示名：自定义食材没有 ING 记录，名字挂在条目上 */
function labelOf(x){ return (x && (x.name || ingName(x.id))) || ''; }

/* ---- 保质期 ----
   三级优先：同名自定义食材记过的天数 > 该食材改过的天数 > SHELF 推荐值 > 兜底 3 天。
   自定义食材每次新建都是新 id，所以按「名字」记一份，下次买同样的东西还是你上次定的天数。 */
function shelfDays(id, name){
  /* 自建食材的默认天数存在食材库里，所以哪怕冰箱里暂时没货，下次买回来还是你上次定的天数 */
  if(name && state.shelfName[name] != null) return state.shelfName[name];
  if(id && state.shelf[id] != null) return state.shelf[id];
  if(id && state.ings[id] && state.ings[id].d) return state.ings[id].d;
  return (SHELF[id] && SHELF[id].d) || 3;
}
function shelfNote(id){ return (SHELF[id] && SHELF[id].note) || ''; }
function shelfIsCustom(id, name){ return !SHELF[id] && !!(name || (state.shelf[id] != null)); }
function setShelfDays(id, days, name){
  var n = Math.round(Number(days));
  if(!(n >= 1)) n = 1;
  if(n > 90) n = 90;
  if(name) state.shelfName[name] = n;
  if(id){
    state.shelf[id] = n;
    /* 自建食材的名字和 id 是两份记账，改天数要一起改，
       否则下次按名字取会拿回老数字（按名字那份优先） */
    if(state.ings[id]){
      state.ings[id].d = n;
      state.shelfName[state.ings[id].n] = n;
    }
  }
  save();
  return n;
}
/* 改保质期只影响以后的记账，已经记进冰箱的到期日不动——那是当时按当时的天数算的 */
function invAdd(id, qty, exp, name){
  var hit = invAll(id);
  var e = exp || dstr(shelfDays(id, name));
  /* 只和「还没过期」的那行合并。过期货并进来再把到期日往后推，等于给旧货续命：
     推荐会把它当成还能用，冰箱页也不再提示过期。过期的就留着让它按过期处理，另起一行。 */
  var fresh = hit && daysBetween(todayStr(), hit.exp) >= 0;
  if(fresh){
    hit.qty += qty;
    if(e > hit.exp) hit.exp = e;
    if(name && !hit.name) hit.name = name;
  } else {
    var row = {id:id, qty:qty, exp:e, added:todayStr()};
    if(name) row.name = name;
    if(!SHELF[id]) row.custom = 1;
    state.inventory.push(row);
  }
}

/* 自定义食材：先看是不是已有的食材名（输「菠菜」不该新建一条），
   是就直接记到那个 id 上，不是才生成一条新的。
   group 传了就是这一类的分类，days 传了就是这一批的保质期。
   返回 id；常备品只记天数不入库存（调用方自己看 isPantry 决定怎么提示）。 */
function addCustom(name, days, group, forceNew){
  var t = normIngName(name);
  if(!t) return null;
  var dd = (days == null || days === '') ? null : Math.round(Number(days));
  if(dd != null && (isNaN(dd) || dd < 1)) dd = null;
  if(dd != null) dd = Math.min(90, dd);
  var g = group || '';
  if(groupsOf().indexOf(g) < 0) g = otherGroup();
  var hit;
  if(forceNew){
    /* 「不是它，单独建一条」：只认一字不差的重名，不再按包含/别名去靠 */
    hit = allIngIds().filter(function(id){ return normIngName(ingName(id)) === t; })[0] || null;
  } else hit = matchIng(t);
  if(hit){
    /* 打的是已有的东西：只加数量，绝不新建重名条目。
       注意「不动它的分类」——你是在补货，不是在重新归类；
       真要改分类，点进那一样改。 */
    if(dd) setShelfDays(hit, dd, isUserIng(hit) ? ingName(hit) : null);
    /* 常备品（牛奶、鸡蛋、坚果…）不进库存表：invList 会把它过滤掉，
       真记进去就成了「用户看不见、也删不掉，但 eat 会扣」的幽灵库存 */
    if(isPantry(hit)) return hit;
    invAdd(hit, 1);
    return hit;
  }
  var id = newIngId();
  state.ings[id] = { n: t, g: g, d: dd || 3 };
  if(dd) state.shelfName[t] = dd;
  invAdd(id, 1, null, t);
  return id;
}
/* 输入框下面那行提示：这一笔会加到哪儿、会不会跟已有的合并 */
function stockHintHtml(name){
  var t = normIngName(name);
  if(!t) return '<span class="dim">打名字。冰箱里已经有的会自动对上，不会再建一条重复的。</span>';
  var hit = matchIng(t);
  if(hit){
    var nm = ingName(hit);
    if(isPantry(hit)) return '「' + esc(nm) + '」是常备品，不记库存，只把保质期记下来。';
    var row = invAll(hit);
    var h = '对上冰箱里的「' + esc(nm) + '」' +
            (row ? '（已有 ' + row.qty + ' 份，还剩 ' + invDays(row) + ' 天）' : '') +
            ' · 点加入就是 ＋1。';
    /* 靠「包含」猜出来的匹配偶尔会猜错（牛肉丸 ≠ 牛里脊），留个一键分开的路 */
    if(normIngName(nm) !== t){
      h += ' <button class="linkbtn" data-act="cusNew">不是它，单独建一条</button>';
    }
    return h;
  }
  var g = ui.addGrp && groupsOf().indexOf(ui.addGrp) >= 0 ? ui.addGrp : otherGroup();
  return '新食材「' + esc(t) + '」· 会加进「' + esc(g) + '」，保质 ' + (ui.cusDays || 3) + ' 天。';
}

function customList(){
  var seen = {}, out = [];
  function add(nm){
    nm = nm ? String(nm) : '';
    if(!nm || seen[nm]) return;
    seen[nm] = 1; out.push(nm);
  }
  Object.keys(state.ings || {}).forEach(function(id){ add(state.ings[id] && state.ings[id].n); });
  (state.inventory || []).forEach(function(x){ if(x.custom && x.name) add(x.name); });
  return out;
}
/* 所有自建食材的 id（不管冰箱里现在有没有货） */
function customIds(){
  var out = Object.keys(state.ings || {});
  (state.inventory || []).forEach(function(x){ if(x.custom && out.indexOf(x.id) < 0) out.push(x.id); });
  return out;
}
function invOfName(name){
  var t = normIngName(name);
  if(!t) return null;
  var ids = customIds().filter(function(id){ return normIngName(ingName(id)) === t; });
  for(var i = 0; i < ids.length; i++){ var r = invAll(ids[i]); if(r) return r; }
  return (state.inventory || []).filter(function(x){ return x.custom && normIngName(x.name) === t && x.qty > 0; })[0] || null;
}

/* 哪些菜能用到它——这是「买了用不完」的解药 */
function recipesUsing(id){
  return ITEMS.filter(function(x){ return (x.needs || []).indexOf(id) >= 0; });
}

/* 一顿可能是三样、也可能是你多加的两道。历史里 p/f/c 只放三样，
   多加的放 x，凡是要按「这道菜吃过没有」判断的地方都得看全 */
function histIds(h){
  return [h.p, h.f, h.c].concat(h.x || []).filter(Boolean);
}
function eatenDaysAgo(id){
  var best = null;
  state.history.forEach(function(h){
    if(h.date === todayStr()) return;
    if(histIds(h).indexOf(id) >= 0){
      var d = daysBetween(h.date, todayStr());
      if(best === null || d < best) best = d;
    }
  });
  return best;
}
function stapleDaysAgo(staple){
  if(!staple) return null;
  var best = null;
  state.history.forEach(function(h){
    if(h.date === todayStr()) return;
    var ids = histIds(h);
    var hit = ids.some(function(id){ var it = findItem(id); return it && it.staple === staple; });
    if(hit){
      var d = daysBetween(h.date, todayStr());
      if(best === null || d < best) best = d;
    }
  });
  return best;
}
/* 最近 span 天内吃过几次。口径必须是「小于 span」：
   <= 7 会把 7 天前的今天也算进来，变成 8 天窗口，比界面承诺多一天 */
function weekCount(id, span){
  var n = 0, w = span || 7;
  state.history.forEach(function(h){
    if(daysBetween(h.date, todayStr()) < w && histIds(h).indexOf(id) >= 0) n++;
  });
  return n;
}
function redCountWeek(){
  var n = 0;
  state.history.forEach(function(h){
    if(daysBetween(h.date, todayStr()) >= 7) return;
    var ids = histIds(h);
    if(ids.some(function(id){ var it = findItem(id); return it && it.red; })) n++;
  });
  return n;
}

function slotsOf(combo){
  /* extra = 你自己多加的菜：可以再来一道蛋白、再来一道蔬菜。
     它们跟主菜一样算动手时间、算器具、算 7 天重复，只是不参与自动排菜 */
  return [combo.protein, combo.fiber, combo.carb].concat(combo.extra || []).filter(Boolean);
}

function evaluate(combo, date, opts){
  var win = state.settings.window;
  /* 脂肪是加料，不参与硬约束与打分；多加的菜一起算 */
  var slots = slotsOf(combo);
  var hand = slots.reduce(function(a,x){ return a + x.hand; }, 0);
  /* force = 人点名要这道菜。这时不返回失败，而是把违规全收齐往下算：
     界面要显示动手分钟、要洗几件锅，光一个 why 是渲染不出来的 */
  var force = !!(opts && opts.force);
  var viol = [];

  /* 硬约束 1：纤维必须有一份（蛋白自带纤维可顶替） */
  if(!(combo.fiber || slots.some(function(x){ return x.fiber; }))) viol.push('没有纤维');

  /* 硬约束 2：同一时刻只能一道要盯锅的 */
  if(slots.filter(function(x){ return x.fire === 'watch'; }).length > 1) viol.push('两道都要盯锅');

  /* 硬约束 3：动手时间不能超过窗口 */
  if(hand > win) viol.push('动手 ' + hand + ' 分钟，超过 ' + win + ' 分钟窗口');

  /* 硬约束 4：器具 ≤ 2 件（洗锅也算时间）
     原来只数「有没有水锅 + 有没有炒锅」，两次自增最大就是 2，
     pots > 2 永远不会成立，这条约束从来没拦过任何组合；
     空气炸锅、微波炉也完全没计入。改成按去重后的器具集合数。 */
  var vs = {};
  slots.forEach(function(x){
    var v = x.vessel;
    if(!v || v === 'none' || v === 'pre' || v === 'microwave') return;  /* 微波炉不用洗锅 */
    if(v === 'steamer') v = 'water';                                    /* 蒸屉挂在水锅上 */
    vs[v] = 1;
  });
  var pots = Object.keys(vs).length;
  if(pots > 2) viol.push('器具超过 2 件，要洗 ' + pots + ' 件');

  /* 硬约束 5：同一道菜 7 天内不重复；同一主料 3 天内不重复 */
  for(var i = 0; i < slots.length; i++){
    var it = slots[i];
    var d = eatenDaysAgo(it.id);
    if(d !== null && d < 7) viol.push(it.n + ' 7 天内吃过');
    var ds = stapleDaysAgo(it.staple);
    if(ds !== null && ds < 3) viol.push(it.staple + ' 主料 3 天内用过');
  }

  /* 硬约束 6：频率上限。cap 是「每周几次」，0.5 表示两周 1 次。
     不能直接拿整数计数和小数比：1 >= 0.5 和 1 >= 1 是同一件事，
     两周 1 次的菜第 8 天就会被放回来。窗口要按 cap 放大。 */
  for(var j = 0; j < slots.length; j++){
    var s2 = slots[j];
    if(s2.cap != null){
      var span = s2.cap >= 1 ? 7 : Math.round(7 / s2.cap);
      var lim = s2.cap >= 1 ? s2.cap : 1;
      if(weekCount(s2.id, span) >= lim){
        viol.push(s2.n + (s2.cap >= 1 ? ' 本周次数已满' : ' 这两周已经排过了'));
      }
    }
  }

  /* 不是强制模式就按老规矩判不合格：自动推荐只排合规的组合，一条都不放宽。
     强制模式继续往下走，把分数、动手分钟、器具数一起算出来给界面用 */
  if(!force && viol.length) return {ok:false, why:viol[0], viol:viol};

  /* ---------- 打分 ---------- */
  var seen = {}, needIds = [];
  slots.forEach(function(x){ (x.needs || []).forEach(function(id){ if(!seen[id]){ seen[id] = 1; needIds.push(id); } }); });

  var have = 0, expiring = 0, missing = [];
  needIds.forEach(function(id){
    if(isPantry(id)) return;          /* 常备品不参与库存打分：它对每道菜都一样，加了只会稀释信号 */
    var inv = invOf(id);
    if(inv){
      have++;
      if(daysBetween(date, inv.exp) <= 2) expiring++;
    } else missing.push(id);
  });

  var s = expiring * 3 + have * 2 - missing.length * 1;

  /* 久没吃 */
  var gap = 10;
  slots.forEach(function(x){
    var d = eatenDaysAgo(x.id);
    if(d !== null && d < gap) gap = d;
  });
  s += Math.min(3, gap / 3);

  /* 红肉频率（软惩罚，一周 2 次以上递减） */
  var red = redCountWeek();
  if(red >= 2 && slots.some(function(x){ return x.red; })) s -= 4;

  /* 时间余量：把窗口用满会紧张 */
  if(hand > win - 3) s -= 1.5;
  if(hand > win - 1) s -= 4;

  /* 周末菜加成：只在周末模式生效。周末菜本来就贵工夫，
     不加这一下，它们跟快手菜平起平坐，永远排不出来 */
  if(opts && opts.wk && slots.some(function(x){ return x.wk; })) s += 4;

  /* 口味搭配：权重为 0，只记录 */
  var taste = tastePenalty(slots);
  s += TASTE_W * taste.pen;

  return {
    ok: viol.length === 0, why: viol.join('、'), viol: viol,
    score:s, hand:hand, pots:pots,
    watch: slots.filter(function(x){ return x.fire === 'watch'; }).length,
    missing: missing, expiring: expiring, gap: gap, taste: taste
  };
}

/* 三条口味规则：双酸、双辣、两道都浓且没有清口的 */
function tastePenalty(slots){
  var sour = slots.filter(function(x){ return x.taste[1] >= 2; }).length;
  var spicy = slots.filter(function(x){ return x.taste[2] >= 2; }).length;
  var rich = slots.filter(function(x){ return x.taste[0] >= 2; }).length;
  var plain = slots.some(function(x){ return x.taste[0] <= 0; });
  var p = 0, hits = [];
  if(sour >= 2){ p++; hits.push('双酸'); }
  if(spicy >= 2){ p++; hits.push('双辣'); }
  if(rich >= 2 && !plain){ p++; hits.push('两道都浓'); }
  return {pen:p, hits:hits};
}

function enumerate(date, allowWk, allowViol){
  var out = [];
  /* 工作日只从工作日菜里排。这道闸设在候选池，不设在打分里——
     打分能让周末菜排上来，也能让它们挤掉仅有的几个快手菜 */
  var dayOk = function(x){ return allowWk || !x.wk; };
  var P = pool('protein').filter(dayOk), F = pool('fiber').filter(dayOk), C = pool('carb').filter(dayOk);
  var sk = state.today.skipped || [];
  var lk = state.today.locks || {};

  for(var i = 0; i < P.length; i++){
    if(lk.protein && P[i].id !== lk.protein) continue;
    if(sk.indexOf(P[i].id) >= 0) continue;
    for(var j = 0; j < C.length; j++){
      if(lk.carb && C[j].id !== lk.carb) continue;
      if(sk.indexOf(C[j].id) >= 0) continue;
      var fList = P[i].fiber ? F.concat([null]) : F;
      for(var k = 0; k < fList.length; k++){
        var f = fList[k];
        if(f){
          if(lk.fiber && f.id !== lk.fiber) continue;
          if(sk.indexOf(f.id) >= 0) continue;
        } else if(lk.fiber){ continue; }
        {
          var combo = {protein:P[i], fiber:f, carb:C[j]};
          var ev = evaluate(combo, date, {wk:!!allowWk, force:!!allowViol});
          if(ev.ok || allowViol) out.push({combo:combo, ev:ev});
        }
      }
    }
  }
  /* 并列时按「久没吃 → 动手更少 → id」稳定打破，保证同样输入必然同样输出 */
  out.sort(function(a,b){
    if(b.ev.score !== a.ev.score) return b.ev.score - a.ev.score;
    if(b.ev.gap !== a.ev.gap) return b.ev.gap - a.ev.gap;
    if(a.ev.hand !== b.ev.hand) return a.ev.hand - b.ev.hand;
    var ka = a.combo.protein.id + a.combo.carb.id + (a.combo.fiber ? a.combo.fiber.id : '');
    var kb = b.combo.protein.id + b.combo.carb.id + (b.combo.fiber ? b.combo.fiber.id : '');
    return ka < kb ? -1 : (ka > kb ? 1 : 0);
  });
  return out;
}

function recommend(allowWk){
  var wk = (allowWk == null) ? weekendMode() : !!allowWk;
  /* 先把你锁住的（自己点名要的）记下来：下面几层兜底会清空 locks，
     清掉之后再想恢复就没处找了 */
  var lk0 = {};
  Object.keys(state.today.locks || {}).forEach(function(k){ lk0[k] = state.today.locks[k]; });
  var list = enumerate(todayStr(), wk);

  /* 第二层：你自己点名要的那道菜本身就撞规矩（7 天内吃过、两道盯锅），
     于是「锁住它」的组合一个都过不了校验。这时不能把你点的那道顺手换掉——
     保住你的选择，其余的放宽规矩凑一份。
     必须排在「清空重排」之前：清掉 locks 再找，一定能找到合规的一份，
     但那份里已经没有你要的菜了，等于偷偷把你的选择抹掉 */
  if(!list.length && (lk0.protein || lk0.fiber || lk0.carb)){
    state.today.locks = lk0;
    list = enumerate(todayStr(), wk, true);
    if(list.length) toast('你定的那道留着，其余按放宽的规矩排');
  }

  if(!list.length){
    state.today.skipped = [];
    state.today.locks = {};
    list = enumerate(todayStr(), wk);
    if(list.length) toast('今天备选差不多了，从头再给你排');
  }
  /* 整格都是周末菜、或者都被限量和 7 天规则挡住时，别让人对着一句
     「凑不出三样」发呆：放开周末菜，但说清是破例 */
  if(!list.length && !wk){
    state.today.skipped = [];
    state.today.locks = {};
    list = enumerate(todayStr(), true);
    if(list.length) toast('工作日菜凑不出一顿，今天破例排了周末菜');
  }
  return list.length ? list[0] : null;
}

/* ============================================================
   派生信息
   ============================================================ */
function prepList(combo){
  var out = [], seen = {};
  slotsOf(combo).forEach(function(x){
    (x.prep || []).forEach(function(p){
      /* am:1 = 早上现做，不能提前。混进「今晚」清单会让用户白干一遍（上浆过夜会脱浆） */
      if(p.am) return;
      var k = p.text;
      if(seen[k]) return;
      seen[k] = 1;
      out.push({min:p.min, text:p.text, ph:p.ph, from:x.n});
    });
  });
  out.sort(function(a,b){ return b.min - a.min; });
  return out;
}
function missingOf(combo){
  var seen = {}, out = [];
  slotsOf(combo).forEach(function(x){
    (x.needs || []).forEach(function(id){
      if(seen[id]) return;
      seen[id] = 1;
      if(!stockedOf(id)) out.push(id);   /* 常备品永远算有，不进采购单 */
    });
  });
  return out;
}
function expiringOf(combo){
  var seen = {}, out = [];
  slotsOf(combo).forEach(function(x){
    (x.needs || []).forEach(function(id){
      if(seen[id]) return;
      seen[id] = 1;
      var inv = invOf(id);
      if(inv){
        var d = daysBetween(todayStr(), inv.exp);
        if(d <= 2) out.push({id:id, d:d});
      }
    });
  });
  return out;
}

function whyLines(combo, ev){
  var out = [];
  var exp = expiringOf(combo);
  if(exp.length){
    out.push(exp.map(function(x){ return ingName(x.id); }).join('、') + (exp[0].d <= 0 ? ' 今天到期，先吃掉' : ' 还剩 ' + exp[0].d + ' 天，先吃掉'));
  }
  var p = combo.protein;
  var d = eatenDaysAgo(p.id);
  if(d === null) out.push(p.n + ' 最近没做过，正好换一换');
  else out.push(p.n + ' 已经 ' + d + ' 天没吃了');
  if(ev.hand <= state.settings.window - 5) out.push('动手只有 ' + ev.hand + ' 分钟，窗口还剩 ' + (state.settings.window - ev.hand) + ' 分钟');
  else out.push('动手 ' + ev.hand + ' 分钟，用在 ' + state.settings.window + ' 分钟窗口里刚好');
  if(redCountWeek() >= 2 && !slotsOf(combo).some(function(x){ return x.red; })) out.push('本周红肉已 ' + redCountWeek() + ' 次，今天排的是白肉/豆制品');
  return out.slice(0, 3);
}

function morningPlan(combo){
  var slots = slotsOf(combo);
  var water = slots.filter(function(x){ return x.vessel === 'water' || x.vessel === 'steamer'; })
                   .sort(function(a,b){ return b.wall - a.wall; });
  var pan = slots.filter(function(x){ return x.vessel === 'pan'; });
  var dev = slots.filter(function(x){ return x.vessel === 'microwave' || x.vessel === 'airfryer'; });
  var lines = [];
  if(water.length){
    lines.push({k:'水锅', v:'水开 → ' + water.map(function(x){ return x.n + ' ' + x.wall + ' 分'; }).join(' → ') + '（一锅到底，不换水）'});
  }
  if(pan.length){
    lines.push({k:'灶眼', v:pan.map(function(x){ return x.n + ' ' + x.wall + ' 分'; }).join('、') + (water.length ? '（另一个火，与水锅并行）' : '')});
  }
  if(dev.length){
    lines.push({k:'设备', v:dev.map(function(x){ return x.n + '（' + DEVN[x.vessel] + ' ' + x.wall + ' 分）'; }).join('、')});
  }
  if(!lines.length) lines.push({k:'免火', v:'全部免火，只摆盘。'});
  return lines;
}

function reroll(){
  /* 今天已经记过账就先整体回滚（库存 + 历史），否则换一道再记一次，
     前一批扣掉的料就永远回不来了 */
  if(state.today.eaten) undoConsumed();
  /* 你自己多加的菜要留住：换主菜不该把你加的也一起换掉 */
  var keep = (state.today.pick && state.today.pick.combo.extra) ? state.today.pick.combo.extra.slice() : [];
  var r = recommend();
  if(!r){ state.today.pick = null; }

  else{
    var c = {protein:r.combo.protein, fiber:r.combo.fiber, carb:r.combo.carb, extra:keep};
    var ev = evaluate(c, todayStr(), {force:true});
    state.today.pick = {combo:c, ev:ev};

function eat(){
  var c = state.today.pick.combo;
  var need = {}, order = [];
  slotsOf(c).forEach(function(x){
    (x.needs || []).forEach(function(id){
      if(!need[id]){ need[id] = 0; order.push(id); }
      need[id] += 1;            /* 两道菜都用番茄就扣两个 */
    });
  });
  var consumed = [];
  /* 同一样食材可能有好几行（比如过期的旧行 + 新买的一行）。
     invAll 只取第一行，会扣到过期那行上；这里按到期日从早到晚扣，
     过期的行不扣——它不该被当成吃掉的东西，冰箱页会单独提示。 */
  function takeFrom(id, want){
    var rows = state.inventory.filter(function(x){ return x.id === id && x.qty > 0; });
    rows.sort(function(a, b){ return daysBetween(todayStr(), a.exp) - daysBetween(todayStr(), b.exp); });
    var left = want;
    rows.forEach(function(r){
      if(left <= 0) return;
      if(daysBetween(todayStr(), r.exp) < 0) return;
      var n = Math.min(left, r.qty);
      r.qty -= n; left -= n;
      /* 到期日/名字一起记：撤销时这行可能已被 invPurge 删掉，重建要按原批次还原 */
      consumed.push({id:id, qty:n, exp:r.exp, name:r.name, custom:r.custom});
    });
  }
  order.forEach(function(id){ takeFrom(id, need[id]); });
  invPurge();
  state.today.consumed = consumed;
  state.today.eaten = true;
  /* 同一天只留一条：再记一次是「替换今天这顿」，不是追加一顿 */
  state.history = state.history.filter(function(h){ return h.date !== todayStr(); });
  var extraIds = (c.extra || []).map(function(x){ return x.id; });
  var rec = { date:todayStr(), p:c.protein?c.protein.id:null, f:c.fiber?c.fiber.id:null,
              c:c.carb?c.carb.id:null,
              name:slotsOf(c).map(function(x){ return x.n; }).join(' + ') };
  if(extraIds.length) rec.x = extraIds;
  state.history.unshift(rec);
  save(); render(); toast('记下了，今晚的活在上面');
}

/* 撤掉今天这次记账：还原库存、删掉今天的记录。不提示不渲染，供换餐复用 */
function undoConsumed(){
  (state.today.consumed || []).forEach(function(x){
    if(!x.qty) return;
    var inv = invAll(x.id);
    if(inv) inv.qty += x.qty;
    else{
      var row = {id:x.id, qty:x.qty, exp:x.exp || dstr(3), added:todayStr()};
      if(x.name) row.name = x.name;
      if(x.custom) row.custom = 1;
      state.inventory.push(row);
    }
  });
  state.history = state.history.filter(function(h){ return h.date !== todayStr(); });
  state.today.consumed = null;
  state.today.eaten = null;
}

/* ============================================================
   今日灵感
   每天早上 6:30 的任务往早餐库里追加一道菜，再导成 recs.json 推到仓库。
   打开 app 顺手取一次，取到就在本机存一份——没网也还能看上次的。

   「收进菜谱」才真正落进菜谱，从此参与推荐。

var REC_KEEP = 3;    /* 收起状态先露几道 */
var REC_SHOW = 12;   /* 这个模块一次最多放几道。删掉一道就从后备补一道，
                        所以点 ✕ 不会把可看的数量越删越少 */

/* 一天只取一次，失败就安静地用上次的：早上急着看吃什么，不该卡在一个请求上 */
function loadRecs(force){
  if(typeof fetch !== 'function') return;
  var now = todayStr();
  var last = Number(state.recFetched || 0);
  if(!force){
    /* 今天已经取到了就不再问网络 */
    if(state.recs && state.recs.at === now) return;
    /* 还没取到今天的，最多 5 分钟问一次。
       原来这里挡 30 分钟：6:28 顺手开过一次 app，6:31 新菜推上来也看不到，
       非得等半小时后再开一次，看起来就像「新菜没推成功」 */
    if(Date.now() - last < 5 * 60 * 1000) return;
  }
  state.recFetched = Date.now();
  fetch('./recs.json?d=' + now, { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(!d || !d.recs || !d.recs.length) return;
      state.recs = { at: d.at || now, list: d.recs };
      save();
      /* 在菜谱页就把那条窄带补上；正在搜东西就别打断人 */
      if(ui.tab === 'lib' && !libQ()) renderKeep();
    })
    .catch(function(){});
}

/* ============================================================
   菜谱包有没有新版
   灵感清单可以整份替换，菜谱库不行——它是你的数据，装包是一次带规则的合并。
   所以这里不自动装，只查一个几百字节的版本号：不一样就在菜谱页顶部提示一句，
   你点一下才真的装。没有更新就完全不出现。
   ============================================================ */
/* 算法必须和根目录 packver.js 里的 sigOf() 一字不差，两边算同一份数据得到同一个串 */
function packSigOf(list){
  var s = (list || []).map(function(r){
    return [r.key || '', r.n || '', Number(r.v) || 0, r.m ? String(r.m).length : 0].join('~');
  }).join('|');
  var h = 2166136261, i;
  for(i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return ('0000000' + h.toString(16)).slice(-8) + '-' + (list || []).length;
}

/* 该不该提示，只看三样：仓库里有指纹、它不是本机这版、你也没按过 ✕ */
function packUpdOf(d){
  if(!d || !d.sig) return null;
  if(d.sig === state.packSig || d.sig === state.packSigSkip) return null;
  return d;
}

function checkPack(force){
  if(typeof fetch !== 'function') return;
  var last = Number(state.packChk || 0);
  if(!force && Date.now() - last < 20 * 60 * 1000) return;
  state.packChk = Date.now();
  fetch('./pack-ver.json?d=' + todayStr(), { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(!d || !d.sig) return;
      ui.packVer = d;
      var was = ui.packUpd;
      ui.packUpd = packUpdOf(d);
      /* 只有结论变了才重画，别每次开 app 都闪一下 */
      if(!!was !== !!ui.packUpd && ui.tab === 'lib' && !libQ()) renderKeep();
    })
    .catch(function(){});
}

/* 早餐库的食材名 → 这边的食材 id。对不上就登记一条新食材，
   但**不进库存**（只记「这道菜要用它」，不是「家里有它」） */
function guessGroup(nm){
  var s = String(nm);
  if(/菠菜|生菜|油麦|茼蒿|空心菜|菜心|小白菜|香菜|韭菜|芹|罗勒|薄荷/.test(s)) return '叶菜';
  if(/番茄|西红柿|黄瓜|茄子|西葫芦|彩椒|青椒|南瓜|冬瓜|丝瓜|秋葵|豆角|荷兰豆|苦瓜|芦笋/.test(s)) return '果菜';
  if(/菌|菇|木耳|银耳|海带|紫菜|海苔/.test(s)) return '菌菇';
  if(/红薯|土豆|萝卜|山药|芋|藕|玉米|洋葱|蒜|姜|葱/.test(s)) return '根茎';
  if(/肉|鸡|牛|猪|羊|虾|鱼|培根|火腿|香肠|三文鱼/.test(s)) return '肉类';
  if(/豆腐|豆干|腐竹|豆浆|毛豆|蛋白粉/.test(s)) return '豆制品';
  if(/苹果|香蕉|蓝莓|橙|柠檬|莓|桃|梨|葡萄|牛油果/.test(s)) return '水果';
  return '其他';
}
function recNeedIds(rec){
  var out = [], seen = {};
  (rec.needs || []).forEach(function(nm){
    var id = matchIng(nm);
    if(id){ if(!seen[id]){ seen[id] = 1; out.push(id); } return; }
    var clean = normIngName(nm);
    if(!clean || seen[clean]) return;
    seen[clean] = 1;
    var nid = newIngId();
    state.ings[nid] = { n: clean, g: guessGroup(clean), d: 3 };
    out.push(nid);
  });
  return out;
}
/* 一道推荐菜 → 这边的菜谱草稿：时间、火、锅都按做法推，实在推不准也就是个默认值，
   反正落库后能改。
   不过只要推荐数据里写了 cat / hand / wall / fire / vessel / staple / ids / taste，
   就一律以写的为准——猜出来的东西能跑，但落进菜谱库就成了错的分类和错的时间，
   到时候还得自己一道一道改。 */
var CAT_LABEL = { protein:'蛋白', fiber:'纤维', carb:'碳水' };

/* 归到哪一格：显式写了就用它。没写的才按用料猜——猜只能救急，
   一道带芝士的吐司会被认成蛋白，所以能用写的就别用猜的 */
function recCatOf(rec){
  if(rec && CAT_LABEL[rec.cat]) return rec.cat;
  var s = (rec && rec.needs || []).join(' ');
  var cnt = function(re){ var m = s.match(re); return m ? m.length : 0; };
  var p = cnt(/鸡蛋|鸡胸|鸡腿|鸡肉|牛肉|猪肉|羊肉|虾|鱼|豆腐|芝士|火腿|金枪鱼|培根|毛豆|酸奶|牛奶|蛋/g);
  var c = cnt(/吐司|面包|燕麦|米饭|饭团|面条|意面|荞麦|贝果|馒头|藜麦|卷饼|土豆|红薯|玉米|面皮/g);
  var f = cnt(/西兰花|菠菜|生菜|番茄|黄瓜|彩椒|蘑菇|香菇|胡萝卜|南瓜|茄子|油菜|空心菜|木耳|金针菇|蔬菜|沙拉/g);
  if(c && c >= p && c >= f) return 'carb';
  if(f > p) return 'fiber';
  return 'protein';
}

function knownIng(id){ return !!(id && (ING[id] || (state.ings && state.ings[id]))); }

function recToDraft(rec){
  var ids = (rec.ids && rec.ids.length)
    ? rec.ids.filter(knownIng)
    : [];
  var needs = ids.length ? ids.slice() : recNeedIds(rec);
  var cat = recCatOf(rec);
  var fire = rec.fire || (rec.method === '煎' ? 'watch'
           : (rec.method === '微波' || rec.method === '免煮' || rec.method === '搅拌') ? 'off'
           : 'none');
  var vessel = rec.vessel || (rec.method === '煎' ? 'pan'
             : rec.method === '煮' ? 'water'
             : rec.method === '蒸' ? 'steamer'
             : rec.method === '微波' ? 'microwave'
             : rec.method === '烤' ? 'airfryer' : 'none');
  var cook = Math.max(1, Number(rec.cook) || 5);
  var hand = Number(rec.hand) || cook;
  var wall = Number(rec.wall) || hand;
  var staple = knownIng(rec.staple) ? rec.staple : (needs[0] || '');
  var lines = [];
  /* 早餐才是「前一晚」；一道晚上现做的菜写成前一晚，落库后看着就是错的 */
  if((rec.prep || []).length) lines.push((rec.prepLabel || '前一晚') + '：' + rec.prep.join('；'));
  (rec.steps || []).forEach(function(x, i){ lines.push((i + 1) + '. ' + x); });
  /* 出处只写「就是这一版」的：参考版写进菜谱库，等于给以后翻菜谱的自己一个错链接 */
  var f = (rec.ref && typeof rec.ref === 'object') ? rec.ref : {};
  var exact = f.match === 'exact';
  return {
    n: rec.n, cat: cat, hand: hand, wall: wall, fire: fire, vessel: vessel,
    staple: staple, needs: needs,
    taste: (Array.isArray(rec.taste) && rec.taste.length === 3) ? rec.taste.slice() : [0, 0, 0],
    cuisine: rec.cuisine || '中式', lv: rec.lv || 'L1',
    m: lines.join('\n'), prep: [],
    key: 'rc:' + rec.id,
    src: exact ? String(f.url || '') : '',
    author: exact ? String(f.author || '') : '',
    note: (rec.tags || []).join(' · ')
  };
}

/* 这道是不是已经在今天这顿了（「试一试」放进来的 id 是 rc_ 开头） */
function recInToday(id){
  var pk = state.today && state.today.pick;
  if(!pk || !pk.combo) return false;
  var want = 'rc_' + id;
  return slotsOf(pk.combo).some(function(x){ return x && x.id === want; });
}

/* 试一试：换掉今天同类的那一格。
   原来是「额外加一道」，所以点了之后原来推荐的那道还在，一餐变成四道菜——
   想吃这道，本来就是想让它顶掉今天那格，加菜另有菜谱页的「＋」。
   只进今天、不进菜谱库；真要留下再点「收进菜谱」 */
function recTry(id){
  var rec = recById(id);
  if(!rec) return;
  var pick = state.today.pick;
  if(!pick){ toast('今天这顿还没排出来，先去加几道菜'); return; }
  var d = recToDraft(rec);
  d.id = 'rc_' + id;
  /* 只看三格：早先版本把它当「多加的一道」放进了 extra，那种要顺手换成正式一格 */
  var inSlot = ['protein','fiber','carb'].some(function(k){
    return pick.combo[k] && pick.combo[k].id === d.id;
  });
  if(inSlot){ toast('这道已经在今天这顿了'); return; }
  var cat = d.cat;
  var c = {protein:pick.combo.protein, fiber:pick.combo.fiber, carb:pick.combo.carb,
           extra:(pick.combo.extra || []).filter(function(x){ return x.id !== d.id; })};
  c[cat] = d;
  var ev = evaluate(c, todayStr(), {force:true});
  if(ev.ok){ applyPick(c, ev, 0, cat); return; }
  /* 撞规矩不拦，先问一句——跟「换一道」走同一条路 */
  ui.clash = {combo:c, ev:ev, cat:cat, name:d.n};
  ui.sheetType = 'clash'; ui.sheet = true; renderSheet();
}
/* 收进菜谱：落库，以后再装包也不会被覆盖 */
function recKeep(id){
  var rec = recById(id);
  if(!rec) return;
  var d = recToDraft(rec);
  saveRecipe(d);
  state.recDone['r:' + id] = 1;
  if(ui.recInfo === id){ ui.recInfo = ''; ui.recFull = ''; }
  save();
  /* 在菜谱页就地刷新，别整页重绘——正翻到一半的位置不能跳 */
  if(ui.tab === 'lib') renderKeep(); else render();
  toast('「' + rec.n + '」收进菜谱了');
}
function recSkip(id){
  state.recDone['r:' + id] = 1;
  if(ui.recInfo === id){ ui.recInfo = ''; ui.recFull = ''; }
  save();
  if(ui.tab === 'lib') renderKeep(); else render();
  toast('这条不再出现');
}

/* 菜谱页里默认只占一行的那条窄带：不点开也看得出今天有什么 */
function recStripHtml(){
  var all = recAll();
  if(!all.length) return '';
  var txt = all.length > 1
    ? '今日 ' + all.length + ' 道 · <b>' + esc(all[0].n) + '</b>'
    : '<b>' + esc(all[0].n) + '</b>';
  return '<button class="recstrip" data-act="recsOpen">' +
         '<span class="rstag">灵感</span>' +
         '<span class="rstxt">' + txt + '</span>' +
         '<span class="rsmore">看看 ›</span></button>';
}
/* 展开还是收起，只看 ui.recsOpen——刷新页面就回到收起，不长期占地方 */
function viewRecsBlock(){
  if(!recAll().length) return '';
  return ui.recsOpen ? viewRecsHtml() : recStripHtml();
}
function refreshRecs(){
  var box = document.getElementById('recZone');
  if(box) box.innerHTML = viewRecsBlock();
}

/* 「为什么今天推它」和「出处口碑」：这两行决定点不点「试一试」，
   所以放在收起状态也看得见，不藏进展开里 */
function recWhyHtml(r){
  var h = '';
  if(r.why) h += '<div class="recwhy">' + esc(r.why) + '</div>';
  var f = (r.ref && typeof r.ref === 'object') ? r.ref : null;
  if(!f || !(f.plat || f.url)){
    return h + '<div class="recsrc muted">家常做法 · 没有单一出处</div>';
  }
  var bits = [];
  var same = (f.match === 'exact');
  if(f.plat) bits.push(String(f.plat));
  if(f.score) bits.push(String(f.score) + ' 分');
  if(f.made) bits.push(String(f.made) + ' 人做过');
  /* 平台菜名跟我们不完全一样时写「参考」，别让人以为点开就是这一版 */
  var line = esc((same ? '' : '参考 ') + bits.join(' · '));
  var u = safeUrl(f.url);
  if(u) line += '<a class="recopen" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' +
                '· ' + (same ? '看原菜谱 ›' : '看同类做法 ›') + '</a>';
  h += '<div class="recsrc">' + line + '</div>';
  /* 一句真实评价比一个分数更能说明「大家觉得怎么样」 */
  if(f.say) h += '<div class="recsay">“' + esc(f.say) + '”' + (f.author ? '　—— ' + esc(f.author) : '') + '</div>';
  return h;
}

function viewRecsHtml(){
  var all = recAll();
  if(!all.length) return '';
  var got = ui.recsAll ? all : all.slice(0, REC_KEEP);
  var at = (state.recs && state.recs.at) ? String(state.recs.at).slice(5).replace('-', '/') + ' 更新' : '';
  var h = '<div class="card recs"><div class="card-h"><b>今日灵感</b><span>' +
          (at ? at + ' · ' : '') + all.length + ' 道' +
          '<button class="recfold" data-act="recsClose">收起</button></span></div>';
  h += '<div class="hint" style="margin:-4px 0 4px">每天 6:30 加一道 · 点菜名看做法 · 试一试换掉今天同类那道</div>';
  got.forEach(function(r){
    /* 「新灵感」这条对每道都成立，摆在每一行上等于没说 */
    var tags = (r.tags || []).filter(function(t){ return t && t !== '新灵感'; }).slice(0, 2);
    var meta = [(r.cook ? r.cook + '′' : ''), r.method, r.cuisine, tags.join('/')].filter(Boolean).join(' · ');
    var catK = recCatOf(r);
    var inToday = recInToday(r.id);
    var open = ui.recInfo === r.id;
    var full = ui.recFull === r.id;
    var needs = (r.needs || []).join('、');
    var prep = r.prep || [];
    var allSteps = r.steps || [];
    /* 默认只给前两步：全套铺开会把下面的菜谱列表推出去一屏多，
       真想照着做再点「看完整做法」 */
    var steps = (full ? allSteps : allSteps.slice(0, 2))
                .map(function(x, i){ return (i + 1) + '. ' + x; }).join('\n');
    h += '<div class="recitem"><div class="recrow"><div class="recmain">' +
         '<div class="recnm"><span class="reccat ' + catK + '">' + CAT_LABEL[catK] + '</span>' +
         '<button class="recname" data-act="recInfo" data-id="' + esc(r.id) + '">' + esc(r.n) + '</button></div>' +
         '<div class="mt">' + esc(meta) + '</div></div>' +
         '<div class="recbtn">' +
         '<button data-act="recTry" data-id="' + esc(r.id) + '"' + (inToday ? ' class="rcdone"' : '') + '>' +
         (inToday ? '已在今天' : '试一试') + '</button>' +
         '<button data-act="recKeep" data-id="' + esc(r.id) + '">收进菜谱</button>' +
         '<button class="recx" data-act="recSkip" data-id="' + esc(r.id) + '" title="不看了">✕</button>' +
         '</div></div>' + recWhyHtml(r);
    if(open){
      /* 早餐写「前一晚」，现做的菜要写「下锅前」——固定写死前一晚，落库后看着就是错的 */
      var pl = r.prepLabel || '前一晚';
      var prepTxt = prep.join('；');
      if(prep.length && pl !== '前一晚' && prepTxt.indexOf(pl) !== 0) prepTxt = pl + '：' + prepTxt;
      h += '<div class="recdet">' +
           (needs ? '<div><span class="k">用料</span>' + esc(needs) + '</div>' : '') +
           (prep.length
             ? (full ? '<div><span class="k">提前</span>' + esc(prepTxt) + '</div>'
                     : '<div><span class="k">提前</span>' + esc(pl + '要先做 ' + prep.length + ' 件事') + '</div>')
             : '') +
           (steps ? '<div class="steps"><span class="k">做法</span>\n' + esc(steps) + '</div>' : '') +
           (!needs && !prep.length && !allSteps.length ? '<div>这道只有名字，还没拿到用料和做法。</div>' : '') +
           (allSteps.length > 2 || (full && prep.length > 1)
             ? '<button class="morebtn" data-act="recFull" data-id="' + esc(r.id) + '">' +
               (full ? '收起点' : '看完整做法（' + allSteps.length + ' 步）') + '</button>'
             : '') +
           '</div>';
    }
    h += '</div>';
  });
  if(all.length > REC_KEEP){
    h += '<button class="morebtn" data-act="recMore">' + (ui.recsAll ? '收起点' : '看全部 ' + all.length + ' 道') + '</button>';
  }
  return h;
}

function viewToday(){
  var pick = state.today.pick;
  if(!pick){
    /* 一道菜都没有：新装的第一屏。别让人对着一句「今天没有可选的了」发呆 */
    if(!ITEMS.length){
      return '<div class="card">' +
        '<div style="font-size:15.5px;font-weight:600;margin-bottom:6px">还没有菜谱</div>' +
        '<div style="font-size:13px;color:#8A8478;line-height:1.75;margin-bottom:14px">' +
          '这次把自带的示例数据去掉了，从空的开始。两条路，选一条就行：<br>' +
          '<b style="color:#3C6B4F">① 导入现成的</b>　设置 → 导入备份，选 seed-recipes.json 那个文件<br>' +
          '<b style="color:#3C6B4F">② 自己加</b>　填个菜名就能存，其余自动判断' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn btn-primary" data-act="sheetAdd" style="font-size:14px">＋ 加一道菜</button>' +
          '<button class="btn btn-ghost" data-act="rsOpen" style="font-size:14px">导入菜谱</button>' +
        '</div></div>';
    }
    return '<div class="card">今天凑不出三样。' +
      '<div style="font-size:12.5px;color:#8A8478;margin-top:6px;line-height:1.65">' +
      '蛋白、蔬菜、主食三类，每类至少 3 道才排得出一顿。</div>' +
      '<button class="btn btn-ghost" data-act="sheetAdd" style="margin-top:10px;font-size:13px">＋ 加一道菜</button></div>';
  }

  var c = pick.combo, ev = pick.ev;
  var win = state.settings.window;

  var h = '';
  h += '<div class="top"><div><div class="date">' + dateLabel() + '</div><h1>今天这顿</h1></div>' +
       '<button class="iconbtn" data-act="sheet">☰</button></div>';

  if(state.today.eaten){
    h += '<div class="banner">已记入历史，库存也扣掉了。<button data-act="undoEat">改主意</button></div>';
  }

  /* 今日灵感不在这里——首页第一眼该看到的是今天吃什么。
     灵感挪到菜谱页，见 viewLib() 里那条窄带 */

  h += '<div class="card">';
  h += '<div class="card-h"><span>今天给你排好了</span><b>' + ev.hand + '′ 动手</b></div>';
  h += '<div class="hint" style="margin:-3px 0 9px">' + wkHint() + '</div>';

  /* 自己硬点进来的那道菜：提醒还在，但不拦。不说清楚的话，
     第二天看到「7 天内吃过」会以为程序算错了 */
  if(pick.forced){
    var vv = (ev && ev.viol) || [];
    h += '<div class="pendbar" style="cursor:default">' +
         '这份是你自己定的' + (vv.length ? '，跟规矩有冲突：' + vv.map(function(v){ return esc(v); }).join('、') : '') +
         '。<br>想吃就吃，改主意点下面的「换」。</div>';
  }

  var slotsDef = [
    {k:'protein', label:'蛋白'},
    {k:'fiber',   label:'纤维'},
    {k:'carb',    label:'碳水'}
  ];
  var extras = c.extra || [];
  slotsDef.forEach(function(sd){
    var it = c[sd.k];
    if(!it){
      h += '<div class="slotrow"><div class="slot">' + sd.label + '</div>' +
           '<div class="slotbody"><div class="nm" style="color:#A9A398">这道自带纤维，这格留空</div>' +
           '<div class="mt">想加也可以</div></div>' +
           '<button class="swapbtn" data-act="addslot" data-cat="' + sd.k + '">加</button></div>';
      return;
    }
    var meta = (it.wall !== it.hand ? it.hand + '′动手 · ' + it.wall + '′全程' : it.wall + '′') +
               ' · ' + FIRE[it.fire];
    var done = eatenDaysAgo(it.id);
    if(done !== null) meta += ' · ' + done + ' 天前吃过';
    var expSoon = (it.needs || []).some(function(id){
      var iv = invOf(id);
      return iv && daysBetween(todayStr(), iv.exp) <= 2;
    });
    if(expSoon) meta += ' · <span style="color:#B0453A">库存临期</span>';
    h += '<div class="slotrow"><div class="slot">' + sd.label + '</div>' +
         '<div class="slotbody"><div class="nm">' + esc(it.n) + '</div>' +
         '<div class="mt">' + meta + '</div></div>' +
         '<button class="swapbtn" data-act="swap" data-cat="' + sd.k + '">换</button></div>';
  });

  /* 你自己多加的菜：跟主菜一起算时间、算锅，只是不占三类的位置 */
  extras.forEach(function(it){
    var meta = (it.wall !== it.hand ? it.hand + '′动手 · ' + it.wall + '′全程' : it.wall + '′') +
               ' · ' + FIRE[it.fire];
    var done = eatenDaysAgo(it.id);
    if(done !== null) meta += ' · ' + done + ' 天前吃过';
    /* 左边写这道属于哪一格：加了两道蛋白就两行都写「蛋白」，一眼看得出重复 */
    h += '<div class="slotrow"><div class="slot">' + (CAT_NAME[it.cat] || '加') + '</div>' +
         '<div class="slotbody"><div class="nm">' + esc(it.n) + '</div>' +
         '<div class="mt">' + meta + '</div></div>' +
         '<button class="swapbtn" data-act="unextra" data-id="' + it.id + '">撤</button></div>';
  });
  h += '<div class="slotrow" style="border-top:1px dashed #F0ECE3">' +
       '<div class="slot">＋</div>' +
       '<div class="slotbody"><div class="nm" style="color:#3C6B4F;font-size:12.5px">' +
       (extras.length ? '还想再加一道？' : '想多吃一道就加，不限于三样') + '</div>' +
       '<div class="mt">多加的会算进动手分钟和要洗的锅</div></div>' +
       '<button class="swapbtn" data-act="addmore">加</button></div>';

  h += '</div>';

  /* 统计条 */
  h += '<div class="stats">' +
       '<div class="stat"><b>' + ev.hand + '′</b><span>早上动手</span></div>' +
       '<div class="stat"><b>' + ev.pots + ' 件</b><span>要洗的锅</span></div>' +
       '<div class="stat"><b>' + ev.watch + ' 道</b><span>要盯火</span></div>' +
       '</div>';
  h += '<div class="foot">窗口 ' + win + ' 分钟，用掉 ' + ev.hand + '，剩 ' + Math.max(0, win - ev.hand) + ' 分钟冗余</div>';

  /* 为什么 */
  h += '<div class="card" style="margin-top:12px"><div class="card-h"><b>' +
       (extras.length ? '为什么这么配' : '为什么是这三样') + '</b></div><div class="why">';
  whyLines(c, ev).forEach(function(t){ h += '<div><i>·</i><span>' + esc(t) + '</span></div>'; });
  h += '</div>';
  if(ev.taste.hits.length){
    h += '<div style="font-size:12px;color:#A9A398;margin-top:8px">口味检查：' + ev.taste.hits.join('、') +
         '（权重当前为 0，只记录不拦截）</div>';
  }
  h += '</div>';

  /* 前一晚 */
  var preps = prepList(c);
  var pmin = preps.reduce(function(a,x){ return a + x.min; }, 0);
  h += '<div class="card"><div class="card-h"><b>今晚</b><span>共 ' + pmin + ' 分钟 · 只择不洗</span></div>';
  if(!preps.length) h += '<div class="empty">今晚不用准备，早上直接做。</div>';
  else {
    h += '<ul class="prep">';
    preps.forEach(function(p){
      h += '<li><span class="pm">' + (p.min ? p.min + '′' : '—') + '</span><span class="pt">' + rich(p.text) +
           (p.ph ? '<span class="ph">' + esc(p.ph) + '</span>' : '') + '</span></li>';
    });
    h += '</ul>';
    h += '<div style="font-size:11.5px;color:#A9A398;margin-top:8px">含煮、泡这类不用站着的等待时间</div>';
  }
  h += '</div>';

  /* 早上 */
  h += '<div class="card"><div class="card-h"><b>早上怎么做</b><span>' + ev.hand + ' 分钟</span></div>';
  morningPlan(c).forEach(function(l){
    h += '<div class="pline"><div class="pk">' + l.k + '</div><div class="pv">' + esc(l.v) + '</div></div>';
  });
  h += '<div style="margin-top:12px">';
  slotsOf(c).forEach(function(it){
    h += '<div style="padding:8px 0;border-top:1px dashed #F0ECE3">' +
         '<div style="font-size:13px;font-weight:600">' + esc(it.n) + '</div>' +
         '<div style="font-size:13px;color:#5E5A50;margin-top:2px">' + esc(it.m) + '</div>' +

/* ============================================================
   菜谱搜索
   搜的是「脑子里冒出来的那个词」，所以不限定只搜菜名：
   菜名、用料、作者/标题、做法正文，任意一处对上都算，而且告诉你
   是哪一处对上的——搜「西葫芦」时列表上标「用到 西葫芦」，
   比自己挨道回想快得多。
   ============================================================ */
function libQ(){ return String(ui.libQ || '').trim(); }

function libHits(it, q){
  if(!q) return null;
  var ql = q.toLowerCase();
  if(String(it.n || '').toLowerCase().indexOf(ql) >= 0) return { why:'n' };
  var ing = (it.needs || []).filter(function(id){
    return String(ingName(id) || '').toLowerCase().indexOf(ql) >= 0;
  })[0];
  if(ing) return { why:'ing', ing:ing };
  if((String(it.author || '') + ' ' + String(it.title || '')).toLowerCase().indexOf(ql) >= 0) return { why:'a' };
  var m = String(it.m || ''), i = m.toLowerCase().indexOf(ql);
  if(i >= 0){
    var s = m.lastIndexOf('\n', i) + 1;
    var e = m.indexOf('\n', i);
    if(e < 0) e = m.length;
    return { why:'m', line: m.slice(s, e) };
  }
  return null;
}

/* 命中的字打黄底。先转义再加标记，免得菜名里的 < 把结构冲坏 */
function hlTxt(s, q){
  var e = esc(String(s == null ? '' : s));
  if(!q) return e;
  var p = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try{ return e.replace(new RegExp(p, 'gi'), function(m0){ return '<mark class="hl">' + m0 + '</mark>'; }); }
  catch(err){ return e; }
}

function libListHtml(){
  var q = libQ();
  var list = ITEMS.filter(function(x){ return ui.libCat === 'all' || x.cat === ui.libCat; });
  if(q) list = list.filter(function(x){ return !!libHits(x, q); });

  var h = '';
  if(q) h += '<div class="card-h"><b>搜「' + esc(q) + '」</b><span>找到 ' + list.length + ' 道</span></div>';
  if(!list.length){
    if(q){
      h += '<div class="empty">没找到。搜的是菜名、用料、作者和做法正文——换个词，或者先切回「全部」。</div>' +
           '<button class="btn btn-ghost" data-act="libQClear" style="font-size:13px;margin-top:6px">清空搜索</button>';
    }else{
      h += '<div class="empty">这一格空了。点上面「新建菜谱」补一道。</div>';
    }
    return h;
  }
  list.forEach(function(it){
    var hit = q ? libHits(it, q) : null;
    var inCombo = (state.today.pick ? slotsOf(state.today.pick.combo) : [])
                  .some(function(x){ return x && x.id === it.id; });
    /* 料齐没齐，列表里就告诉你——不用点进去、更不用跑去冰箱页对着看 */
    var missN = (it.needs || []).filter(function(id){ return !stockedOf(id); }).length;
    var tags = (hit && hit.why === 'ing' ? '<span class="tag ok">用到 ' + esc(ingName(hit.ing)) + '</span>' : '') +
               '<span class="tag">' + it.wall + '′</span>' +
               '<span class="tag' + (it.fire === 'watch' ? ' warn' : '') + '">' + FIRE[it.fire] + '</span>' +
               ((it.needs || []).length
                 ? (missN ? '<span class="tag warn">缺 ' + missN + ' 样</span>' : '<span class="tag ok">料齐</span>')
                 : '') +
               (it.ext ? '<span class="tag">补录</span>' : '') +
               (it.wk ? '<span class="tag ok">周末</span>' : '') +
               (it.cap != null ? '<span class="tag warn">限量 ' + (it.cap < 1 ? '两周 1 次' : '每周 ' + it.cap + ' 次') + '</span>' : '') +
               (it.red ? '<span class="tag warn">红肉</span>' : '');
    var mTxt = it.m || '';
    /* 导入的菜做法常常十来行，列表里默认折三行，要看再展开 */
    var isLong = mTxt.split('\n').length > 3 || mTxt.length > 140;
    var open = !!ui.openM[it.id];
    /* 命中落在做法里（菜名/用料里都没有这个词）：把那一行顶上来，
       不然「找到了」却看不见词，等于让人自己去翻 */
    var snip = (hit && hit.why === 'm' && !open) ? '… ' + hit.line : '';
    h += '<div class="rc"><div class="r1"><span class="n">' + hlTxt(it.n, q) + '</span>' +
         (inCombo ? '<span class="tag ok">在今天的餐里</span>'
                  : '<button data-act="use" data-id="' + it.id + '">' +
                    (ui.addMode ? '加' : '换这个') + '</button>') +
         '<button data-act="rEdit" data-id="' + it.id + '" title="编辑" ' +
           'style="background:none;color:#A9A398;padding:4px 6px;font-size:14px">✎</button>' +
         '</div><div class="r2">' + tags + srcLink(it.src) + authorTag(it) + '</div>' +
         '<div class="r3' + (isLong && !open ? ' clamp' : '') + '">' + rich(snip || mTxt) + '</div>' +
         (isLong ? '<button class="morebtn" data-act="rmore" data-id="' + it.id + '">' +
                   (open ? '收起' : '展开做法') + '</button>' : '') +
         '</div>';
  });
  return h;
}

function invRow(x, soon){

  /* 「几道菜用得到」是菜谱和库存之间那条线：没有它，你没法知道买了会不会用不完 */
  var uses = recipesUsing(x.id).length;
  var sub = [gOf(x.id), sh.fresh ? '建议当天吃' : '', '× ' + x.qty,
             uses ? uses + ' 道菜用得到' : ''].filter(Boolean).join(' · ');
  var canUse = uses > 0;

         '<div class="ib"><div class="nm">' + esc(labelOf(x)) + '</div><div class="mt">' + sub + '</div></div>' +

function viewFridge(){

  invList().forEach(function(x){
    var d = invDays(x);
    if(d < 0) dead.push(x);
    else if(d <= 2) soon.push(x);
    else normal.push(x);
  });
  var byExp = function(a,b){ return a.exp < b.exp ? -1 : (a.exp > b.exp ? 1 : 0); };
  soon.sort(byExp); normal.sort(byExp); dead.sort(byExp);

  var h = '<div class="top"><div><div class="date">共 ' + (soon.length + normal.length) + ' 样 · ' +

          '<button class="iconbtn" data-act="sheetAdd">＋</button></div>';

    h += '<div class="card"><div class="card-h"><b>先吃掉这些</b><span>' + soon.length + ' 样</span></div>';
    soon.forEach(function(x){ h += invRow(x, true); });

      h += '<div class="invrow"><div class="ib"><div class="nm" style="color:#A9A398">' + esc(labelOf(x)) + '</div>' +

  h += '<div class="actions" style="margin-top:8px">' +

       '</div>';

       '蛋奶、酸奶、坚果、杂粮、冷冻成品这些常备品不记，自己看着快没了就买。<br>' +
       '做菜点「就吃这个」会自动扣库存，菜谱写到的食材会算进采购清单。</div>';

  /* 常备品不是不存在，只是不跟踪——列出来是为了让你知道「哪些不在这里」 */
  var pl = pantryList();
  h += '<div class="card" style="margin-top:14px"><div class="card-h"><b>不记库存的常备品</b>' +
       '<button class="linkbtn" data-act="sheetPantry" style="font-size:12px">' + pl.length + ' 项 · 管理 ›</button></div>' +
       '<div class="buywrap">' + pl.map(function(id){
         return '<span class="buy fixed"' + (isMyPantry(id) ? ' style="border-style:dashed"' : '') + '>' +
                esc(ingName(id)) + '</span>';

       '</div>';
  return h;
}

/* 把某样临期食材排进今天的餐：逐个试能用到它的菜，第一个排得进去的就用 */
function useItUp(id){
  var cands = ITEMS.filter(function(x){ return (x.needs || []).indexOf(id) >= 0; })
                   .sort(function(a,b){ return a.hand - b.hand; });
  if(!cands.length){ toast('没有用到 ' + (ingName(id)) + ' 的菜'); return; }
  var savedLocks = JSON.parse(JSON.stringify(state.today.locks || {}));
  var savedSkip = (state.today.skipped || []).slice();
  for(var i = 0; i < cands.length; i++){
    var it = cands[i];
    state.today.locks = {};
    state.today.locks[it.cat] = it.id;
    state.today.skipped = savedSkip.filter(function(x){ return x !== it.id; });
    var list = enumerate(todayStr());
    if(list.length){
      state.today.pick = {combo:list[0].combo, ev:list[0].ev};
      state.today.eaten = null;
      save();
      ui.tab = 'today';
      render();
      toast('给你排了「' + it.n + '」，先把' + (ingName(id)) + '用掉');
      return;
    }
  }
  state.today.locks = savedLocks;
  state.today.skipped = savedSkip;
  render();
  toast('今天排不进用到它的菜，明天再说');
}

function renderSheet(){
  var box = document.getElementById('sheetbox');
  /* 展开一类、点中一样东西都会整块重绘。不记一下滚动位置，
     点第 6 类会被弹回顶部，得重新往下滚一遍 */
  var keepTop = box ? box.scrollTop : 0;
  var h = '';
  if(ui.sheetType === 'add') h = sheetAdd();
  else if(ui.sheetType === 'edit') h = sheetEdit();
  else if(ui.sheetType === 'shelf') h = sheetShelf();
  else if(ui.sheetType === 'pantry') h = sheetPantry();
  else if(ui.sheetType === 'cat') h = sheetCat();
  else if(ui.sheetType === 'recipe') h = sheetRecipe();
  else if(ui.sheetType === 'import') h = sheetImport();
  else if(ui.sheetType === 'pending') h = sheetPending();
  else if(ui.sheetType === 'backup') h = sheetBackup();
  else if(ui.sheetType === 'restore') h = sheetRestore();
  else if(ui.sheetType === 'clash') h = sheetClash();
  else h = sheetSettings();
  box.innerHTML = h;
  if(keepTop) box.scrollTop = keepTop;
  document.getElementById('sheet').classList.toggle('on', ui.sheet);
}

/* 自己选菜撞了硬约束：只提醒，不拦。自动推荐那边仍然只排合规组合，
   但人一旦点名要某道菜，决定权在人手上 */
function sheetClash(){

/* 把一份菜谱包并进当前库：按菜名去重，id 撞了加后缀。
   只加不覆盖——用户改过的菜不能因为「装个包」被冲掉 */
/* 一份菜谱在包里的身份证。菜名是给人的，会被改；key 是给机器认的，跟着这道菜走。
   有下厨房链接就用它的编号，没有就用「菜名|作者」兜底 */
function packKey(it){
  if(it && it.key) return String(it.key);
  /* 老数据没有 key，从来源链接里现推一个——比菜名稳，改了名也认得出来 */
  var s = String((it && it.src) || '');
  var m = /xiachufang\.com\/recipe\/(\d+)/.exec(s);
  if(m) return 'xc:' + m[1];
  return 'nm:' + String((it && it.n) || '').trim();
}

function mergePack(list){
  var haveKey = {}, haveName = {}, used = {}, byKey = {}, byName = {};
  state.recipes.forEach(function(r){
    if(!r) return;
    haveKey[packKey(r)] = 1; byKey[packKey(r)] = r;
    if(r.n){ haveName[r.n] = 1; byName[r.n] = r; }
    if(r.id) used[r.id] = 1;
  });
  /* 装包前留一份快照。逻辑再稳也架不住意外，留一份总比没有强 */
  try{ localStorage.setItem(KEY + '.prepack', JSON.stringify(state)); }catch(e){}
  var added = 0, dup = 0, upd = 0, names = [], updNames = [];
  /* 包里带的版本号：补全后的做法比库里新，才升级；你手动改过（my）的一律不动 */
  var verOf = function(x){ return Number(x && x.v) || 0; };
  var UPDF = ['n','cat','hand','wall','fire','vessel','staple','needs','taste',
              'cuisine','lv','m','prep','title','author','src','wk','red','fiber','cap','note'];
  (list || []).forEach(function(src){
    if(!src || !src.n) return;
    /* 两个键都查：改了名字的认 key，手工粘来的（没有 key）认名字 */
    if(haveKey[packKey(src)] || haveName[src.n]){
      var loc = byKey[packKey(src)] || byName[src.n];
      if(loc && verOf(src) > verOf(loc) && !loc.my){
        UPDF.forEach(function(f){
          if(src[f] !== undefined) loc[f] = JSON.parse(JSON.stringify(src[f]));
        });
        loc.v = src.v;
        upd++; updNames.push(src.n);
      } else dup++;
      return;
    }
    var it = JSON.parse(JSON.stringify(src));
    /* 包里没标就现算：补录的菜是机器排版出来的，靠文字特征比靠人手点准 */
    if(it.wk == null) it.wk = guessWeekend(it);
    var base = it.id || ('m' + Date.now().toString(36) + added);
    var id = base, k = 2;
    while(used[id]){ id = base + '_' + k; k++; }
    it.id = id;
    used[id] = 1;
    haveKey[packKey(it)] = 1;
    haveName[it.n] = 1;
    state.recipes.push(normItem(it));
    added++; names.push(it.n);
  });
  rebuildItems(); save();
  return { added:added, dup:dup, upd:upd, total:ITEMS.length, names:names, updNames:updNames };
}

function getJSON(url, ok, err){
  try{
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onload = function(){
      if(x.status >= 200 && x.status < 300){
        try{ ok(JSON.parse(x.responseText)); }
        catch(e){ err(new Error('内容格式不对')); }
      } else err(new Error('HTTP ' + x.status));
    };
    x.onerror = function(){ err(new Error('网络没通')); };
    x.send();
  }catch(e){ err(e); }
}

/* 在应用内部装包。不依赖外部页面写存储——桌面图标和浏览器可能是两套，
   谁打开的就在谁那儿装 */
function loadPack(url, label, quiet){
  if(!quiet){
    ui.setMsg = '正在取' + label + '…';
    renderSheet();
  }
  getJSON(url, function(o){
    var list = (o && o.data && o.data.recipes) || (Array.isArray(o) ? o : []);
    if(!list.length){
      if(quiet){ ui.packBusy = 0; toast('这个包里没有菜谱，什么都没改'); return; }
      ui.setMsg = '这个包里没有菜谱，什么都没改。';
      renderSheet(); return;
    }
    var r = mergePack(list);
    /* 装完就把这一版的指纹记下来：以后开 app 拿它跟仓库比，一样就不再提示。
       提示条点进来的（quiet）也走这里，所以两条入口不会各记各的 */
    state.packSig = packSigOf(list);
    state.packSigSkip = '';
    ui.packUpd = null;
    save();
    var bits = [], plainBits = [];
    if(r.added){ bits.push('新增 <b>' + r.added + '</b> 道（' + r.names.join('、') + '）');
                 plainBits.push('新增 ' + r.added + ' 道（' + r.names.join('、') + '）'); }
    if(r.upd){ bits.push('更新 <b>' + r.upd + '</b> 道做法（' + r.updNames.join('、') + '）');
               plainBits.push('更新 ' + r.upd + ' 道做法（' + r.updNames.join('、') + '）'); }
    if(!r.added && !r.upd){
      if(quiet){
        ui.packBusy = 0;
        toast('已经是最新的：' + r.dup + ' 道都有了，一共 ' + r.total + ' 道');
        if(ui.tab === 'lib') renderKeep(); else render();
        return;
      }
      ui.setMsg = '没有新的：包里 ' + r.dup + ' 道你都已经有了。现在一共 ' + r.total + ' 道。';
      renderSheet(); return;
    }
    if(quiet){
      ui.packBusy = 0;
      toast('装好了：' + plainBits.join('，') + (r.dup ? '，跳过 ' + r.dup + ' 道' : '') + '，一共 ' + r.total + ' 道');
      /* 分类计数、列表都要跟着变；停在菜谱页就就地刷新，别把人弹回顶部 */
      if(ui.tab === 'lib') renderKeep(); else render();
      return;
    }
    ui.setMsg = '装好了：' + bits.join('，') +
                (r.dup ? '，跳过 ' + r.dup + ' 道本来就有的' : '') +
                '。现在一共 ' + r.total + ' 道。';
    renderSheet();
  }, function(e){
    if(quiet){
      ui.packBusy = 0;
      toast('没取到菜谱包，检查网络后点一下提示条再试');
      return;
    }
    ui.setMsg = '取不到菜谱包（' + (e && e.message ? e.message : '未知原因') + '）。检查网络后再点一次。';
    renderSheet();
  });
}

/* ============================================================
   备份：把 state 变成一段文字带走，粘回来就能恢复。
   不压缩、不加密——体积本来就几十 KB，看得懂比省字节重要。
   ============================================================ */
function backupText(){
  return JSON.stringify({ __backup:1, app:'今天这顿', at:new Date().toISOString(), v:1, data:state });
}
function backupStat(d){
  return {
    dishes: (d && Array.isArray(d.recipes))
      ? d.recipes.filter(function(x){ return !(Array.isArray(d.hidden) && d.hidden.indexOf(x.id) >= 0); }).length
      : 0,
    days: (d && Array.isArray(d.history)) ? d.history.length
        : ((d && d.log) ? Object.keys(d.log).length : 0),
    inv: (d && Array.isArray(d.inventory)) ? d.inventory.length : 0
  };
}
/* 聊天软件会在前后加话、还可能把长文截断，所以只取第一个 { 到最后一个 } 再解析 */
function parseBackup(raw){
  var t = String(raw || '').trim();
  if(!t) return { err:'还没粘内容' };
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a < 0 || b <= a) return { err:'这段文字里没找到备份——它应该是一段以 { 开头、} 结尾的 JSON' };
  var o;
  try{ o = JSON.parse(t.slice(a, b + 1)); }
  catch(e){ return { err:'内容不完整，多半是复制时被截断了（微信对超长文字会截断），试试用「存成文件」再导入' }; }
  var d = (o && o.__backup) ? o.data : o;
  if(!d || typeof d !== 'object') return { err:'认不出这是备份' };
  /* 必须能确认「这是本应用的备份」，否则随便一份带 inventory / recipes 键的
     JSON（别的应用导出的、游戏存档）都会被当成备份，确认覆盖后整台设备的
     数据就被换成一堆残缺结构——而且找不回来 */
  var isOurs = (o && (o.__backup === 1 || o.app === '今天这顿')) || d.version === 4;
  if(!isOurs) return { err:'这份里没有本应用的版本信息，不是这个应用的备份' };
  if(!Array.isArray(d.recipes) && !Array.isArray(d.inventory) && !Array.isArray(d.history)){
    return { err:'这份里没有菜谱、记录或库存，可能不是这个应用的备份' };
  }
  if(!Array.isArray(d.recipes)) d.recipes = [];
  return { ok:1, data:d, at:fmtAt(o && o.at) };
}
function fmtAt(s){
  if(!s) return '';
  var d = new Date(s);
  if(isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) +
         ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function downloadBackup(){
  var txt = backupText();
  var nm = '今天这顿备份-' + dstr(0) + '.json';
  try{
    var blob = new Blob([txt], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nm;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }catch(e){}
    }, 1500);
    ui.bkMsg = { t:'ok', m:'已生成「' + nm + '」。在浏览器的「下载」里能找到它，再发微信收藏或存网盘。' };
  }catch(e){
    ui.bkMsg = { t:'err', m:'这个浏览器不让下载，用上面的「复制」，或者长按文本框全选复制。' };
  }
  renderSheet();
}

function copyBackup(){
  var txt = backupText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      ui.bkMsg = { t:'ok', m:'复制好了，去粘到能长期存文字的地方。' };
      renderSheet();
    }, function(){
      ui.bkMsg = { t:'err', m:'浏览器不让自动复制（http 页面就是这样），长按上面的文本框 → 全选 → 复制。' };
      renderSheet();
    });
  } else {
    ui.bkMsg = { t:'err', m:'这个环境不让网页写剪贴板（http 页面就是这样），长按上面的文本框 → 全选 → 复制。' };
    renderSheet();
  }
}

/* raw 可以由调用方传进来（选文件时文件内容还没进 textarea）。
   原来只读 textarea，选完文件立刻被空框覆盖，永远是「还没粘内容」 */
function checkRestore(raw){
  if(raw == null){
    var box = document.getElementById('rsTxt');
    raw = box ? box.value : (ui.rsTxt || '');
  }
  ui.rsTxt = String(raw || '');
  var r = parseBackup(ui.rsTxt);
  if(r.ok){
    ui.rsParsed = r;
    ui.rsInfo = { ok:1, stat:backupStat(r.data), at:r.at };
  } else {
    ui.rsParsed = null;
    ui.rsInfo = { err:r.err };
  }
  renderSheet();
}

function applyBackup(){
  if(!ui.rsParsed || !ui.rsParsed.ok){ toast('先点「检查一下」'); return; }
  /* 检查完又改了内容？以框里现在的文字为准重新解析。
     否则「已检查 A、实际写入 A」跟用户看到的 B 不是同一份，
     先检查后确认这道保护就白设了 */
  var box = document.getElementById('rsTxt');
  if(box && box.value != null && String(box.value).trim()){
    var again = parseBackup(box.value);
    if(!again.ok){
      ui.rsParsed = null;
      ui.rsInfo = { err:'内容变了，请重新点「检查一下」' };
      renderSheet(); toast('内容变了，重新检查一下'); return;
    }
    if(again.data !== ui.rsParsed.data){ ui.rsParsed = again; }
  }
  /* 备份可能是老版本、或被人手改过，缺字段就补齐再写：
     少一个 today 就是白屏，少 settings 就取不到窗口分钟 */
  var d = ui.rsParsed.data, dft = dataDefaults();
  Object.keys(dft).forEach(function(k){
    if(d[k] == null) d[k] = dft[k];
    else if((k === 'settings' || k === 'today') && typeof d[k] === 'object'){
      Object.keys(dft[k]).forEach(function(k2){ if(d[k][k2] === undefined) d[k][k2] = dft[k][k2]; });
    }
  });
  d.version = 4;
  try{
    localStorage.setItem(KEY, JSON.stringify(d));
  }catch(e){
    toast('写不进去：浏览器存储满了，或被隐私模式禁用了');
    return;
  }
  /* 直接重载最干净：内存里的 state 已经旧了，重新加载一次免得半新半旧 */
  location.reload();
}

/* 保质期输入框的默认值：打的名字如果见过，就沿用你上次定的天数 */
function addDaysDefault(){
  var t = normIngName(ui.cusName);
  if(ui.cusDaysTouched && ui.cusDays != null && ui.cusDays !== '') return ui.cusDays;
  if(!t) return 3;
  var hit = matchIng(t);
  return hit ? shelfDays(hit) : (state.shelfName[t] || 3);
}

/* 记一笔的提交动作：按钮和回车都走这里，保证两条路行为一致 */
function doCusAdd(){
  var box = document.getElementById('cusName');
  var dayBox = document.getElementById('cusDays');
  var nmRaw = box ? box.value : ui.cusName;
  var dd = (dayBox && dayBox.value !== '') ? Number(dayBox.value) : null;
  var probe = normIngName(nmRaw);
  /* 调料不进冰箱：记了也不会有「还剩几天」的意思，只会把列表弄脏 */
  if(!ui.forceNew && probe && !matchIng(probe) && isSeasoning(probe)){ toast('「' + probe + '」算调料，不用记库存'); return; }
  if(probe.length > 12){ toast('名字短一点，最多 12 个字'); return; }
  var newId = addCustom(nmRaw, dd, ui.addGrp, ui.forceNew);
  ui.forceNew = false;
  if(!newId){ toast('先打个名字'); return; }
  save();
  if(isPantry(newId)) toast(ingName(newId) + ' 是常备品，不记库存；保质期按 ' + shelfDays(newId) + ' 天记下了');
  else toast(ingName(newId) + ' 记进冰箱了 · ' + gOf(newId) + ' · 保质 ' + shelfDays(newId) + ' 天');
  /* 加完把分类切到它实际所在的那一类，好看得见刚加的东西。
     常备品不进库存，就跟分类无关，别把人从正在逛的那一类拽走 */
  if(!isPantry(newId)) ui.addGrp = gOf(newId);
  ui.cusName = ''; ui.cusDays = null; ui.cusDaysTouched = false;
  renderSheet(); renderKeep();
  var nb = document.getElementById('cusName');
  if(nb && nb.focus) nb.focus();   /* 连着记好几样时不用每次点输入框 */
}

/* ============================================================
   常备品：自己补、自己移出。
   「常备」的含义是不跟踪数量——所以加进来的时候要把冰箱里那几行撤掉，
   否则库存里会躺着一行你看不见、又会被「就吃这个」扣掉的幽灵库存。
   ============================================================ */
function pantryHintHtml(name){
  var t = normIngName(name);
  if(!t) return '<span class="dim">打名字，比如「意面」「挂面」「玉米罐头」。加进来就算家里总有，不用记账。</span>';
  var hit = matchIng(t);
  if(hit && isPantry(hit)) return '「' + esc(ingName(hit)) + '」已经是常备品了，不用再加。';
  if(hit){
    var rows = state.inventory.filter(function(x){ return x.id === hit && x.qty > 0; });
    return '对上库里已有的「' + esc(ingName(hit)) + '」，加进常备品后它就算家里总有。' +
           (rows.length ? '冰箱里那 ' + rows.length + ' 行会一起撤掉。' : '');
  }
  if(isSeasoning(t)) return '「' + esc(t) + '」算调料，调料不用进常备品。';
  return '新食材「' + esc(t) + '」，会一起建一条；以后菜谱用到它就算有。';
}

/* 加进常备品。返回 id，失败返回 null */
function pantryAdd(name){
  var t = normIngName(name);
  if(!t){ toast('先打个名字'); return null; }
  if(t.length > 12){ toast('名字短一点，最多 12 个字'); return null; }
  var id = matchIng(t);
  if(!id && isSeasoning(t)){ toast('「' + t + '」算调料，不用进常备品'); return null; }
  if(!id){
    id = newIngId();
    state.ings[id] = { n: t, g: otherGroup(), d: state.shelfName[t] || 3 };
  }
  if(isPantry(id)){ toast('「' + ingName(id) + '」已经是常备品了'); return id; }
  var oi = state.notPantry.indexOf(id);
  if(oi >= 0) state.notPantry.splice(oi, 1);   /* 出厂自带、被移出过的：放回来 */
  else state.pantry.push(id);
  /* 撤掉库存行，见上面那段注释。撤了几份要说清，别让人以为东西凭空没了 */
  var dead = state.inventory.filter(function(x){ return x.id === id; });
  var q = dead.reduce(function(a, x){ return a + (Number(x.qty) || 0); }, 0);
  if(dead.length){
    state.inventory = state.inventory.filter(function(x){ return x.id !== id; });
    toast('「' + ingName(id) + '」加进常备品了 · 冰箱里那 ' + q + ' 份撤掉');
  } else {
    toast('「' + ingName(id) + '」加进常备品了 · 以后都算家里有');
  }
  return id;
}

/* 移出常备品：之后就按普通生鲜算，没有库存就是缺，会进采购清单 */
function pantryDel(id){
  var nm = ingName(id);
  var i = state.pantry.indexOf(id);
  if(i >= 0) state.pantry.splice(i, 1);
  if(PANTRY.indexOf(id) >= 0 && state.notPantry.indexOf(id) < 0) state.notPantry.push(id);
  save();
  toast('「' + nm + '」移出常备品 · 以后按生鲜记库存');
}

/* 恢复出厂：自己加的清掉，移出的补回来 */
function pantryReset(){
  state.pantry = [];
  state.notPantry = [];
  save();
}
