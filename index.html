<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>今天这顿 · Demo</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#3C6B4F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="今天这顿" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#F4F2EC;color:#201E19;font-size:15px;line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
  }
  #app{max-width:430px;margin:0 auto;padding:16px 16px 0}
  .top{display:flex;align-items:flex-start;justify-content:space-between;margin:4px 0 16px}
  .top .date{font-size:12px;color:#8A8478;letter-spacing:.06em}
  .top h1{font-size:22px;line-height:1.25;margin:2px 0 0;font-weight:650;letter-spacing:-.01em}
  .iconbtn{border:1px solid #E7E2D7;background:#fff;border-radius:12px;width:36px;height:36px;
    font-size:15px;color:#6B665B;cursor:pointer;line-height:1}
  .card{background:#fff;border:1px solid #E9E4D9;border-radius:18px;padding:16px;margin-bottom:12px}
  .card.tight{padding:12px 14px}
  .card-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#8A8478;margin-bottom:10px}
  .card-h b{color:#201E19;font-size:14px;font-weight:600}
  .slotrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F1EDE4}
  .slotrow:last-child{border-bottom:0;padding-bottom:2px}
  .slotrow:first-of-type{padding-top:2px}
  .slot{flex:0 0 34px;font-size:11px;color:#9A9488;letter-spacing:.08em}
  .slotbody{flex:1 1 auto;min-width:0}
  .slotbody .nm{font-size:16px;font-weight:560;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slotbody .mt{font-size:11.5px;color:#9A9488;margin-top:2px;white-space:normal;line-height:1.45}
  .swapbtn{flex:0 0 auto;border:1px solid #E7E2D7;background:#FBFAF6;border-radius:10px;padding:5px 11px;
    font-size:12px;color:#5C574C;font-family:inherit;cursor:pointer}
  .swapbtn:active{background:#F0EDE4}
  .swapbtn.mini{padding:5px 9px;color:#9A9488}
  .btngrp{display:flex;gap:6px;flex:0 0 auto}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 2px}
  .stat{background:#FBFAF5;border:1px solid #EFEAE0;border-radius:12px;padding:9px 6px;text-align:center}
  .stat b{display:block;font-size:17px;font-weight:620;line-height:1.25}
  .stat span{font-size:10.5px;color:#9A9488}
  .actions{display:flex;gap:9px;margin-top:14px}
  .btn{flex:1;border:0;border-radius:13px;padding:12px;font-size:14.5px;font-family:inherit;cursor:pointer;font-weight:550}
  .btn-primary{background:#2F5D46;color:#fff}
  .btn-primary:active{background:#274d3a}
  .btn-ghost{background:#F2EFE6;color:#4A463D}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#F2EFE6;color:#6E6A5F;margin-right:4px}
  .tag.warn{background:#FBEDE8;color:#A8543F}
  .tag.ok{background:#E9F1EA;color:#3C6B4F}
  .sec{font-size:12px;color:#8A8478;margin:0 4px 7px;letter-spacing:.04em}
  .why{font-size:13px;color:#4F4A41}
  .why div{display:flex;gap:8px;padding:3px 0}
  .why i{flex:0 0 auto;color:#B7722B;font-style:normal;font-size:12px;line-height:1.7}
  .prep{list-style:none;margin:0;padding:0}
  .prep li{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed #F0ECE3;font-size:13.5px}
  .prep li:last-child{border-bottom:0}
  .prep .pm{flex:0 0 34px;font-size:11.5px;color:#B7722B;padding-top:2px}
  .prep .pt{flex:1;min-width:0}
  .prep .ph{display:block;font-size:11px;color:#A9A398;margin-top:1px}
  .pline{display:flex;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px solid #F4F0E8}
  .pline:last-child{border-bottom:0}
  .pline .pk{flex:0 0 40px;font-size:11.5px;color:#3C6B4F;padding-top:2px}
  .pline .pv{flex:1;color:#3A362F}
  .buywrap{display:flex;flex-wrap:wrap;gap:6px}
  .buy{font-size:12.5px;background:#FBEDE8;color:#A0503A;border-radius:8px;padding:4px 9px;
    border:0;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .buy i{font-style:normal;font-size:13px;opacity:.6;line-height:1}
  .buy:active{background:#F5DFD7}
  .buy.fresh{background:#F4EFE4;color:#8A7248}
  .buy.fixed{background:#F2F0EA;color:#8A8478;cursor:default}

  /* 自定义输入 */
  .cuswrap{display:flex;gap:8px;margin-top:10px}
  .cuswrap input{flex:1;min-width:0;border:1px solid #E7E2D7;background:#fff;border-radius:12px;
    padding:11px 12px;font-family:inherit;font-size:14px;color:#201E19;-webkit-appearance:none}
  .cuswrap input::placeholder{color:#B5AFA2}
  .cuswrap input:focus{outline:0;border-color:#2F5D46}
  .cuswrap button{flex:0 0 auto;border:0;background:#2F5D46;color:#fff;border-radius:12px;
    padding:0 16px;font-family:inherit;font-size:14px;cursor:pointer}
  .cuswrap button:active{background:#264B39}
  .cusdays{flex:0 0 74px;display:flex;align-items:center;gap:2px;border:1px solid #E7E2D7;
    background:#fff;border-radius:12px;padding:0 9px}
  .cuswrap .cusdays input{flex:1;min-width:0;width:100%;border:0;border-radius:0;background:none;
    padding:0;text-align:right;font-size:14px;-moz-appearance:textfield}
  .cuswrap .cusdays input::-webkit-outer-spin-button,
  .cuswrap .cusdays input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .cuswrap .cusdays input:focus{outline:0}
  .cusdays span{flex:0 0 auto;font-size:12px;color:#9A9488}

  /* 保质期设置 */
  .shgrp{font-size:12px;color:#8A8478;margin:16px 4px 2px;letter-spacing:.04em}
  .shrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F4F0E8}
  .shrow:last-child{border-bottom:0}
  .shrow .ib{flex:1;min-width:0}
  .shrow .nm{font-size:14px;font-weight:540}
  .shrow .mt{font-size:11px;color:#A9A398;margin-top:1px;line-height:1.5}
  .stp{flex:0 0 auto;display:flex;align-items:center;gap:2px}
  .stp button{width:28px;height:28px;border-radius:9px;border:1px solid #E7E2D7;background:#FBFAF6;
    font-size:15px;line-height:1;color:#4A463D;font-family:inherit;cursor:pointer}
  .stp button:active{background:#EFEBE1}
  .stp b{min-width:34px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

  /* 菜谱编辑表单 */
  .field{margin-top:12px}
  .field > span{display:block;font-size:12px;color:#8A8478;margin-bottom:5px}
  .field input[type=text],.field input[type=number],.field input[type=url],.field textarea{
    width:100%;border:1px solid #E7E2D7;border-radius:12px;padding:10px 12px;font-family:inherit;
    font-size:14px;background:#fff;color:#201E19;-webkit-appearance:none}
  .field input:focus,.field textarea:focus{outline:0;border-color:#2F5D46}
  .field textarea{min-height:74px;resize:vertical;line-height:1.55}
  .field .hint{font-size:11px;color:#A9A398;margin-top:4px;line-height:1.55}
  .frow{display:flex;gap:9px}
  .frow .field{flex:1;min-width:0}
  .ingchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;max-height:132px;overflow-y:auto}
  .ingchip{border:1px solid #E7E2D7;background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;
    font-family:inherit;color:#5C574C;cursor:pointer}
  .ingchip.on{background:#2F5D46;border-color:#2F5D46;color:#fff}
  .ingchip.not{opacity:.42;text-decoration:line-through}
  .segtiny{display:flex;flex-wrap:wrap;gap:6px}
  .segtiny button{border:1px solid #E7E2D7;background:#fff;border-radius:9px;padding:5px 10px;
    font-size:12.5px;font-family:inherit;color:#5C574C;cursor:pointer}
  .segtiny button.on{background:#2F5D46;border-color:#2F5D46;color:#fff}
  .impmsg{font-size:12px;line-height:1.6;border-radius:10px;padding:8px 10px;margin-top:10px}
  .impmsg.err{background:#FBEDE8;color:#A0503A}
  .impmsg.ok{background:#EFF4EE;color:#3C6B4F}
  .impmsg.warn{background:#FAF3E4;color:#8A6A2E}
  .impinfo{background:#EFF4EE;border:1px solid #DEE9E0;border-radius:10px;padding:9px 11px;
    font-size:12px;line-height:1.6;color:#3C6B4F;margin:-6px 0 12px}
  .impinfo b{color:#A0503A;font-weight:600}
  .impinfo .sub{color:#8A8478;margin-top:3px}
  .pendbar{background:#FAF3E4;border:1px solid #EDE2C8;border-radius:10px;padding:9px 11px;
    font-size:12.5px;line-height:1.6;color:#8A6A2E;margin:0 0 12px;cursor:pointer}
  .pendstep{background:#F6F3EA;border:1px solid #E7E2D7;border-radius:10px;padding:10px 12px;
    font-size:12px;line-height:1.75;color:#5E5A50;margin-bottom:10px}
  .pendstep b{color:#2F5D46}
  .pendstep ol{margin:5px 0 0;padding-left:19px}
  .pendstep li{margin:1px 0}
  .pendbox{width:100%;box-sizing:border-box;min-height:118px;font-size:12.5px;line-height:1.65;
    border:1px solid #E7E2D7;border-radius:10px;padding:10px 11px;background:#fff;color:#3A362F;
    font-family:inherit;resize:vertical}
  /* 编辑器：粘贴区 + 三行自动判断 */
  .pastebox{border:1px dashed #DCD5C2;background:#FBFAF6;border-radius:14px;padding:10px 12px 8px;margin-bottom:14px}
  .pastebox .pb-h{font-size:12.5px;color:#6E6A5F;margin-bottom:6px}
  .pastebox textarea{width:100%;box-sizing:border-box;border:0;background:transparent;min-height:72px;
    font-family:inherit;font-size:13.5px;line-height:1.6;color:#201E19;resize:vertical;outline:none;padding:0}
  .pastebox .pb-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
  .pastebox .pb-f span{font-size:11.5px;color:#A9A398}
  .pastebox .pb-f button{border:0;background:#3C6B4F;color:#fff;border-radius:9px;padding:6px 12px;
    font-size:12.5px;font-family:inherit;cursor:pointer}
  .pastebox .pb-f button.ghost{background:#fff;color:#3C6B4F;border:1px solid #D9E2DA;padding:5px 11px}
  .autostrip{border:1px solid #EFEAE0;background:#FCFBF7;border-radius:13px;padding:1px 12px;margin:4px 0 0}
  .arow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;
    border-bottom:1px solid #F3EFE6}
  .arow:last-child{border-bottom:0}
  .arow>span{font-size:12.5px;color:#6E6A5F;flex:0 0 auto}
  .autohint{font-size:11.5px;color:#A9A398;margin:7px 2px 0;line-height:1.6}
  .ingchip b{font-weight:400;color:rgba(255,255,255,.65);margin-left:5px}
  .ingchip.add{border-style:dashed;color:#3C6B4F;background:#fff}
  .padwrap{margin-top:8px}
  .padwrap input{width:100%;box-sizing:border-box;border:1px solid #E7E2D7;border-radius:10px;
    padding:8px 10px;font-family:inherit;font-size:13px;color:#201E19;outline:none;-webkit-appearance:none}
  .morelink{border:0;background:none;color:#8A8478;font-family:inherit;font-size:12.5px;
    padding:12px 0 2px;width:100%;text-align:left;cursor:pointer}
  .linkbtn{border:0;background:none;color:#3C6B4F;font-family:inherit;font-size:12.5px;
    padding:6px 0;cursor:pointer}
  /* 保存常驻在底部，表单再长也不用滚到底找按钮 */
  .sheetfoot{position:sticky;bottom:-2px;background:#fff;padding:10px 0 2px;margin-top:14px;
    box-shadow:0 -10px 12px -8px rgba(0,0,0,.07)}
  /* 待补录每条的两个动作：手机上要够大、够好点 */
  .prow{display:flex;gap:8px;margin-top:8px}
  .pbtn{flex:1 1 0;min-height:36px;border:1px solid #E7E2D7;background:#fff;border-radius:10px;
    font-family:inherit;font-size:13px;color:#3A362F;cursor:pointer;padding:0 8px}
  .pbtn.primary{background:#2F5D46;border-color:#2F5D46;color:#fff}
  .pbtn:active{background:#F0EDE4}
  .pbtn.primary:active{background:#264B39}
  .cusrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .custag{display:inline-flex;align-items:center;gap:5px;border:1px solid #E7E2D7;background:#fff;
    border-radius:8px;padding:5px 9px;font-size:12.5px;font-family:inherit;color:#3A362F;cursor:pointer}
  .custag b{font-weight:500}
  .custag span{font-size:11px;color:#A9A398}
  .custag:active{background:#F0EDE4}

  /* ---------- 冰箱 ---------- */
  .invrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F1EDE4;cursor:pointer}
  .invrow:last-child{border-bottom:0}
  .invrow .ib{flex:1;min-width:0}
  .invrow .nm{font-size:14.5px;font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .invrow .mt{font-size:11.5px;color:#9A9488;margin-top:2px}
  .invrow .rt{flex:0 0 auto;text-align:right}
  .invrow .qty{font-size:13px;color:#5E5A50}
  .invrow .dd{font-size:11.5px;color:#9A9488;margin-top:2px}
  .invrow .dd.warn{color:#B0453A;font-weight:550}
  .invrow .dd.dead{color:#A9A398;text-decoration:line-through}
  .invgrp{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:#8A8478;margin:14px 4px 4px}
  .pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .pickbtn{border:1px solid #E7E2D7;background:#fff;border-radius:12px;padding:9px 11px;text-align:left;
    font-family:inherit;cursor:pointer;line-height:1.3}
  .pickbtn b{display:block;font-size:13.5px;font-weight:550;color:#201E19}
  .pickbtn span{font-size:11px;color:#9A9488}
  .pickbtn.has{background:#F3F7F3;border-color:#DCE7DC}
  .pickbtn:active{background:#F0EDE4}
  .qstepper{display:flex;align-items:center;gap:14px;justify-content:center;padding:6px 0 2px}
  .qstepper button{width:40px;height:40px;border-radius:12px;border:1px solid #E7E2D7;background:#FBFAF6;
    font-size:19px;line-height:1;color:#4A463D;font-family:inherit;cursor:pointer}
  .qstepper b{font-size:22px;font-weight:600;min-width:44px;text-align:center}
  .empty{color:#A9A398;font-size:13px;padding:6px 0}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-top:1px solid #E9E4D9;padding:7px 0 calc(7px + env(safe-area-inset-bottom));z-index:20}
  nav .inner{max-width:430px;margin:0 auto;display:flex}
  nav button{flex:1;border:0;background:none;font-family:inherit;font-size:10.5px;color:#A9A398;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0}
  nav button .ic{font-size:17px;line-height:1.15;filter:grayscale(1);opacity:.55}
  nav button.on{color:#2F5D46;font-weight:600}
  nav button.on .ic{filter:none;opacity:1}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid #E7E2D7;background:#fff;border-radius:20px;padding:6px 13px;
    font-size:12.5px;color:#5C574C;font-family:inherit;cursor:pointer}
  .chip.on{background:#2F5D46;border-color:#2F5D46;color:#fff}
  .chips.wrap{flex-wrap:wrap;overflow:visible}
  .rc{padding:12px 0;border-bottom:1px solid #F1EDE4}
  .rc:last-child{border-bottom:0}
  .rc .r1{display:flex;align-items:baseline;gap:8px}
  .rc .r1 .n{font-size:15px;font-weight:550;flex:1;min-width:0}
  .rc .r1 button{flex:0 0 auto;border:0;background:#F2EFE6;color:#2F5D46;font-family:inherit;font-size:12px;
    border-radius:9px;padding:5px 10px;cursor:pointer}
  .rc .r2{font-size:11.5px;color:#9A9488;margin-top:3px}
  .rc .r3{font-size:12.5px;color:#5E5A50;margin-top:5px;white-space:pre-line}
  .rc .r3.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.15))}
  .morebtn{border:0;background:none;color:#3C6B4F;font-family:inherit;font-size:12px;padding:5px 0 0;
    cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  /* 原菜谱跳转：小、绿、可点，不抢菜名的位置 */
  .srclink{display:inline-block;font-size:11.5px;line-height:1.7;color:#3C6B4F;text-decoration:none;
    background:#EDF3EE;border:1px solid #DEE9E0;border-radius:7px;padding:1px 8px;margin-top:6px;
    -webkit-tap-highlight-color:transparent}
  .srclink:active{background:#DFEADF}
  .rc .r2 .srclink{margin:3px 4px 0 0;vertical-align:middle}
  .byline{display:inline-block;font-size:11.5px;line-height:1.7;color:#8A8478;
    padding:1px 4px;margin:3px 2px 0 2px;vertical-align:middle;max-width:150px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F1EDE4;font-size:13.5px}
  .logrow:last-child{border-bottom:0}
  .logrow .d{flex:0 0 46px;font-size:11.5px;color:#9A9488}
  .logrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet{position:fixed;inset:0;background:rgba(28,25,20,.34);z-index:40;display:none;align-items:flex-end}
  .sheet.on{display:flex}
  .sheet .box{background:#fff;width:100%;max-width:430px;margin:0 auto;border-radius:20px 20px 0 0;
    padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet h3{margin:0 0 14px;font-size:16px}
  .setrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F2EEE5;font-size:14px}
  .setrow:last-of-type{border-bottom:0}
  .seg{display:flex;gap:6px}
  .seg button{border:1px solid #E7E2D7;background:#fff;border-radius:9px;padding:5px 11px;font-size:12.5px;
    font-family:inherit;color:#5C574C;cursor:pointer}
  .seg button.on{background:#2F5D46;border-color:#2F5D46;color:#fff}
  .sw{width:44px;height:26px;border-radius:20px;background:#DDD8CD;border:0;position:relative;cursor:pointer}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.16s}
  .sw.on{background:#2F5D46}
  .sw.on::after{transform:translateX(18px)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:rgba(32,30,25,.9);
    color:#fff;font-size:13px;padding:9px 15px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:300px;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{font-size:11.5px;color:#A9A398;text-align:center;padding:6px 0 4px;line-height:1.7}
  .kbd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#F4F1E9;padding:1px 5px;border-radius:5px;color:#5C574C}
  .banner{background:#EFF4EE;border:1px solid #DCE7DC;color:#3C6B4F;font-size:12.5px;border-radius:12px;padding:9px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .banner button{margin-left:auto;border:0;background:none;color:#3C6B4F;font-family:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

function dstr(off){
  var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + (off||0));
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function daysBetween(a,b){

}

function load(){
  var dft = dataDefaults();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(s && s.version === 4){
        /* 版本号没变、字段却一直在加（shelf / shelfName / today.consumed…）。
           缺谁补谁，而不是「version 对就整份返回」——少一个 today，
           第一屏 ensurePick 就会读 undefined.date 直接白屏。 */
        Object.keys(dft).forEach(function(k){
          if(s[k] == null){ s[k] = dft[k]; return; }
          if((k === 'settings' || k === 'today') && typeof s[k] === 'object'){
            Object.keys(dft[k]).forEach(function(k2){ if(s[k][k2] === undefined) s[k][k2] = dft[k][k2]; });
          }
        });
        return s;
      }
    }
  }catch(e){}
  return dft;
}

function isSeasoning(name){
  var t = String(name || '').replace(/[（(].*?[)）]/g, '').replace(/[、，,]/g, '').trim();
  if(!t) return true;
  if(SEASON_WORDS.some(function(w){ return w === t; })) return true;
  /* 「小葱花」「生抽酱油」这种在原词上加了后缀的，也归到调料，
     别跑到「不认识的食材」清单里去烦人。只对短词做，免得「葱油饼」被误判 */
  if(t.length <= 6 && SEASON_WORDS.some(function(w){ return w.length >= 2 && t.indexOf(w) >= 0; })) return true;
  return false;
}

/* 食材名 → id。精确 > 别名 > 互相包含（取最长匹配） */
function matchIng(raw){
  var t = String(raw || '').replace(/[（(].*?[)）]/g, '').replace(/\s+/g, '').replace(/[、，,。.]$/, '').trim();
  if(!t || isSeasoning(t)) return null;
  var keys = Object.keys(ING).concat(Object.keys(state.extraIng || {}));
  var i, hit = null, hitLen = 0;
  for(i = 0; i < keys.length; i++){ if(ingName(keys[i]) === t) return keys[i]; }
  if(ING_ALIAS[t]) return ING_ALIAS[t];
  keys.forEach(function(k){
    var nm = ingName(k);
    if(nm && nm.length >= 2 && (t.indexOf(nm) >= 0 || nm.indexOf(t) >= 0) && nm.length > hitLen){ hit = k; hitLen = nm.length; }
  });
  if(hit) return hit;
  Object.keys(ING_ALIAS).forEach(function(a){
    if(!hit && a.length >= 2 && (t.indexOf(a) >= 0 || a.indexOf(t) >= 0)) hit = ING_ALIAS[a];
  });
  return hit;
}

/* 一条用料行的长相：「名字 数量 单位」，或「名字 适量」。
   原来的写法不锚定整行，只要句子里出现「片/把/只」或某个中文数字就算，
   于是「把鸡蛋打散，加一点盐」「小火煮两分钟」都被当成食材，
   而 matchIng 是子串匹配，句子里的「鸡蛋」还会被真的塞进用料表。 */
var ING_UNIT = '个根颗瓣片勺把只条克斤块袋包盒瓶罐束张杯碗撮';
function looksLikeIngredient(L){
  var s = String(L || '').trim();
  if(!s || s.length > 24) return false;
  if(/^步骤\s*\d/.test(s)) return false;
  if(/^(做法|步骤|小贴士)/.test(s)) return false;
  /* 带句子标点的、以动词开头的，都是做法不是用料 */
  if(/[，,。；;！!？?]/.test(s)) return false;
  if(/^(把|将|先|再|然后|最后|倒入|放入|加入|下锅|出锅|盛出|撒|淋|浇|拌|搅)/.test(s)) return false;
  /* 括号里的补充说明不参与判断：「番茄（中等大小）2个」 */
  var t = s.replace(/[（(][^）)]*[)）]/g, '').trim();
  if(!t) return false;
  var num = '[\\d一二三四五六七八九十两半几]+';
  /* 单位可以是中文量词（可带「小/大」），也可以是 g / ml / kg 这种英文单位 */
  var unit = '(?:[' + ING_UNIT + ']{0,2}|kg|g|ml|毫升|升)';
  var qtyTail = '\\s*[.．~\\-–/]?\\s*[\\d一二三四五六七八九十]*\\s*(小|大)?' + unit + '\\s*(约|左右)?\\s*$';
  return new RegExp('^[^\\d：:\\s]{1,12}\\s*[：:]?\\s*' + num + qtyTail).test(t)
      || new RegExp('^[^\\d：:\\s]{1,12}\\s*[：:]?\\s*(适量|少许|一些|少量|若干|按需|够用)\\s*$').test(t);
}
function splitIngLine(L){
  var s = String(L).replace(/^[-·•*·]\s*/, '').trim();
  var m = s.match(/^([^\d：:]{1,14}?)\s*[：:]?\s*([\d一二三四五六七八九十两半几]+\s*[^\s]*|适量|少许|一些)\s*$/);
  if(m) return {name:m[1].trim(), qty:m[2].trim()};
  m = s.match(/^([^\d：:]{1,14}?)\s+([\d一二三四五六七八九十两半几].*)$/);
  if(m) return {name:m[1].trim(), qty:m[2].trim()};
  return {name:s.trim(), qty:''};
}
function stripStepNo(L){
  return String(L).replace(/^(步骤\s*\d+[:：.、]?|\d+\s*[：:.．、)）]|第[一二三四五六七八九十]+步[:：]?)\s*/, '').trim();
}

/* 从做法文字猜火/器具/时间——猜错很正常，所以草稿最后要人过一眼 */
function guessCook(m){
  var t = String(m || '');
  var has = function(){ for(var i = 0; i < arguments.length; i++){ if(t.indexOf(arguments[i]) >= 0) return true; } return false; };
  if(has('空气炸','烤箱','烤'))                     return {fire:'off',  vessel:'airfryer', wall:10, hand:3};
  if(has('微波'))                                    return {fire:'off',  vessel:'microwave', wall:3,  hand:1};
  if(has('蒸'))                                      return {fire:'none', vessel:'steamer',  wall:12, hand:3};
  if(has('炖','焖','红烧','卤'))                      return {fire:'none', vessel:'pan',      wall:18, hand:5};
  if(has('煮','汆','汤'))                            return {fire:'none', vessel:'water',    wall:12, hand:5};
  if(has('焯','白灼') && !has('炒'))                  return {fire:'none', vessel:'water',    wall:6,  hand:4};
  if(has('炒','爆','煸','煎','滑','炝'))              return {fire:'watch',vessel:'pan',      wall:9,  hand:8};
  if(has('拌','腌','泡'))                            return {fire:'off',  vessel:'none',     wall:5,  hand:4};
  return {fire:'none', vessel:'pan', wall:8, hand:6};
}

function isQtyLine(s){
  var t = String(s || '').trim();
  if(!t) return false;
  if(/^(适量|少许|一些|少量|半个|若干|按需|够用)$/.test(t)) return true;
  /* 区间和分数：「2~3个」「1/2根」「3-4根」。口径要和 isQtyTok 一致，
     否则两行式用料里数量行认不出来，食物名反被当数量丢掉 */
  return t.length <= 8 &&
    /^[\d一二三四五六七八九十两半几]+([.．~\-–/][\d一二三四五六七八九十两半几]+)?\s*[个根颗瓣片勺把只条克斤块袋包盒瓶罐束张杯碗撮]{0,3}$/.test(t);
}
/* OCR 把整列用料挤成一行时，「名字 数量 名字 数量」会交替出现。
   按空格切成 token，奇数位全是数量状才认——这样「番茄一个 很新鲜」不会被误切 */
function isQtyTok(t){
  return /^(适量|少许|一些|少量|若干|按需|够用|半[个颗瓣片勺把只条]|[\d一二三四五六七八九十两半几]+[^\s]{0,4})$/.test(t);
}
function multiIngOf(L){
  var toks = String(L || '').trim().split(/\s+/).filter(Boolean);
  if(toks.length < 4) return null;
  /* 末尾常粘着被切开的菜名（「…蒜 2~3瓣 番茄炒蛋」），先丢掉一个再试 */
  if(toks.length % 2 !== 0){
    toks = toks.slice(0, toks.length - 1);
    if(toks.length < 4) return null;
  }
  for(var k = 1; k < toks.length; k += 2){
    if(!isQtyTok(toks[k])) return null;
  }
  var out = [];
  for(var j = 0; j < toks.length; j += 2){
    if(toks[j].length > 12) return null;
    out.push({ name:toks[j], qty:toks[j + 1] });
  }
  return out;
}
/* 菜名后面常跟着一句简介（截图识别尤其常见），只取开头那一段 */
function shortTitle(s){
  var t = String(s || '').trim();
  var m = t.match(/^[^\s，。、；：:,!?！？]{2,20}/);
  return m ? m[0] : t;
}

/* 作者署名：从截图识别或整段复制来的文字里常带「作者：xxx」，单独摘出来，
   一是能填进 author 字段，二是不让它混进菜名或步骤 */
var AUTHOR_RE = /作者\s*[:：]\s*([^\s，。、|｜（）()【】\[\]:：；;]{1,20})/;
function pickAuthor(s){
  var m = String(s || '').match(AUTHOR_RE);
  return m ? m[1].trim() : '';
}

/* 截图 OCR 出来的文字，段落标题常被吞掉、整段糊成一行，按行的状态机会直接失效。
   这里只做一件事：在最不可能出现在正文里的几个词前面补换行，把段落边界找回来。
   条件很窄——只有「有换行但很少（≤4 行）且文字不短」时才动，正常复制的文本一个字都不改。 */
function reflowText(raw){
  var s = String(raw || '');
  var rows = s.split('\n').filter(function(x){ return x.trim(); });
  if(rows.length > 4 || s.length < 80) return s;
  s = s.replace(/[\u3000\u00a0]/g, ' ').replace(/[|｜]/g, '\n');
  /* 只有「用料」在菜谱正文里基本不当普通词用，可以不带冒号就切。
     「食材 / 原料」不行——「用最简单的食材」这种简介会被切坏，必须带冒号 */
  s = s.replace(/用料\s*[:：]?/g, '\n用料\n');
  s = s.replace(/(食材|原料)\s*[:：]/g, '\n$1：\n');
  s = s.replace(/(主料|辅料|配料|调料|调味料)\s*[:：]/g, '\n$1：\n');
  /* 「的」是安全锚点：「这道菜做法简单」不会被切，「番茄炒蛋的做法」会 */
  s = s.replace(/(做法步骤|烹饪步骤|制作步骤|的做法|做法大全|的小贴士)/g, '\n$1\n');
  /* 裸「做法：」「步骤：」也要断开——OCR 和手打常常不带「的」。
     前面排除「的」，免得把刚切好的「的做法」再切一次。 */
  s = s.replace(/(^|[^的])(做法|步骤)\s*[:：]/g, '$1\n$2：\n');
  s = s.replace(/(小贴士|烹饪技巧|贴士)\s*[:：]/g, '\n$1：\n');
  s = s.replace(/步骤\s*(\d+)/g, '\n步骤$1\n');
  return s;
}

/* 手机上复制粘贴常带看不见的字符：零宽空格、BOM、全角空格，
   还有 ①②③ 这种带圈序号。不清掉会直接影响分段和食材识别 */
function cleanPaste(raw){
  var s = String(raw == null ? '' : raw);
  s = s.replace(/[\u200b-\u200f\u2028\u2029\ufeff\u2060]/g, '');
  s = s.replace(/\u3000/g, ' ');
  s = s.replace(/\r\n?/g, '\n');
  /* 带圈数字 1-20 还原成「1. 」并另起一行 */
  s = s.replace(/[\u2460-\u2473]/g, function(ch){
    return '\n' + (ch.charCodeAt(0) - 0x2460 + 1) + '. ';
  });
  return s;
}
/* 像不像一个人名：作者行没有数字和标点，也不是食材或调料 */
function isNameLike(s){
  var t = String(s || '').trim();
  if(t.length < 2 || t.length > 16) return false;
  if(/[\d，。、；：,;:！!？?（）()【】\[\]·|｜]/.test(t)) return false;
  if(/(用料|食材|做法|步骤|贴士|下厨房|收藏|分享|评论|关注|发布于)/.test(t)) return false;
  if(matchIng(t) || isSeasoning(t)) return false;
  return true;
}

/* 手机上复制，三步常挤成一行：「1.切块 2.炒蛋 3.下番茄」。
   只有序号严格 1、2、3 递进才拆，避免把「2.5 克」这类数字当步骤号 */
function splitSteps(L){
  var s = String(L || '');
  var re = /(?:^|[\s。；;，,：:（(])(\d{1,2})\s*[.、．)）]\s*/g;
  var idx = [], m;
  while((m = re.exec(s))) idx.push({ at:m.index, no:Number(m[1]), end:re.lastIndex });
  if(idx.length < 2) return null;
  for(var q = 0; q < idx.length; q++) if(idx[q].no !== q + 1) return null;
  var out = [];
  for(var w = 0; w < idx.length; w++){
    var from = idx[w].end;
    var to = w + 1 < idx.length ? idx[w + 1].at : s.length;
    var seg = s.slice(from, to).trim().replace(/^[，,、；;。\s]+/, '');
    if(seg) out.push(seg);
  }
  return out.length >= 2 ? out : null;
}

function parseRecipeText(raw){
  var txt = cleanPaste(raw);
  /* 分享文案里常夹着链接，先摘出来存成来源，再从正文里去掉，免得被当成一步 */
  var pickedSrc = findUrl(txt);
  var pickedAuthor = pickAuthor(txt);
  /* 署名只抠掉那一小段，不整行删——OCR 出来的常常整段就是一行 */
  txt = txt.replace(AUTHOR_RE, ' ');
  txt = reflowText(txt);
  var lines = txt.replace(/https?:\/\/[^\s，。、）)】"'<>]+/gi, '')
    .replace(/\r/g, '').split('\n')
    .map(function(s){ return s.replace(/^[\s·•*]+/, '').replace(/\s+$/, ''); })
    .filter(function(s){ return s.length > 0 && !/^(来源|链接|原文|出处)\s*[:：]?$/.test(s); });
  if(!lines.length) return null;

  var d = { n:'', needs:[], unknown:[], steps:[], tip:'', src:pickedSrc || '',
            author:pickedAuthor || '', custom:[] };
  var mode = 'head', titled = false, grouped = false, titleRow = -1;

  for(var i = 0; i < lines.length; i++){
    var L = lines[i];

    /* 抓菜名之前先跳过分享文案的噪声行。
       前缀类（复制这条信息…）用开头匹配；「下厨房」这种水印词必须整行相等，否则会误伤真菜名 */
    if(mode === 'head' && !titled &&
       (/^(复制这条|复制链接|复制信息|打开小红书|打开下厨房|打开 ?APP|长按识别|戳这里|点击查看)/.test(L) ||
        /^(下厨房|家常菜谱|收藏|关注)$/.test(L))) continue;

    /* 段落标题：可以是「用料」，也可以是「咖喱鸡的做法」这种带菜名的。
       用料类必须整行就是标题——原来没锚行首，「准备好所有材料」会把状态机
       切回用料段，后面那些短步骤就被吞掉了 */
    if(/^(用料|食材|原料|材料|所需食材|食材准备)\s*[:：]?$/.test(L) && L.length <= 30){ mode = 'ing'; continue; }
    if(/^(主料|辅料|配料|调料|调味料)\s*[:：]?$/.test(L)){ mode = 'ing'; continue; }
    if(/(做法|步骤|制作方法)\s*[:：]?$/.test(L) && L.length <= 30 && !/\d/.test(L) && !/^步骤\s*\d/.test(L)){ mode = 'step'; continue; }
    if(/(小贴士|贴士|烹饪技巧|tips?)\s*[:：]?$/i.test(L) && L.length <= 30){ mode = 'tip'; continue; }

    /* 菜名下面紧跟的一行如果像人名，那是作者，不是第一步做法。
       限定「紧跟在菜名后一行」，避免把「热锅倒油」这种短步骤错认成作者 */
    if(mode === 'head' && titled && !d.author && i === titleRow + 1 && isNameLike(L)){
      d.author = L; titleRow = i; continue;
    }

    if(mode === 'head'){
      /* 整段被识别成一行时，头一段是「菜名」，后面跟的是营销简介。
         取开头那一截当菜名，简介不是做法，丢掉 */
      if(!titled && i === 0 && L.length > 30){
        var nm0 = L.match(/^[^\s，。、；：:,]{2,20}/);
        if(nm0){
          d.n = shortTitle(nm0[0].replace(/[\s·]*下厨房[\s·]*$/, '').trim());
          titled = true; titleRow = i; continue;
        }
      }
      /* 下一行就是「2个」这种数量，说明这行是食材不是菜名 */
      if(!titled && L.length <= 30 && !/^\d+[.、]/.test(L) &&
         !looksLikeIngredient(L) && !isQtyLine(lines[i + 1] || '')){
        d.n = shortTitle(L.replace(/的(做法|家常做法|做法步骤|做法大全).*$/, '')
                .replace(/\s*[—\-|｜].*$/, '')
                .replace(/[\s·]*下厨房[\s·]*$/, '')
                .trim());
        titled = true; titleRow = i; continue;
      }
      mode = (looksLikeIngredient(L) || isQtyLine(lines[i + 1] || '')) ? 'ing' : 'step';
    }

    if(mode === 'ing'){
      var nxt = lines[i + 1] || '';
      /* 「名字 / 数量」分两行的写法（豆果、美食杰常见） */
      if(!looksLikeIngredient(L) && L.length <= 12 && isQtyLine(nxt)){
        var pid0 = matchIng(L);
        if(pid0){ if(d.needs.indexOf(pid0) < 0) d.needs.push(pid0); }
        else if(!isSeasoning(L)) d.unknown.push(L);
        i++;
        continue;
      }
      /* 一整行挤了好几样（截图识别常这样）：「番茄 一个 鸡蛋 2个 盐 适量」 */
      var multi = multiIngOf(L);
      if(multi){
        multi.forEach(function(p){
          var pid2 = matchIng(p.name);
          if(pid2){ if(d.needs.indexOf(pid2) < 0) d.needs.push(pid2); }
          else if(!isSeasoning(p.name) && p.name.length <= 10 && p.qty) d.unknown.push(p.name);
        });
        continue;
      }
      if(looksLikeIngredient(L)){
        var p = splitIngLine(L);
        var pid = matchIng(p.name);
        if(pid){ if(d.needs.indexOf(pid) < 0) d.needs.push(pid); }
        else if(!isSeasoning(p.name) && p.name.length <= 10) d.unknown.push(p.name);
        continue;
      }
      /* 既不像用料、又不在「名字/数量」两行式里的行。
         带句号逗号的、以动作开头的，是做法，转段；短名词留成「没认出」让人确认，
         别像原来那样直接 continue 吞掉——那样用户只会看到「步骤少了几步」 */
      if(L.length > 12 || /[。，；]/.test(L) ||
         /^(把|将|先|再|然后|最[后初]|下锅|倒入|放入|加入|出锅|盛出)/.test(L) ||
         /(煮|炒|煎|蒸|烤|炖|焖|拌|焯|切|剁|拍|揉|炸|熬|淋|撒|盛|装盘)/.test(L)){
        mode = 'step'; d.steps.push(stripStepNo(L));
      } else if(!isSeasoning(L) && L.length <= 10){
        d.unknown.push(L);
      }
      continue;
    }

    if(mode === 'step'){
      if(/^(小贴士|贴士|烹饪技巧|tips?)\s*[:：]?$/i.test(L) && L.length <= 20){ mode = 'tip'; continue; }
      /* 「步骤1 / 步骤2」后面常跟好几行，归成同一步 */
      if(/^步骤\s*\d+$/.test(L)){ d.steps.push(''); grouped = true; continue; }
      /* 多步挤成一行时先按序号拆开 */
      if(!grouped){
        var ms = splitSteps(L);
        if(ms){ ms.forEach(function(x){ d.steps.push(x); }); continue; }
      }
      var s = stripStepNo(L);
      if(!s) continue;
      if(grouped && d.steps.length && d.steps[d.steps.length - 1] !== null){
        var k = d.steps.length - 1;
        d.steps[k] = d.steps[k] ? d.steps[k] + ' ' + s : s;
      } else {
        d.steps.push(s);
      }
      continue;
    }

    if(mode === 'tip'){ d.tip = (d.tip ? d.tip + ' ' : '') + L; }
  }

  d.steps = d.steps.filter(function(s){ return s && s.trim(); });

  /* 兜底：只粘了「菜名 + 一行作者」时，把那一行挪成作者。
     条件必须收紧到「只有一行正文」，否则任何两字步骤（装盘、切片、拌匀）
     都会通过 isNameLike 被当成人名扣走，步骤就少一步 */
  if(!d.needs.length && !d.author && d.steps.length === 1 && isNameLike(d.steps[0])){
    d.author = String(d.steps[0]).trim();
    d.steps = [];
  }
  d.m = d.steps.map(function(s, i){ return (i + 1) + '. ' + s; }).join('\n');
  if(!d.m && d.tip) d.m = d.tip;
  return d;
}

/* ============================================================
   菜谱编辑器
   ============================================================ */
var VESSEL_OPTS = [['pan','炒锅'],['water','水锅'],['steamer','蒸屉'],['microwave','微波'],
                   ['airfryer','空气炸锅'],['pre','现成'],['none','不用锅']];
var CUISINE_OPTS = ['中式','西式','泰式','通用'];
var LV_OPTS = ['L1','L2','L3','—'];

/* ---- 原菜谱链接 ----
   存进 state 的 URL 会直接进 href，所以只放行 http(s)：
   javascript: / data: 这类一律变空，避免自己给自己埋坑。
   手输时允许只打 www.xiachufang.com/recipe/123，自动补 https:// */
function safeUrl(u){
  var s = String(u == null ? '' : u).trim().replace(/[，。、）)】"'<>]+$/, '');
  if(!s) return '';
  if(/^\/\//.test(s)) s = 'https:' + s;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s) && /^[\w-]+(\.[\w-]+)+(\/|$|\?)/.test(s)) s = 'https://' + s;
  return /^https?:\/\/[^\s]+$/i.test(s) ? s : '';
}
/* 链接显示成站点名，比一长串 URL 好认 */
function srcHost(u){
  var m = String(u || '').match(/^https?:\/\/(?:www\.|m\.)?([^\/:?#]+)/i);
  if(!m) return '原菜谱';
  var h = m[1].toLowerCase();
  if(/xiachufang/.test(h)) return '下厨房';
  if(/douguo/.test(h)) return '豆果美食';
  if(/meishij\.net|meishi\.cc/.test(h)) return '美食杰';
  if(/meishichina/.test(h)) return '美食天下';
  if(/xiaohongshu|xhslink/.test(h)) return '小红书';
  if(/bilibili|b23\.tv/.test(h)) return 'B 站';
  if(/weixin|qq\.com/.test(h)) return '公众号';
  return h.replace(/^www\./, '');
}
/* 粘贴的整段文字里常带着链接（公众号、小红书分享尤其多），顺手捡出来 */
function findUrl(s){
  var m = String(s || '').match(/https?:\/\/[^\s，。、）)】"'<>]+/i);
  return m ? safeUrl(m[0]) : '';
}
/* 输入框里可能是纯链接，也可能是一整段分享文案：先找链接，找不到再当纯链接规范化 */
function pickSrc(v){ return findUrl(v) || safeUrl(v); }
function srcLink(u, extra){
  var s = safeUrl(u);
  if(!s) return '';
  return '<a class="srclink" href="' + esc(s) + '" target="_blank" rel="noopener noreferrer"' +
         (extra ? ' style="' + extra + '"' : '') + '>↗ ' + esc(srcHost(s)) + ' 原菜谱</a>';
}
/* 作者名：同名的菜太多，靠它认出是哪一版 */
function authorTag(it){
  var a = it && it.author;
  if(!a) return '';
  return '<span class="byline">@' + esc(a) + '</span>';
}

function emptyDraft(cat){
  return {
    _new:1, id:'', n:'', cat:cat || 'fiber', hand:5, wall:5, fire:'none', vessel:'none',
    staple:'', needs:[], taste:[0,0,0], cuisine:'中式', lv:'L2', cap:null, red:0, fiber:0,
    m:'', prep:[], note:'', unknown:[], src:'', author:'',
    /* _auto：这一项还是「机器猜的」——用户点一下改，就不再覆盖了 */
    _auto:{cat:1, time:1, fire:1, vessel:1}, _more:0, _pad:0
  };
}
function draftFrom(it){
  var d = emptyDraft(it.cat);
  Object.keys(it).forEach(function(k){ d[k] = it[k]; });
  d._new = 0;
  d.needs = (it.needs || []).slice();
  d.taste = (it.taste || [0,0,0]).slice();
  d.prep = (it.prep || []).map(function(p){
    var o = {min:p.min, text:p.text, ph:p.ph};
    if(p.am) o.am = 1;
    return o;
  });
  d.unknown = [];
  /* 已经存下来的菜谱，字段都是人定过的，不要再被推断覆盖 */
  d._auto = {cat:0, time:0, fire:0, vessel:0};
  return d;
}
function prepToText(arr){
  return (arr || []).map(function(p){ return p.min + ' ' + p.text + (p.ph ? ' | ' + p.ph : ''); }).join('\n');
}
function textToPrep(txt){
  return String(txt || '').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    var ph = '', i = l.indexOf('|');
    if(i >= 0){ ph = l.slice(i + 1).trim(); l = l.slice(0, i).trim(); }
    var m = l.match(/^(\d+)\s*[分钟′']*\s*(.*)$/);
    var body = (m ? m[2] : l).trim();
    /* 「早上现做」的备料不能算进「今晚」清单，编辑来回一趟也要保住这个标记 */
    var o = {min: m ? Number(m[1]) : 0, text: body, ph: ph};
    if(/早上现做|早上做|不能提前/.test(body)) o.am = 1;
    return o;
  });
}

function fld(label, id, val, hint, type){
  return '<div class="field"><span>' + label + '</span><input id="' + id + '" type="' + (type || 'text') + '" value="' +
    esc(val) + '">' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function fseg(label, act, opts, cur){
  var h = '<div class="field"><span>' + label + '</span><div class="segtiny">';
  opts.forEach(function(o){
    h += '<button class="' + (String(cur) === String(o[0]) ? 'on' : '') + '" data-act="' + act + '" data-v="' + o[0] + '">' + o[1] + '</button>';
  });
  return h + '</div></div>';
}

/* ============================================================
   菜谱编辑器
   设计原则：机器先猜，人只确认。
   一屏里只有一处必须打字（菜名）；三行「自动判断」全部预选好；
   另外十几个字段全塞进「更多」，默认不出现。
   ============================================================ */
var TIME_OPTS = [['q','5 分钟'],['m','10 分钟'],['l','20 分钟']];
var TIME_VAL = {q:{hand:3, wall:4}, m:{hand:8, wall:10}, l:{hand:5, wall:18}};
var PROTEIN_IDS = ['egg','yogurt','milk','beef','pork','chickenBreast','chickenThigh',
                   'tofuSoft','tofuFirm','wonton','chickpea','nuts'];
var CARB_IDS = ['potato','sweetPotato','purpleSweetPotato','yam','pumpkin','corn','mixedGrain',
                'bread','mantou','oats','pancake','fruit'];

/* 时间只给三个档：5 分钟以内 / 10 分钟左右 / 20 分钟内 */
function timeKey(d){
  if(d.hand <= 4 && d.wall <= 6) return 'q';
  if(d.wall <= 12) return 'm';
  return 'l';
}
function setTimeKey(d, k){
  var t = TIME_VAL[k] || TIME_VAL.m;
  d.hand = t.hand; d.wall = t.wall;
}
function autoLeft(d){
  var a = d._auto || {};
  return ['cat','time','fire'].filter(function(k){ return a[k]; }).length;
}

/* 从菜名 + 做法 + 用料里把能推的全推出来。
   分类、红肉、纤维、口味、菜系、难度都是内部字段，不给用户看 */
function inferRecipe(d){
  var ing = d.needs || [];
  var txt = (d.n || '') + ' ' + (d.m || '');
  var has = function(list){ return ing.some(function(x){ return list.indexOf(x) >= 0; }); };
  var a = d._auto || {};

  if(a.cat){
    var nm = d.n || '';
    /* 菜名里的「鸡/鱼/肉」要放在「有任意食材就判纤维」之前：
       否则「香菇滑鸡」只要认出一个香菇，就被判成纤维，永远进不了蛋白格 */
    if(has(PROTEIN_IDS) || /肉|蛋|鱼|虾|鸡|牛|猪|豆腐|奶/.test(nm)) d.cat = 'protein';
    else if(has(CARB_IDS) || /土豆|红薯|南瓜|玉米|山药|面|饭|馒头|粥|包/.test(nm)) d.cat = 'carb';
    else if(ing.length) d.cat = 'fiber';
  }
  if(a.time || a.fire || a.vessel){
    var g = guessCook(txt);
    if(a.fire) d.fire = g.fire;
    if(a.vessel) d.vessel = g.vessel;
    if(a.time){ d.hand = g.hand; d.wall = Math.max(g.wall, g.hand); }
  }
  var RED_IDS = ['beef', 'pork', 'porkMince', 'lamb', 'bacon', 'sausage'];
  d.red = ing.some(function(x){ return RED_IDS.indexOf(x) >= 0; }) ? 1 : 0;
  d.fiber = (d.cat === 'protein' && (ing.indexOf('chickpea') >= 0 || ing.indexOf('woodEar') >= 0)) ? 1 : 0;
  /* 口味顺序按 schema：[浓淡, 酸, 辣]，每项 0–2。
     原来写成 [酸, 辣, 浓] 且只给 0/1 —— tastePenalty 用 taste[1]>=2 判酸、taste[2]>=2 判辣，
     顺序和阈值同时错位，「双酸/双辣」对自建菜永远不成立。
     另外不能无条件重算：菜谱里的口味是录入时标的，改一个用料就冲掉，等于白标了。 */
  if(!(d.taste || []).some(function(x){ return x; })){
    d.taste = [
      /红烧|浓|酱|卤|炖/.test(txt) ? 2 : 0,
      /酸|醋|柠檬|百香果/.test(txt) ? 2 : 0,
      /辣|椒|剁椒|泡椒/.test(txt) ? 2 : 0
    ];
  }
  d.cuisine = /泰/.test(txt) ? '泰式' : (/(沙拉|吐司|三明治|意面|芝士|黄油|烤)/.test(txt) ? '西式' : '中式');
  if(!d.staple || a.cat) d.staple = ing[0] || d.staple || '';
  d.lv = d.hand <= 4 ? 'L2' : 'L1';
  return d;
}

function arow(label, act, opts, cur){
  var h = '<div class="arow"><span>' + label + '</span><div class="segtiny">';
  opts.forEach(function(o){
    h += '<button class="' + (String(cur) === String(o[0]) ? 'on' : '') + '" data-act="' + act +
         '" data-v="' + o[0] + '">' + o[1] + '</button>';
  });
  return h + '</div></div>';
}

function allIngIds(){
  var out = Object.keys(SHELF).concat(PANTRY);
  Object.keys(ING).forEach(function(k){ if(out.indexOf(k) < 0) out.push(k); });
  Object.keys(state.extraIng || {}).forEach(function(k){ if(out.indexOf(k) < 0) out.push(k); });
  return out;
}

    });
    h += '</div></div>';
    h += '<div class="field"><span>限量</span><div class="segtiny">';
    [[-1,'不限'],[1,'每周 1 次'],[0.5,'两周 1 次']].forEach(function(o){
      var cv = d.cap == null ? -1 : d.cap;
      h += '<button class="' + (String(cv) === String(o[0]) ? 'on' : '') + '" data-act="dcap" data-v="' + o[0] + '">' + o[1] + '</button>';

    h += '<div class="field"><span>备注</span><input id="f_note" type="text" value="' + esc(d.note || '') + '" placeholder="比如：钠高，一周不超过 1 次"></div>';

  }

  h += '<div class="sheetfoot"><div class="actions" style="margin-top:0">' +
       '<button class="btn btn-ghost" data-act="rCancel">取消</button>' +
       '<button class="btn btn-primary" data-act="rSave">保存</button></div></div>';

         '<button class="linkbtn" data-act="rImport">手上只有菜名、没有文字 → 先记进待补录</button></div>';
  } else {
    h += '<div style="margin-top:10px"><button class="btn btn-ghost" data-act="rDel" data-id="' + esc(d.id) +
         '" style="width:100%;font-size:12.5px;color:#A0503A">删掉这道菜</button></div>';
  }
  h += '<div class="foot" style="margin-top:10px">存下来就能被今天的推荐用上。</div>';
  return h;
}

/* 粘贴 → 合并进当前草稿（菜名/作者/链接已有的不覆盖，方便从待补录进来接着粘） */
function doPasteParse(){
  /* 先把表单里已经打好的字收回草稿：粘贴框里的内容识别后会重绘整个面板，
     不先读回来的话，用户先打的菜名/作者/链接会被这次重绘抹掉。
     而识别结果只在「认出了菜名」时才覆盖，所以手打的菜名恰好是最容易丢的那种 */
  readForm();
  var el = document.getElementById('f_paste');
  var txt = el ? el.value : (ui.pasteTxt || '');
  ui.pasteTxt = txt;
  if(!String(txt || '').trim()){
    toast('先把菜谱文字粘进框里');
    return;
  }
  var p = parseRecipeText(txt);
  var hasIng = p && (p.needs || []).length;
  var hasStep = p && (p.steps || []).length;
  if(!p || (!p.n && !hasIng && !hasStep)){
    ui.impInfo = '<b>这段里没认出菜名，也没认出用料</b>，多半只复制到了界面上的按钮。手填也一样能存。';
    renderSheet(); return;
  }
  var d = ui.draft;
  if(p.n) d.n = p.n;
  if(p.author) d.author = p.author;
  var src = pickSrc(p.src);
  if(src) d.src = src;
  if(hasIng) d.needs = p.needs.slice();
  if(p.unknown && p.unknown.length) d.unknown = p.unknown;
  if(p.steps && p.steps.length) d.m = p.steps.map(function(s, i){ return (i + 1) + '. ' + s; }).join('\n');
  else if(p.tip) d.m = p.tip;
  /* 不要重置 _auto：用户已经点过的「放哪一格 / 要多久 / 守着锅吗」是人的决定，
     粘贴只是补内容，不该把人刚做的选择推翻。新建草稿的 _auto 本来就是全自动 */
  inferRecipe(d);
  d._pasteOpen = 0;
  ui.impInfo = impSummary(d);
  renderSheet();
}

/* 把表单里的值读回草稿。任何会重绘表单的点击都要先调它，否则输入会丢 */
function readForm(){
  var d = ui.draft;
  if(!d) return null;
  var val = function(id){ var el = document.getElementById(id); return el ? el.value : null; };
  var v;
  if((v = val('f_n')) != null) d.n = v.trim();
  if((v = val('f_hand')) != null){
    var hv = Math.max(0, Math.min(120, Math.round(Number(v) || 0)));
    /* 手改了精确分钟，就当成人的决定：否则下一次点用料/inferRecipe 会把机器猜的值盖回来 */
    if(hv !== d.hand) d._auto.time = 0;
    d.hand = hv;
  }
  if((v = val('f_wall')) != null){
    var wv = Math.max(0, Math.min(300, Math.round(Number(v) || 0)));
    if(wv !== d.wall) d._auto.time = 0;
    d.wall = wv;
  }
  if((v = val('f_m')) != null) d.m = v;
  if((v = val('f_prep')) != null) d.prep = textToPrep(v);
  if((v = val('f_note')) != null) d.note = v.trim();
  if((v = val('f_src')) != null) d.src = pickSrc(v) || v.trim();
  if((v = val('f_author')) != null) d.author = v.trim().replace(/^作者[:：]\s*/, '').slice(0, 40);
  return d;
}

/* 只有「没菜名」是真拦。别的都能救：时间对不上就自动纠正，用料空着也能存，
   只是不进采购清单——为用户记一道菜设关卡，最后没人愿意记 */
function validateDraft(d){
  if(!d.n) return '先起个菜名';
  if(d.src && !safeUrl(d.src)) return '链接要以 http:// 或 https:// 开头';
  if(d.wall < d.hand) d.wall = d.hand;
  return null;
}

function openEditor(it){
  ui.draft = it ? draftFrom(it) : emptyDraft(ui.libCat === 'all' || ui.libCat === 'protein' ? 'protein' : ui.libCat);
  if(!it){
    ui.draft._pasteOpen = 1;
    ui.pasteTxt = '';
  }
  ui.sheetType = 'recipe';
  ui.sheet = true;
  ui.impInfo = '';   /* 手点进来编辑的，不要显示上一次导入的识别摘要 */
  ui.pendFrom = '';  /* 也不是从待补录进来的 */
  ui.ingQ = '';
  renderSheet();
}

/* ---------- 导入 ---------- */
var PROTEIN_ING = ['egg','yogurt','milk','beef','pork','chickenBreast','chickenThigh',
                   'tofuSoft','tofuFirm','wonton','chickpea','nuts'];
function guessCat(needs){
  var p = needs.filter(function(id){ return PROTEIN_ING.indexOf(id) >= 0; });
  return p.length ? 'protein' : 'fiber';
}

/* 解析结果 → 可直接编辑的草稿。能推的一次推完，人只需要确认 */
function toDraft(d){
  var cat = d.cat || guessCat(d.needs || []);
  var base = emptyDraft(cat);
  Object.keys(base).forEach(function(k){ if(d[k] == null) d[k] = base[k]; });
  d._auto = {cat:1, time:1, fire:1, vessel:1};
  if(!d.n) d.n = '导入的菜';
  return inferRecipe(d);
}

             '</div>') +

  }

  return h;
}

/* 从待补录那一条起一个草稿：菜名、作者、链接先带过去，粘贴框留在最上面 */
function pendingToDraft(x){
  var d = emptyDraft('protein');
  d._new = true;
  d._pasteOpen = 1;
  d.n = x && x.n ? x.n : '';
  d.author = (x && x.author) || '';
  d.src = pickSrc(x && x.src) || '';
  return d;
}

/* 自己填完存盘后，把清单里那条同名（且作者不冲突）的去掉，不用手动删 */
function dropFilledPending(d){
  var a = dishCore(d && d.n);
  if(!a) return 0;
  var before = (state.pending || []).length;
  state.pending = (state.pending || []).filter(function(x){
    if(dishCore(x.n) !== a) return true;
    /* 两边都写了作者且不是同一个，说明是同名的另一版，留着 */
    if(d.author && x.author && normDish(d.author) !== normDish(x.author)) return true;
    /* 自己填的这道没写作者，就别去认领「指明要某位作者」的那条：
       认领了等于静默删掉用户的需求，之后也发不出去了 */
    if(!d.author && x.author) return true;
    return false;
  });
  var n = before - state.pending.length;
  if(n) save();
  return n;
}

/* 这条是不是已经补进菜谱了：按菜名对（去掉括号内容和空格）。
   严格相等，是因为「凉拌菠菜」不该被「凉拌菠菜粉丝」顶掉。 */
function normDish(s){
  return String(s || '').replace(/[（(][^）)]*[）)]/g, '').replace(/[\s·]+/g, '').toLowerCase();
}
/* 下厨房的标题常带一长串卖点：「肉末嫩豆腐｜嫩滑爽口！超级下饭！！（减脂版）」。
   只取竖线/叹号/冒号前面那段当菜名，否则跟库里的「肉末嫩豆腐」永远对不上。 */
function dishCore(s){
  return normDish(s).split(/[|｜!！?？。，,、:：;；~～—–]+/)[0];
}
function pendingIsDone(x){
  var a = dishCore(x.n);
  if(!a) return false;
  return ITEMS.some(function(it){ return dishCore(it.n) === a; });
}

/* 一键复制清单。剪贴板不可用（老浏览器 / 权限被拒）就退回全选，
   让人自己按 Ctrl+C —— 手机上长按也能复制 */
function copyPending(){
  var txt = pendingText();
  var fallback = function(){
    var pt = document.getElementById('pendTxt');
    if(pt && pt.select){
      pt.focus(); pt.select();
      if(pt.setSelectionRange) pt.setSelectionRange(0, pt.value.length);
    }
    toast('已全选，按 Ctrl+C 或长按「复制」');
  };
  if(typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      toast('复制好了，粘到 WorkBuddy 对话框发我');
    })['catch'](fallback);
  } else fallback();
}

/* 手机上一键把清单发出去：调系统分享面板，选 WorkBuddy / 微信，不用复制粘贴 */
function sharePending(){
  var txt = pendingText();
  if(typeof navigator !== 'undefined' && navigator.share){
    navigator.share({ title: '待补录的菜', text: txt })['catch'](function(err){
      if(err && err.name === 'AbortError') return;   /* 自己点了取消，不要紧 */
      copyPending();
    });
  } else {
    copyPending();   /* 电脑浏览器多数没有分享面板，退回复制 */
  }
}

/* 解析完给一句「我填好了什么」，缺的部分点出来，不用人自己找 */
function impSummary(d){
  var step = (d.m || '').split('\n').filter(function(x){ return x.trim(); }).length;
  var p = [d.n ? '菜名「' + esc(d.n) + '」' : '<b>没认出菜名</b>'];
  if(d.author) p.push('作者「' + esc(d.author) + '」');
  p.push(d.needs.length ? '用料 ' + d.needs.length + ' 样' : '<b>没认出用料</b>');
  p.push(step ? '做法 ' + step + ' 步' : '<b>没认出做法</b>');
  return '已填好 · ' + p.join(' · ');
}


/* 待补录：只有菜名和作者、还缺内容的菜，攒着等联网去查 */
function addPending(row){
  state.pending = state.pending || [];
  var hit = -1;
  state.pending.forEach(function(x, k){
    if(x.n === row.n && (x.author || '') === (row.author || '')) hit = k;
  });
  if(hit >= 0){
    if(row.src) state.pending[hit].src = row.src;
  } else {
    state.pending.unshift({ n:row.n, author:row.author || '', src:row.src || '', at:todayStr() });
  }
  save();
}
/* 给用户复制的一段清单，直接发出去就能查。已经补过的不用再发 */
function pendingText(){
  var rows = (state.pending || []).filter(function(x){ return !pendingIsDone(x); }).map(function(x){
    return x.n + (x.author ? ' / ' + x.author : '') + (x.src ? ' / ' + x.src : '');
  });
  if(!rows.length) return '（清单里的都补好了）';
  return '这几道菜帮我补一下（菜名 / 作者 / 链接）：\n' + rows.join('\n');
}

/* 只有菜名和作者：不开解析器，直接记进待补录。
   这个页面离线，上不了网也抓不了下厨房（对方对非浏览器请求一律 404 / 滑动验证），
   所以这里只负责「记下来」，内容由联网那边补。 */
function doAddByName(){
  var nEl = document.getElementById('nmName');
  var aEl = document.getElementById('nmAuthor');
  var sEl = document.getElementById('nmSrc');
  var n = nEl ? nEl.value.trim() : '';
  var a = aEl ? aEl.value.trim() : '';
  var s = sEl ? sEl.value : '';
  ui.nmName = n; ui.nmAuthor = a; ui.nmSrc = s;

  /* 「作者：xxx」这种前缀随手去掉 */
  a = a.replace(/^(作者|出自|原作者|by)\s*[:：]?\s*/i, '').trim().slice(0, 40);

  if(!n){
    ui.impMsg = {t:'err', m:'菜名得填一个，不然我不知道要搜什么。'};
    renderSheet(); return;
  }
  var url = pickSrc(s);
  if(String(s || '').trim() && !url){
    ui.impMsg = {t:'err', m:'链接没认出来，要以 http:// 或 https:// 开头；不填也行，只填菜名和作者就够。'};
    renderSheet(); return;
  }

  addPending({ n:n, author:a, src:url });
  /* 清空表单，方便接着填下一道 */
  ui.nmName = ''; ui.nmAuthor = ''; ui.nmSrc = '';
  ui.impMsg = {t:'ok', m:'记好了：' + n + (a ? ' / ' + a : '') +
    '。待补录现在 ' + state.pending.length + ' 道——想自己录，去清单点「照着填内容」；想省事，点「发给 WorkBuddy」一键甩给我。'};
  renderSheet(); render();
}

function addIngToDraft(name){
  var t = String(name || '').trim();
  if(!t) return;
  var id = matchIng(t);
  if(!id){
    /* 冰箱里可能已经有这条自定义食材（cus_xxx）。不认它就会另起一个 x_xxx，
       于是「冰箱里明明有」照样被列进今天要买 */
    var cus = (state.inventory || []).filter(function(x){ return x.custom && x.name === t; })[0];
    id = cus ? cus.id : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
    state.extraIng[id] = t;
    save();
  }
  if(ui.draft.needs.indexOf(id) < 0) ui.draft.needs.push(id);
}
/* 老数据或手改过的备份可能缺字段（没有 taste 数组，
   tastePenalty 里读 x.taste[1] 就会抛错，而它在渲染链上，一崩就是白屏） */
function normItem(it){
  it.needs = Array.isArray(it.needs) ? it.needs : [];
  it.taste = (Array.isArray(it.taste) && it.taste.length === 3) ? it.taste : [0, 0, 0];
  it.prep = Array.isArray(it.prep) ? it.prep : [];
  if(it.hand == null) it.hand = 5;
  if(it.wall == null) it.wall = it.hand;
  return it;
}
function rebuildItems(){
  var out = [];
  /* 只有一份来源：你自己存下来的菜谱。没有代码里的常量参与，
     所以删除就是真删，不会哪天又冒出来 */
  state.recipes.forEach(function(it){
    if(state.hidden.indexOf(it.id) >= 0) return;
    out.push(normItem(it));
  });
  ITEMS.length = 0;
  Array.prototype.push.apply(ITEMS, out);
  return ITEMS;
}
/* 以前用来区分「代码自带」和「自己建的」。现在只有自己建的，
   留着空实现是因为老数据的 hidden / edits 里还带 p01… 这类 id */
function isBuiltin(id){ return false; }
/* 食材显示名：食材表 > 编辑器里新起的名字 > 原样返回 */
function ingName(id){ return (id && (ING[id] || state.extraIng[id])) || id || ''; }

/* 存一条：id 为空即新建；同 id 就是整条替换 */
function saveRecipe(d){
  /* 新建的草稿 id 是空串。不补的话，第二道会命中「id 也是空串」的第一道，直接把它覆盖掉。
     原来只有测试代码在补 id，生产路径没补——连存两道自建菜，库里只会剩最后一道。 */
  if(!d.id) d.id = newRecipeId();
  d._new = 0;
  var item = {
    id:d.id, n:d.n, cat:d.cat, hand:d.hand, wall:d.wall, fire:d.fire, vessel:d.vessel,
    staple:d.staple, needs:d.needs.slice(), taste:(d.taste || [0,0,0]).slice(), cuisine:d.cuisine,
    lv:d.lv, m:d.m, prep:(d.prep || []).slice(), src:pickSrc(d.src)
  };
  /* 现在只有一种来源：你自己存下来的，整条替换。所以空值就是不写，
     清空作者、取消限量都能如实存下去 */
  if(d.author) item.author = d.author;
  if(d.note) item.note = d.note;
  if(d.cap != null) item.cap = d.cap;
  if(d.red) item.red = 1;
  if(d.fiber) item.fiber = 1;
  if(d.ext) item.ext = 1;
  var hit = -1;
  state.recipes.forEach(function(x, k){ if(x.id === d.id) hit = k; });
  if(hit >= 0) state.recipes[hit] = item; else state.recipes.push(item);
  rebuildItems(); dropPickIfTouched(d.id); save();
  return d.id;
}
/* 改了/删了正在今天这顿里的菜，就让它重排，别留一道已经不存在的菜 */
function dropPickIfTouched(id){
  var pk = state.today && state.today.pick;
  if(!pk || !pk.combo) return;
  var hit = slotsOf(pk.combo).some(function(x){ return x && x.id === id; });
  /* 只重排，不动 eaten：已经记过账了，把记账状态清掉会让「就吃这个」再记一次，
     同一天写两条记录、库存扣两轮，而 consumed 已被覆盖，多扣的那份永远还不回来 */
  if(hit){ state.today.pick = null; }
}
/* 删除：每类至少留 3 道，否则组合就凑不齐了 */
function deleteRecipe(id){
  var it = findItem(id);
  if(!it) return '没找到这道菜';
  var same = ITEMS.filter(function(x){ return x.cat === it.cat; });
  if(same.length <= 3) return '这类只剩 ' + same.length + ' 道，再删就排不出今天这顿了';
  if(state.hidden.indexOf(id) < 0) state.hidden.push(id);
  /* 删除只藏不删：id 记进 hidden，条目还留在 recipes 里，
     这样「恢复」能原样拿回来，也不至于手滑一次就没了 */
  dropPickIfTouched(id);
  rebuildItems(); save();
  return null;
}
function restoreRecipe(id){
  state.hidden = state.hidden.filter(function(x){ return x !== id; });
  rebuildItems(); save();
}
function newRecipeId(){ return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

function pool(cat){ return ITEMS.filter(function(x){ return x.cat === cat; }); }
function findItem(id){ return ITEMS.filter(function(x){ return x.id === id; })[0]; }

/* 库存口径：qty>0 且未过期才算「有」。过期的不参与推荐，在冰箱页单独提示。
   常备品（PANTRY）不进库存表，视为家里总有，所以 invOf 对它返回 null，
   但 stockedOf 才是「要不要买」的唯一口径。 */
function isPantry(id){ return PANTRY.indexOf(id) >= 0; }
function invOf(id){
  return state.inventory.filter(function(x){
    return x.id === id && x.qty > 0 && daysBetween(todayStr(), x.exp) >= 0;
  })[0];
}
/* 家里有没有：常备品永远算有；生鲜看库存且不能过期 */
function stockedOf(id){
  if(isPantry(id)) return true;
  return !!invOf(id);
}
function invAll(id){ return state.inventory.filter(function(x){ return x.id === id && x.qty > 0; })[0]; }
/* 冰箱页只显示生鲜层：老数据里可能还有蛋奶干货，一律过滤掉 */
function invList(){ return state.inventory.filter(function(x){ return x.qty > 0 && !isPantry(x.id); }); }
function invDays(x){ return daysBetween(todayStr(), x.exp); }
function invPurge(){ state.inventory = state.inventory.filter(function(x){ return x.qty > 0; }); }

/* 显示名：自定义食材没有 ING 记录，名字挂在条目上 */
function labelOf(x){ return (x && (x.name || ingName(x.id))) || ''; }

/* ---- 保质期 ----
   三级优先：同名自定义食材记过的天数 > 该食材改过的天数 > SHELF 推荐值 > 兜底 3 天。
   自定义食材每次新建都是新 id，所以按「名字」记一份，下次买同样的东西还是你上次定的天数。 */
function shelfDays(id, name){
  if(name && state.shelfName[name] != null) return state.shelfName[name];
  if(id && state.shelf[id] != null) return state.shelf[id];
  return (SHELF[id] && SHELF[id].d) || 3;
}
function shelfNote(id){ return (SHELF[id] && SHELF[id].note) || ''; }
function shelfIsCustom(id, name){ return !SHELF[id] && !!(name || (state.shelf[id] != null)); }
function setShelfDays(id, days, name){
  var n = Math.round(Number(days));
  if(!(n >= 1)) n = 1;
  if(n > 90) n = 90;
  if(name) state.shelfName[name] = n;
  if(id) state.shelf[id] = n;
  save();
  return n;
}
/* 改保质期只影响以后的记账，已经记进冰箱的到期日不动——那是当时按当时的天数算的 */
function invAdd(id, qty, exp, name){
  var hit = invAll(id);
  var e = exp || dstr(shelfDays(id, name));
  /* 只和「还没过期」的那行合并。过期货并进来再把到期日往后推，等于给旧货续命：
     推荐会把它当成还能用，冰箱页也不再提示过期。过期的就留着让它按过期处理，另起一行。 */
  var fresh = hit && daysBetween(todayStr(), hit.exp) >= 0;
  if(fresh){
    hit.qty += qty;
    if(e > hit.exp) hit.exp = e;
    if(name && !hit.name) hit.name = name;
  } else {
    var row = {id:id, qty:qty, exp:e, added:todayStr()};
    if(name) row.name = name;
    if(!SHELF[id]) row.custom = 1;
    state.inventory.push(row);
  }
}

/* 自定义食材：先看是不是已有的食材名（输「菠菜」不该新建一条），
   是就直接记到那个 id 上，不是才生成 cus_xxx。
   days 传了就是这一批的保质期，记到名字上，下次同名自动沿用。 */
function addCustom(name, days){
  var t = String(name || '').trim();
  if(!t) return null;
  var hitId = null;
  Object.keys(ING).forEach(function(k){
    if(ingName(k) === t) hitId = k;
  });
  if(hitId){
    if(days) setShelfDays(hitId, days);
    /* 常备品（牛奶、鸡蛋、坚果…）不进库存表：invList 会把它过滤掉，
       真记进去就成了「用户看不见、也删不掉，但 eat 会扣」的幽灵库存。
       只记它的保质期/名字就够了。 */
    if(isPantry(hitId)) return hitId;
    invAdd(hitId, 1);
    return hitId;
  }
  if(days) setShelfDays(null, days, t);
  var id = 'cus_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  invAdd(id, 1, null, t);
  return id;
}

function customList(){
  var seen = {}, out = [];
  state.inventory.forEach(function(x){
    if(!x.custom || !x.name || seen[x.name]) return;
    seen[x.name] = 1;
    out.push(x.name);
  });
  return out;
}
function invOfName(name){
  return state.inventory.filter(function(x){ return x.custom && x.name === name && x.qty > 0; })[0];
}

/* 哪些菜能用到它——这是「买了用不完」的解药 */
function recipesUsing(id){
  return ITEMS.filter(function(x){ return (x.needs || []).indexOf(id) >= 0; });
}

function eatenDaysAgo(id){
  var best = null;
  state.history.forEach(function(h){
    if(h.date === todayStr()) return;
    if([h.p,h.f,h.c].indexOf(id) >= 0){
      var d = daysBetween(h.date, todayStr());
      if(best === null || d < best) best = d;
    }
  });
  return best;
}
function stapleDaysAgo(staple){
  if(!staple) return null;
  var best = null;
  state.history.forEach(function(h){
    if(h.date === todayStr()) return;
    var ids = [h.p,h.f,h.c].filter(Boolean);
    var hit = ids.some(function(id){ var it = findItem(id); return it && it.staple === staple; });
    if(hit){
      var d = daysBetween(h.date, todayStr());
      if(best === null || d < best) best = d;
    }
  });
  return best;
}
/* 最近 span 天内吃过几次。口径必须是「小于 span」：
   <= 7 会把 7 天前的今天也算进来，变成 8 天窗口，比界面承诺多一天 */
function weekCount(id, span){
  var n = 0, w = span || 7;
  state.history.forEach(function(h){
    if(daysBetween(h.date, todayStr()) < w && [h.p,h.f,h.c].indexOf(id) >= 0) n++;
  });
  return n;
}
function redCountWeek(){
  var n = 0;
  state.history.forEach(function(h){
    if(daysBetween(h.date, todayStr()) >= 7) return;
    var ids = [h.p,h.f,h.c].filter(Boolean);
    if(ids.some(function(id){ var it = findItem(id); return it && it.red; })) n++;
  });
  return n;
}

function slotsOf(combo){
  return [combo.protein, combo.fiber, combo.carb].filter(Boolean);
}

function evaluate(combo, date){
  var win = state.settings.window;
  /* 脂肪是加料，不参与硬约束与打分；只用三道菜来判定 */
  var slots = [combo.protein, combo.fiber, combo.carb].filter(Boolean);
  var hand = slots.reduce(function(a,x){ return a + x.hand; }, 0);

  /* 硬约束 1：纤维必须有一份（蛋白自带纤维可顶替） */
  if(!(combo.fiber || slots.some(function(x){ return x.fiber; }))) return {ok:false, why:'没有纤维'};

  /* 硬约束 2：同一时刻只能一道要盯锅的 */
  if(slots.filter(function(x){ return x.fire === 'watch'; }).length > 1) return {ok:false, why:'两道盯锅'};

  /* 硬约束 3：动手时间不能超过窗口 */
  if(hand > win) return {ok:false, why:'动手超时'};

  /* 硬约束 4：器具 ≤ 2 件（洗锅也算时间）
     原来只数「有没有水锅 + 有没有炒锅」，两次自增最大就是 2，
     pots > 2 永远不会成立，这条约束从来没拦过任何组合；
     空气炸锅、微波炉也完全没计入。改成按去重后的器具集合数。 */
  var vs = {};
  slots.forEach(function(x){
    var v = x.vessel;
    if(!v || v === 'none' || v === 'pre' || v === 'microwave') return;  /* 微波炉不用洗锅 */
    if(v === 'steamer') v = 'water';                                    /* 蒸屉挂在水锅上 */
    vs[v] = 1;
  });
  var pots = Object.keys(vs).length;
  if(pots > 2) return {ok:false, why:'器具超过 2 件'};

  /* 硬约束 5：同一道菜 7 天内不重复；同一主料 3 天内不重复 */
  for(var i = 0; i < slots.length; i++){
    var it = slots[i];
    var d = eatenDaysAgo(it.id);
    if(d !== null && d < 7) return {ok:false, why:it.n + ' 7 天内吃过'};
    var ds = stapleDaysAgo(it.staple);
    if(ds !== null && ds < 3) return {ok:false, why:it.staple + ' 主料 3 天内用过'};
  }

  /* 硬约束 6：频率上限。cap 是「每周几次」，0.5 表示两周 1 次。
     不能直接拿整数计数和小数比：1 >= 0.5 和 1 >= 1 是同一件事，
     两周 1 次的菜第 8 天就会被放回来。窗口要按 cap 放大。 */
  for(var j = 0; j < slots.length; j++){
    var s2 = slots[j];
    if(s2.cap != null){
      var span = s2.cap >= 1 ? 7 : Math.round(7 / s2.cap);
      var lim = s2.cap >= 1 ? s2.cap : 1;
      if(weekCount(s2.id, span) >= lim){
        return {ok:false, why:s2.n + (s2.cap >= 1 ? ' 本周次数已满' : ' 这两周已经排过了')};
      }
    }
  }

  /* ---------- 打分 ---------- */
  var seen = {}, needIds = [];
  slots.forEach(function(x){ (x.needs || []).forEach(function(id){ if(!seen[id]){ seen[id] = 1; needIds.push(id); } }); });

  var have = 0, expiring = 0, missing = [];
  needIds.forEach(function(id){
    if(isPantry(id)) return;          /* 常备品不参与库存打分：它对每道菜都一样，加了只会稀释信号 */
    var inv = invOf(id);
    if(inv){
      have++;
      if(daysBetween(date, inv.exp) <= 2) expiring++;
    } else missing.push(id);
  });

  var s = expiring * 3 + have * 2 - missing.length * 1;

  /* 久没吃 */
  var gap = 10;
  slots.forEach(function(x){
    var d = eatenDaysAgo(x.id);
    if(d !== null && d < gap) gap = d;
  });
  s += Math.min(3, gap / 3);

  /* 红肉频率（软惩罚，一周 2 次以上递减） */
  var red = redCountWeek();
  if(red >= 2 && slots.some(function(x){ return x.red; })) s -= 4;

  /* 时间余量：把窗口用满会紧张 */
  if(hand > win - 3) s -= 1.5;
  if(hand > win - 1) s -= 4;

  /* 口味搭配：权重为 0，只记录 */
  var taste = tastePenalty(slots);
  s += TASTE_W * taste.pen;

  return {
    ok:true, score:s, hand:hand, pots:pots,
    watch: slots.filter(function(x){ return x.fire === 'watch'; }).length,
    missing: missing, expiring: expiring, gap: gap, taste: taste
  };
}

/* 三条口味规则：双酸、双辣、两道都浓且没有清口的 */
function tastePenalty(slots){
  var sour = slots.filter(function(x){ return x.taste[1] >= 2; }).length;
  var spicy = slots.filter(function(x){ return x.taste[2] >= 2; }).length;
  var rich = slots.filter(function(x){ return x.taste[0] >= 2; }).length;
  var plain = slots.some(function(x){ return x.taste[0] <= 0; });
  var p = 0, hits = [];
  if(sour >= 2){ p++; hits.push('双酸'); }
  if(spicy >= 2){ p++; hits.push('双辣'); }
  if(rich >= 2 && !plain){ p++; hits.push('两道都浓'); }
  return {pen:p, hits:hits};
}

function enumerate(date){
  var out = [];
  var P = pool('protein'), F = pool('fiber'), C = pool('carb');
  var sk = state.today.skipped || [];
  var lk = state.today.locks || {};

  for(var i = 0; i < P.length; i++){
    if(lk.protein && P[i].id !== lk.protein) continue;
    if(sk.indexOf(P[i].id) >= 0) continue;
    for(var j = 0; j < C.length; j++){
      if(lk.carb && C[j].id !== lk.carb) continue;
      if(sk.indexOf(C[j].id) >= 0) continue;
      var fList = P[i].fiber ? F.concat([null]) : F;
      for(var k = 0; k < fList.length; k++){
        var f = fList[k];
        if(f){
          if(lk.fiber && f.id !== lk.fiber) continue;
          if(sk.indexOf(f.id) >= 0) continue;
        } else if(lk.fiber){ continue; }
        {
          var combo = {protein:P[i], fiber:f, carb:C[j]};
          var ev = evaluate(combo, date);
          if(ev.ok) out.push({combo:combo, ev:ev});
        }
      }
    }
  }
  /* 并列时按「久没吃 → 动手更少 → id」稳定打破，保证同样输入必然同样输出 */
  out.sort(function(a,b){
    if(b.ev.score !== a.ev.score) return b.ev.score - a.ev.score;
    if(b.ev.gap !== a.ev.gap) return b.ev.gap - a.ev.gap;
    if(a.ev.hand !== b.ev.hand) return a.ev.hand - b.ev.hand;
    var ka = a.combo.protein.id + a.combo.carb.id + (a.combo.fiber ? a.combo.fiber.id : '');
    var kb = b.combo.protein.id + b.combo.carb.id + (b.combo.fiber ? b.combo.fiber.id : '');
    return ka < kb ? -1 : (ka > kb ? 1 : 0);
  });
  return out;
}

function recommend(){
  var list = enumerate(todayStr());
  if(!list.length){
    state.today.skipped = [];
    state.today.locks = {};
    list = enumerate(todayStr());
    if(list.length) toast('今天备选差不多了，从头再给你排');
  }
  return list.length ? list[0] : null;
}

/* ============================================================
   派生信息
   ============================================================ */
function prepList(combo){
  var out = [], seen = {};
  slotsOf(combo).forEach(function(x){
    (x.prep || []).forEach(function(p){
      /* am:1 = 早上现做，不能提前。混进「今晚」清单会让用户白干一遍（上浆过夜会脱浆） */
      if(p.am) return;
      var k = p.text;
      if(seen[k]) return;
      seen[k] = 1;
      out.push({min:p.min, text:p.text, ph:p.ph, from:x.n});
    });
  });
  out.sort(function(a,b){ return b.min - a.min; });
  return out;
}
function missingOf(combo){
  var seen = {}, out = [];
  slotsOf(combo).forEach(function(x){
    (x.needs || []).forEach(function(id){
      if(seen[id]) return;
      seen[id] = 1;
      if(!stockedOf(id)) out.push(id);   /* 常备品永远算有，不进采购单 */
    });
  });
  return out;
}
function expiringOf(combo){
  var seen = {}, out = [];
  slotsOf(combo).forEach(function(x){
    (x.needs || []).forEach(function(id){
      if(seen[id]) return;
      seen[id] = 1;
      var inv = invOf(id);
      if(inv){
        var d = daysBetween(todayStr(), inv.exp);
        if(d <= 2) out.push({id:id, d:d});
      }
    });
  });
  return out;
}

function whyLines(combo, ev){
  var out = [];
  var exp = expiringOf(combo);
  if(exp.length){
    out.push(exp.map(function(x){ return ingName(x.id); }).join('、') + (exp[0].d <= 0 ? ' 今天到期，先吃掉' : ' 还剩 ' + exp[0].d + ' 天，先吃掉'));
  }
  var p = combo.protein;
  var d = eatenDaysAgo(p.id);
  if(d === null) out.push(p.n + ' 最近没做过，正好换一换');
  else out.push(p.n + ' 已经 ' + d + ' 天没吃了');
  if(ev.hand <= state.settings.window - 5) out.push('动手只有 ' + ev.hand + ' 分钟，窗口还剩 ' + (state.settings.window - ev.hand) + ' 分钟');
  else out.push('动手 ' + ev.hand + ' 分钟，用在 ' + state.settings.window + ' 分钟窗口里刚好');
  if(redCountWeek() >= 2 && !slotsOf(combo).some(function(x){ return x.red; })) out.push('本周红肉已 ' + redCountWeek() + ' 次，今天排的是白肉/豆制品');
  return out.slice(0, 3);
}

function morningPlan(combo){
  var slots = slotsOf(combo);
  var water = slots.filter(function(x){ return x.vessel === 'water' || x.vessel === 'steamer'; })
                   .sort(function(a,b){ return b.wall - a.wall; });
  var pan = slots.filter(function(x){ return x.vessel === 'pan'; });
  var dev = slots.filter(function(x){ return x.vessel === 'microwave' || x.vessel === 'airfryer'; });
  var lines = [];
  if(water.length){
    lines.push({k:'水锅', v:'水开 → ' + water.map(function(x){ return x.n + ' ' + x.wall + ' 分'; }).join(' → ') + '（一锅到底，不换水）'});
  }
  if(pan.length){
    lines.push({k:'灶眼', v:pan.map(function(x){ return x.n + ' ' + x.wall + ' 分'; }).join('、') + (water.length ? '（另一个火，与水锅并行）' : '')});
  }
  if(dev.length){
    lines.push({k:'设备', v:dev.map(function(x){ return x.n + '（' + DEVN[x.vessel] + ' ' + x.wall + ' 分）'; }).join('、')});
  }
  if(!lines.length) lines.push({k:'免火', v:'全部免火，只摆盘。'});
  return lines;
}

   行为
   ============================================================ */
var ui = { tab:'today', libCat:'all', sheet:false, sheetType:'settings', editId:null, addGrp:'叶菜', addDays:3,
           draft:null, impMsg:null, pasteTxt:'', ingQ:'',
           nmName:'', nmAuthor:'', nmSrc:'', impInfo:'', pendFrom:'', openM:{},
           bkText:'', bkMsg:null, rsTxt:'', rsInfo:null, rsParsed:null,
           cusName:'', cusDays:null };
(function(){
  var t = (location.hash || '').replace('#','');
  if(['today','fridge','lib','log'].indexOf(t) >= 0) ui.tab = t;
})();

function ensurePick(){
  if(state.today.date !== todayStr()) resetToday();
  if(!state.today.pick){
    var r = recommend();
    state.today.pick = r ? {combo:r.combo, ev:r.ev} : null;
    save();
  }
  return state.today.pick;
}

function reroll(){
  /* 今天已经记过账就先整体回滚（库存 + 历史），否则换一道再记一次，
     前一批扣掉的料就永远回不来了 */
  if(state.today.eaten) undoConsumed();
  var r = recommend();
  state.today.pick = r ? {combo:r.combo, ev:r.ev} : null;
  state.today.eaten = null;
  save(); render();
}

function swapSlot(cat){
  var cur = state.today.pick.combo[cat];
  if(!cur) return;
  state.today.skipped.push(cur.id);
  var c = state.today.pick.combo;
  ['protein','fiber','carb'].forEach(function(k){
    state.today.locks[k] = (k === cat) ? null : (c[k] ? c[k].id : null);
  });
  reroll();
}

function swapAll(){
  var c = state.today.pick.combo;
  [c.protein, c.fiber, c.carb].filter(Boolean).forEach(function(x){
    if(state.today.skipped.indexOf(x.id) < 0) state.today.skipped.push(x.id);
  });
  state.today.locks = {};
  reroll();
}

function pickFromLib(it){
  var c0 = state.today.pick.combo;
  var cat = it.cat;
  /* 先在副本上试，通过了再落地。原来是直接改 state.today.pick.combo：
     校验失败只弹个 toast，界面就停在一份违背硬约束的餐上，skipped 也被污染，
     显示的动手分钟还是旧值——三处数据互相矛盾 */
  var c = {protein:c0.protein, fiber:c0.fiber, carb:c0.carb};
  c[cat] = it;
  if(cat === 'protein' && it.fiber){ c.fiber = null; }
  var ev = evaluate(c, todayStr());
  if(!ev.ok){ toast('这样换会撞硬约束：' + ev.why); return; }
  if(state.today.eaten) undoConsumed();   /* 餐变了，原来那次记账作废，库存还原 */
  if(c0[cat]) state.today.skipped.push(c0[cat].id);
  state.today.pick = {combo:c, ev:ev};
  state.today.locks[cat] = it.id;
  save(); toast('换成 ' + it.n + ' 了');
  render();
}

function eat(){
  var c = state.today.pick.combo;
  var need = {}, order = [];
  slotsOf(c).forEach(function(x){
    (x.needs || []).forEach(function(id){
      if(!need[id]){ need[id] = 0; order.push(id); }
      need[id] += 1;            /* 两道菜都用番茄就扣两个 */
    });
  });
  var consumed = [];
  /* 同一样食材可能有好几行（比如过期的旧行 + 新买的一行）。
     invAll 只取第一行，会扣到过期那行上；这里按到期日从早到晚扣，
     过期的行不扣——它不该被当成吃掉的东西，冰箱页会单独提示。 */
  function takeFrom(id, want){
    var rows = state.inventory.filter(function(x){ return x.id === id && x.qty > 0; });
    rows.sort(function(a, b){ return daysBetween(todayStr(), a.exp) - daysBetween(todayStr(), b.exp); });
    var left = want;
    rows.forEach(function(r){
      if(left <= 0) return;
      if(daysBetween(todayStr(), r.exp) < 0) return;
      var n = Math.min(left, r.qty);
      r.qty -= n; left -= n;
      /* 到期日/名字一起记：撤销时这行可能已被 invPurge 删掉，重建要按原批次还原 */
      consumed.push({id:id, qty:n, exp:r.exp, name:r.name, custom:r.custom});
    });
  }
  order.forEach(function(id){ takeFrom(id, need[id]); });
  invPurge();
  state.today.consumed = consumed;
  state.today.eaten = true;
  /* 同一天只留一条：再记一次是「替换今天这顿」，不是追加一顿 */
  state.history = state.history.filter(function(h){ return h.date !== todayStr(); });
  state.history.unshift({ date:todayStr(), p:c.protein?c.protein.id:null, f:c.fiber?c.fiber.id:null,
                          c:c.carb?c.carb.id:null,
                          name:[c.protein&&c.protein.n, c.fiber&&c.fiber.n, c.carb&&c.carb.n].filter(Boolean).join(' + ') });
  save(); render(); toast('记下了，今晚的活在上面');
}

/* 撤掉今天这次记账：还原库存、删掉今天的记录。不提示不渲染，供换餐复用 */
function undoConsumed(){
  (state.today.consumed || []).forEach(function(x){
    if(!x.qty) return;
    var inv = invAll(x.id);
    if(inv) inv.qty += x.qty;
    else{
      var row = {id:x.id, qty:x.qty, exp:x.exp || dstr(3), added:todayStr()};
      if(x.name) row.name = x.name;
      if(x.custom) row.custom = 1;
      state.inventory.push(row);
    }
  });
  state.history = state.history.filter(function(h){ return h.date !== todayStr(); });
  state.today.consumed = null;
  state.today.eaten = null;
}

function undoTodaysEat(){
  undoConsumed();
  save(); render(); toast('撤销了，重新挑');
}

/* ============================================================
   渲染
   ============================================================ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

/* 重画但保住滚动位置：面板开着的时候、或刚关掉面板时用，
   否则 render 的 scrollTo(0,0) 会把冰箱页弹回顶上 */
function renderKeep(){
  var sy = 0;
  try{ sy = window.scrollY || 0; }catch(e){}
  render();
  try{ window.scrollTo(0, sy); }catch(e){}
}

function render(){
  ensurePick();
  var h = '';
  if(ui.tab === 'today') h = viewToday();
  else if(ui.tab === 'fridge') h = viewFridge();
  else if(ui.tab === 'lib') h = viewLib();
  else h = viewLog();
  document.getElementById('app').innerHTML = h;

  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === ui.tab);
  });
  renderSheet();
  window.scrollTo(0, 0);
}

/* 把某样临期食材排进今天的餐：逐个试能用到它的菜，第一个排得进去的就用 */
function useItUp(id){
  var cands = ITEMS.filter(function(x){ return (x.needs || []).indexOf(id) >= 0; })
                   .sort(function(a,b){ return a.hand - b.hand; });
  if(!cands.length){ toast('没有用到 ' + (ingName(id)) + ' 的菜'); return; }
  var savedLocks = JSON.parse(JSON.stringify(state.today.locks || {}));
  var savedSkip = (state.today.skipped || []).slice();
  for(var i = 0; i < cands.length; i++){
    var it = cands[i];
    state.today.locks = {};
    state.today.locks[it.cat] = it.id;
    state.today.skipped = savedSkip.filter(function(x){ return x !== it.id; });
    var list = enumerate(todayStr());
    if(list.length){
      state.today.pick = {combo:list[0].combo, ev:list[0].ev};
      state.today.eaten = null;
      save();
      ui.tab = 'today';
      render();
      toast('给你排了「' + it.n + '」，先把' + (ingName(id)) + '用掉');
      return;
    }
  }
  state.today.locks = savedLocks;
  state.today.skipped = savedSkip;
  render();
  toast('今天排不进用到它的菜，明天再说');
}

/* ============================================================
   备份：把 state 变成一段文字带走，粘回来就能恢复。
   不压缩、不加密——体积本来就几十 KB，看得懂比省字节重要。
   ============================================================ */
function backupText(){
  return JSON.stringify({ __backup:1, app:'今天这顿', at:new Date().toISOString(), v:1, data:state });
}
function backupStat(d){
  return {
    dishes: (d && Array.isArray(d.recipes))
      ? d.recipes.filter(function(x){ return !(Array.isArray(d.hidden) && d.hidden.indexOf(x.id) >= 0); }).length
      : 0,
    days: (d && Array.isArray(d.history)) ? d.history.length
        : ((d && d.log) ? Object.keys(d.log).length : 0),
    inv: (d && Array.isArray(d.inventory)) ? d.inventory.length : 0
  };
}
/* 聊天软件会在前后加话、还可能把长文截断，所以只取第一个 { 到最后一个 } 再解析 */
function parseBackup(raw){
  var t = String(raw || '').trim();
  if(!t) return { err:'还没粘内容' };
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a < 0 || b <= a) return { err:'这段文字里没找到备份——它应该是一段以 { 开头、} 结尾的 JSON' };
  var o;
  try{ o = JSON.parse(t.slice(a, b + 1)); }
  catch(e){ return { err:'内容不完整，多半是复制时被截断了（微信对超长文字会截断），试试用「存成文件」再导入' }; }
  var d = (o && o.__backup) ? o.data : o;
  if(!d || typeof d !== 'object') return { err:'认不出这是备份' };
  /* 必须能确认「这是本应用的备份」，否则随便一份带 inventory / recipes 键的
     JSON（别的应用导出的、游戏存档）都会被当成备份，确认覆盖后整台设备的
     数据就被换成一堆残缺结构——而且找不回来 */
  var isOurs = (o && (o.__backup === 1 || o.app === '今天这顿')) || d.version === 4;
  if(!isOurs) return { err:'这份里没有本应用的版本信息，不是这个应用的备份' };
  if(!Array.isArray(d.recipes) && !Array.isArray(d.inventory) && !Array.isArray(d.history)){
    return { err:'这份里没有菜谱、记录或库存，可能不是这个应用的备份' };
  }
  if(!Array.isArray(d.recipes)) d.recipes = [];
  return { ok:1, data:d, at:fmtAt(o && o.at) };
}
function fmtAt(s){
  if(!s) return '';
  var d = new Date(s);
  if(isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) +
         ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function downloadBackup(){
  var txt = backupText();
  var nm = '今天这顿备份-' + dstr(0) + '.json';
  try{
    var blob = new Blob([txt], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nm;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }catch(e){}
    }, 1500);
    ui.bkMsg = { t:'ok', m:'已生成「' + nm + '」。在浏览器的「下载」里能找到它，再发微信收藏或存网盘。' };
  }catch(e){
    ui.bkMsg = { t:'err', m:'这个浏览器不让下载，用上面的「复制」，或者长按文本框全选复制。' };
  }
  renderSheet();
}

function copyBackup(){
  var txt = backupText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      ui.bkMsg = { t:'ok', m:'复制好了，去粘到能长期存文字的地方。' };
      renderSheet();
    }, function(){
      ui.bkMsg = { t:'err', m:'浏览器不让自动复制（http 页面就是这样），长按上面的文本框 → 全选 → 复制。' };

/* raw 可以由调用方传进来（选文件时文件内容还没进 textarea）。
   原来只读 textarea，选完文件立刻被空框覆盖，永远是「还没粘内容」 */
function checkRestore(raw){
  if(raw == null){
    var box = document.getElementById('rsTxt');
    raw = box ? box.value : (ui.rsTxt || '');
  }
  ui.rsTxt = String(raw || '');
  var r = parseBackup(ui.rsTxt);
  if(r.ok){
    ui.rsParsed = r;
    ui.rsInfo = { ok:1, stat:backupStat(r.data), at:r.at };
  } else {
    ui.rsParsed = null;
    ui.rsInfo = { err:r.err };
  }
  renderSheet();
}

function applyBackup(){
  if(!ui.rsParsed || !ui.rsParsed.ok){ toast('先点「检查一下」'); return; }
  /* 检查完又改了内容？以框里现在的文字为准重新解析。
     否则「已检查 A、实际写入 A」跟用户看到的 B 不是同一份，
     先检查后确认这道保护就白设了 */
  var box = document.getElementById('rsTxt');
  if(box && box.value != null && String(box.value).trim()){
    var again = parseBackup(box.value);
    if(!again.ok){
      ui.rsParsed = null;
      ui.rsInfo = { err:'内容变了，请重新点「检查一下」' };
      renderSheet(); toast('内容变了，重新检查一下'); return;
    }
    if(again.data !== ui.rsParsed.data){ ui.rsParsed = again; }
  }
  /* 备份可能是老版本、或被人手改过，缺字段就补齐再写：
     少一个 today 就是白屏，少 settings 就取不到窗口分钟 */
  var d = ui.rsParsed.data, dft = dataDefaults();
  Object.keys(dft).forEach(function(k){
    if(d[k] == null) d[k] = dft[k];
    else if((k === 'settings' || k === 'today') && typeof d[k] === 'object'){
      Object.keys(dft[k]).forEach(function(k2){ if(d[k][k2] === undefined) d[k][k2] = dft[k][k2]; });
    }
  });
  d.version = 4;
  try{
    localStorage.setItem(KEY, JSON.stringify(d));
  }catch(e){
    toast('写不进去：浏览器存储满了，或被隐私模式禁用了');
    return;
  }
  /* 直接重载最干净：内存里的 state 已经旧了，重新加载一次免得半新半旧 */
  location.reload();
}
