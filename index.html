var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', function(e){
  if(e.target.id === 'sheet'){ ui.sheet = false; renderSheet(); return; }
  var el = e.target.closest('[data-act],[data-tab]');
  if(!el) return;
  if(el.dataset.tab){
    ui.tab = el.dataset.tab;
    render();
    return;
  }
  var act = el.dataset.act;
  var id = el.dataset.id;

  /* 今天 */
  if(act === 'swap'){ swapSlot(el.dataset.cat); }
  else if(act === 'swapAll'){ swapAll(); }
  else if(act === 'eat'){ eat(); }
  else if(act === 'undoEat'){ undoTodaysEat(); }
  else if(act === 'libcat'){ ui.libCat = el.dataset.cat; render(); }
  else if(act === 'use'){ pickFromLib(findItem(id)); }
  else if(act === 'addslot'){ ui.tab = 'lib'; ui.libCat = el.dataset.cat; render(); }

  /* 菜谱 */
  else if(act === 'rNew'){ openEditor(null); }
  else if(act === 'rEdit'){ openEditor(findItem(id)); }
  else if(act === 'rImport'){
    /* 每次开都清空，免得把上一道的名字带进来 */
    ui.nmName = ''; ui.nmAuthor = ''; ui.nmSrc = '';
    ui.sheet = true; ui.sheetType = 'import';
    ui.impMsg = null;
    renderSheet();
  }
  else if(act === 'rPending'){ ui.sheet = true; ui.sheetType = 'pending'; renderSheet(); }
  else if(act === 'pendFill'){
    var pr = (state.pending || [])[Number(el.dataset.i)];
    if(!pr) return;
    ui.draft = pendingToDraft(pr);
    ui.impInfo = '';
    ui.impMsg = null;
    ui.pendFrom = pr.n;
    ui.sheet = true; ui.sheetType = 'recipe';
    renderSheet();
  }
  else if(act === 'pendSearch'){
    var pq = ((state.pending || [])[Number(el.dataset.i)] || {}).n || '';
    if(!pq) return;
    /* 页面抓不了下厨房，但你自己手机上的浏览器能打开。看完照着填就行 */
    var purl = 'https://www.xiachufang.com/search/?keyword=' + encodeURIComponent(pq);
    var w = window.open(purl, '_blank');
    if(!w) location.href = purl;
  }
  else if(act === 'pendAdd'){
    ui.impMsg = null;
    ui.nmName = ''; ui.nmAuthor = ''; ui.nmSrc = '';
    ui.sheet = true; ui.sheetType = 'import'; renderSheet();
  }
  else if(act === 'pendShare'){ sharePending(); }
  else if(act === 'pendCopy'){ copyPending(); }
  else if(act === 'pendDropDone'){
    var before = state.pending.length;
    state.pending = state.pending.filter(function(x){ return !pendingIsDone(x); });
    save(); renderSheet(); render();
    toast('清掉 ' + (before - state.pending.length) + ' 条已补录的');
  }
  else if(act === 'pendClear'){
    state.pending = []; save(); renderSheet(); render();
    toast('清单已清空');
  }
  else if(act === 'pendDel'){
    state.pending.splice(Number(el.dataset.i), 1); save(); renderSheet(); render();
  }
  else if(act === 'rmore'){
    var sy = window.scrollY || 0;
    ui.openM[id] = !ui.openM[id];
    render();
    window.scrollTo(0, sy);
  }
  else if(act === 'pasteParse'){ doPasteParse(); }
  else if(act === 'dPasteOpen'){ readForm(); ui.draft._pasteOpen = 1; renderSheet(); }
  else if(act === 'nmAdd'){ doAddByName(); }
  else if(act === 'dcat'){ readForm(); ui.draft.cat = el.dataset.v; ui.draft._auto.cat = 0; renderSheet(); }
  else if(act === 'dtime'){
    readForm();
    setTimeKey(ui.draft, el.dataset.v);
    ui.draft._auto.time = 0;
    renderSheet();
  }
  else if(act === 'dfire'){ readForm(); ui.draft.fire = el.dataset.v; ui.draft._auto.fire = 0; renderSheet(); }
  else if(act === 'dmore'){ readForm(); ui.draft._more = ui.draft._more ? 0 : 1; renderSheet(); }
  else if(act === 'dpad'){
    readForm();
    ui.draft._pad = ui.draft._pad ? 0 : 1;
    if(!ui.draft._pad) ui.ingQ = '';
    renderSheet();
  }
  else if(act === 'dreset'){
    readForm();
    ui.draft._auto = {cat:1, time:1, fire:1, vessel:1};
    inferRecipe(ui.draft);
    renderSheet();
  }
  else if(act === 'dvessel'){ readForm(); ui.draft.vessel = el.dataset.v; ui.draft._auto.vessel = 0; renderSheet(); }
  else if(act === 'dcap'){
    readForm();
    var cv = Number(el.dataset.v);
    ui.draft.cap = cv < 0 ? null : cv;
    renderSheet();
  }
  else if(act === 'ding'){
    readForm();
    var ix = ui.draft.needs.indexOf(id);
    if(ix >= 0) ui.draft.needs.splice(ix, 1); else ui.draft.needs.push(id);
    inferRecipe(ui.draft);
    renderSheet();
  }
  else if(act === 'dingNew'){
    readForm();
    addIngToDraft(ui.ingQ || '');
    inferRecipe(ui.draft);
    ui.ingQ = '';
    renderSheet();
  }
  else if(act === 'rSave'){
    readForm();
    var rerr = validateDraft(ui.draft);
    if(rerr){ toast(rerr); return; }
    var dd = ui.draft;
    /* 不拦人，但把「可能排不上」说清楚 */
    var soft = '';
    if(dd.hand > state.settings.window) soft = '动手 ' + dd.hand + ' 分钟，超过 ' + state.settings.window + ' 分钟窗口，早上排不进去';
    else if(!dd.needs.length) soft = '没记用料，采购清单里不会有它';
    saveRecipe(dd);
    var pendN = dropFilledPending(dd);
    ui.draft = null; ui.sheet = false; ui.libCat = 'all'; ui.impInfo = ''; ui.pendFrom = '';
    ui.pasteTxt = ''; ui.ingQ = '';
    renderSheet(); render();
    toast(pendN ? '存好了，待补录里那条也自动清掉了'
        : (soft ? '存好了 · ' + soft : '存好了，今天就能排上'));
  }
  else if(act === 'rCancel'){
    ui.draft = null; ui.sheet = false; ui.impInfo = ''; ui.pendFrom = '';
    ui.pasteTxt = ''; ui.ingQ = '';
    renderSheet();
  }
  else if(act === 'rDel'){
    var derr = deleteRecipe(el.dataset.id);
    if(derr){ toast(derr); return; }
    ui.draft = null; ui.sheet = false;
    renderSheet(); render();
    toast('删了。设置里能恢复');
  }
  else if(act === 'rRestore'){
    (state.hidden || []).slice().forEach(restoreRecipe);
    ui.sheet = false; renderSheet(); render(); toast('删掉的菜谱都回来了');
  }

  /* 冰箱 */
  else if(act === 'buyAdd'){
    invAdd(id, 1); save(); render();
    toast((ingName(id)) + ' 记进冰箱了');
  }
  else if(act === 'sheetAdd'){ ui.sheet = true; ui.sheetType = 'add'; renderSheet(); }
  else if(act === 'sheetShelf'){ ui.sheet = true; ui.sheetType = 'shelf'; renderSheet(); }
  else if(act === 'addgrp'){ ui.addGrp = el.dataset.g; renderSheet(); }
  else if(act === 'adddays'){ ui.addDays = Number(el.dataset.n); renderSheet(); }
  else if(act === 'shPlus' || act === 'shMinus'){
    var isCus = el.dataset.cus === '1';
    var shName = el.dataset.name, shId = isCus ? null : el.dataset.id;
    var cur = shelfDays(shId, isCus ? shName : null);
    var next = Math.max(1, Math.min(90, cur + (act === 'shPlus' ? 1 : -1)));
    setShelfDays(shId, next, isCus ? shName : null);
    renderSheet();
  }
  else if(act === 'shReset'){
    state.shelf = {}; state.shelfName = {};
    save(); renderSheet(); render(); toast('保质期已恢复推荐值');
  }
  else if(act === 'cusAdd'){
    var box = document.getElementById('cusName');
    var dayBox = document.getElementById('cusDays');
    var nm = box ? box.value : '';
    var dd = dayBox ? Number(dayBox.value) : ui.addDays;
    var newId = addCustom(nm, dd);
    if(!newId){ toast('先打个名字'); }
    else {
      save();
      toast(String(nm).trim() + ' 记进冰箱了，保质 ' + shelfDays(newId, String(nm).trim()) + ' 天');
      ui.addGrp = '自定义';
      ui.cusName = ''; ui.cusDays = null;      /* 加完清空，别把上一笔的名字留给下一笔 */
      renderSheet(); render();
    }
  }
  else if(act === 'cusAgain'){
    var nm2 = el.dataset.name;
    var row2 = invOfName(nm2);
    if(row2){ row2.qty += 1; save(); toast(nm2 + ' ＋1'); }
    renderSheet(); render();
  }
  else if(act === 'invAdd'){
    invAdd(id, 1); save();
    toast((ingName(id)) + ' ＋1，保质 ' + shelfDays(id) + ' 天');
    /* 面板是固定遮罩，盖着看不见底下的列表；只重画面板的话，
       关掉之后露出来的是加减之前的库存——加的三样像没生效 */
    renderKeep();
  }
  else if(act === 'invOpen'){ ui.sheet = true; ui.sheetType = 'edit'; ui.editId = id; renderSheet(); }
  else if(act === 'invPlus' || act === 'invMinus'){
    var x = invAll(id);
    if(x){ x.qty += (act === 'invPlus' ? 1 : -1); if(x.qty <= 0) state.inventory = state.inventory.filter(function(y){ return y !== x; }); }
    save(); render(); renderSheet();
  }
  else if(act === 'invExp'){
    var y = invAll(id);
    if(y){ y.exp = dstr(Number(el.dataset.d)); save(); render(); renderSheet(); }
  }
  else if(act === 'invDrop'){
    state.inventory = state.inventory.filter(function(z){ return z.id !== id; });
    save(); ui.sheet = false; renderSheet(); render();
    toast('清掉了 ' + (ingName(id)));
  }
  else if(act === 'useItUp'){ useItUp(id); }

  /* 设置 */
  else if(act === 'sheet'){ ui.sheet = true; ui.sheetType = 'settings'; renderSheet(); }
  else if(act === 'bkOpen'){ ui.bkText = backupText(); ui.bkMsg = null; ui.sheetType = 'backup'; renderSheet(); }
  else if(act === 'bkDownload'){ downloadBackup(); }
  else if(act === 'bkCopy'){ copyBackup(); }
  else if(act === 'rsOpen'){ ui.sheetType = 'restore'; ui.rsTxt = ''; ui.rsInfo = null; ui.rsParsed = null; renderSheet(); }
  else if(act === 'rsCheck'){ checkRestore(); }
  else if(act === 'rsApply'){ applyBackup(); }
  else if(act === 'closesheet'){ ui.sheet = false; renderKeep(); }
  else if(act === 'win'){ state.settings.window = Number(el.dataset.v); save(); reroll(); }
  else if(act === 'tg'){ var k = el.dataset.k; state.settings[k] = !state.settings[k]; save(); reroll(); }
  else if(act === 'reset'){
    localStorage.removeItem(KEY);
    state = load(); resetToday(); save(); ui.sheet = false; renderSheet(); render(); toast('已重置');
  }
});

/* 输入即记：任何会重绘表单的点击都不该把正在打的字弄丢 */
document.addEventListener('input', function(e){
  var t = e.target;
  if(!t) return;
  if(t.id === 'f_paste') ui.pasteTxt = t.value;
  else if(t.id === 'f_ingq') ui.ingQ = t.value;
  else if(t.id === 'rsTxt') ui.rsTxt = t.value;
  /* 这两格输入完常要去点分组，面板会整体重绘；不存起来就等于白打 */
  else if(t.id === 'cusName') ui.cusName = t.value;
  else if(t.id === 'cusDays') ui.cusDays = t.value;
});
/* 选备份文件：读进来直接走跟粘贴一样的检查 */
document.addEventListener('change', function(e){
  var t = e.target;
  if(!t || t.id !== 'rsFile' || !t.files || !t.files[0]) return;
  var f = t.files[0];
  if(f.size > 4 * 1024 * 1024){ toast('这文件太大了（' + Math.round(f.size / 1024 / 1024) + ' MB），不像备份'); return; }
  try{
    var fr = new FileReader();
    fr.onload = function(){ checkRestore(String(fr.result || '')); };
    fr.readAsText(f);
  }catch(err){ toast('这个浏览器读不了文件，改用粘贴'); }
});
/* 粘进粘贴框就直接识别，不用再找按钮 */
document.addEventListener('paste', function(e){
  var t = e.target;
  if(!t || t.id !== 'f_paste') return;
  setTimeout(function(){
    if(!ui.draft) return;
    ui.pasteTxt = t.value;
    if(String(t.value || '').trim().length >= 8) doPasteParse();
  }, 40);
});

/* 自定义输入：回车直接加入，不用去点按钮 */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  var t = e.target;
  if(!t) return;
  /* 补录表单：菜名框回车跳到作者，作者框回车直接记下来 */
  if(t.id === 'nmName'){
    e.preventDefault();
    var aBox = document.getElementById('nmAuthor');
    if(aBox) aBox.focus();
    return;
  }
  if(t.id === 'nmAuthor'){ e.preventDefault(); doAddByName(); return; }
  /* 找食材：回车有候选就选第一个，没有就当成新食材加进去 */
  if(t.id === 'f_ingq'){
    e.preventDefault();
    if(!ui.draft) return;
    ui.ingQ = t.value;
    var q = String(ui.ingQ || '').trim();
    if(!q) return;
    var hit = allIngIds().filter(function(x){
      return ui.draft.needs.indexOf(x) < 0 && ingName(x).indexOf(q) >= 0;
    })[0];
    addIngToDraft(hit ? ingName(hit) : q);
    inferRecipe(ui.draft);
    ui.ingQ = '';
    renderSheet();
    return;
  }
  if(t.id !== 'cusName' && t.id !== 'cusDays') return;
  e.preventDefault();
  var nm = (document.getElementById('cusName') || {}).value || '';
  var dayBox = document.getElementById('cusDays');
  var dd = dayBox ? Number(dayBox.value) : ui.addDays;
  var newId = addCustom(nm, dd);
  if(newId){
    save();
    toast(String(nm).trim() + ' 记进冰箱了，保质 ' + shelfDays(newId, String(nm).trim()) + ' 天');
    ui.addGrp = '自定义';
    ui.cusName = ''; ui.cusDays = null;
  } else toast('先打个名字');
  renderSheet(); render();
});

/* 交互自检：?test=1 */
if(location.search.indexOf('test') >= 0){

  function chk(name, cond, extra){ T.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? ' — ' + extra : '')); }
  function snapInv(){ var m = {}; state.inventory.forEach(function(x){ m[x.id] = x.qty; }); return m; }
  function okCombo(c){
    var s = slotsOf(c);
    return s.reduce(function(a,x){ return a + x.hand; }, 0) <= state.settings.window
        && s.filter(function(x){ return x.fire === 'watch'; }).length <= 1;
  }

  /* 自检要一批真实菜谱。示例数据已经不在代码里了，从同目录的 seed-recipes.json
     同步读一次——正好也验证「导入这份文件」这条路是通的 */
  (function(){
    try{
      var x = new XMLHttpRequest();
      x.open('GET', './seed-recipes.json', false);
      x.send(null);
      var o = JSON.parse(x.responseText);
      var d = (o && o.__backup) ? o.data : o;
      if(d && d.recipes && d.recipes.length){
        state.recipes = d.recipes;

  })();

  var EXTRA = SEED.filter(function(x){ return x.ext === 1; });

  /* 先记录再换，验证换完的菜不会凭空写进历史 */

  chk('别名：带括号也能认', matchIng('西红柿（中等大小）') === 'tomato');
  chk('调料：生抽不算食材', matchIng('生抽') === null);
  chk('调料：葱花不算食材', matchIng('葱花') === null);

  /* 编辑器里新起的食材 */
  state.recipes = SEED.slice(); state.edits = {}; state.hidden = []; state.extraIng = {}; rebuildItems();
  ui.draft = emptyDraft('fiber');
  addIngToDraft('紫苏');
  var zsId = ui.draft.needs[0];
  chk('新食材能被加进草稿', !!zsId && ingName(zsId) === '紫苏', zsId);
  chk('新食材会被当成要买的生鲜', !isPantry(zsId) && !stockedOf(zsId));
  ui.draft = null;

  /* 引擎级：直接构造违规组合 */
  var cBadWatch = {protein:findItem('p04'), fiber:findItem('f11'), carb:findItem('c12')};
  chk('两道盯锅被判违规', !evaluate(cBadWatch, todayStr()).ok, evaluate(cBadWatch, todayStr()).why);
  state.settings.window = 6;
  var cBadTime = {protein:findItem('p07'), fiber:findItem('f02'), carb:findItem('c02')};
  chk('动手超窗口被判违规', !evaluate(cBadTime, todayStr()).ok, evaluate(cBadTime, todayStr()).why);
  state.settings.window = 15;

  /* ===== 回归：2026-11-20 全量审查修掉的问题 ===== */
  chk('新建：连存两道自建菜不会互相覆盖', (function(){
    var b = state.recipes.length;
    var d1 = emptyDraft('fiber'); d1.n = '甲菜'; d1.needs = ['spinach']; saveRecipe(d1);
    var d2 = emptyDraft('fiber'); d2.n = '乙菜'; d2.needs = ['spinach']; saveRecipe(d2);
    var ok = state.recipes.length === b + 2 && !!d1.id && !!d2.id && d1.id !== d2.id &&
             !!findItem(d1.id) && !!findItem(d2.id);
    state.recipes.length = b; rebuildItems();
    return ok;
  })());

  chk('记账：同一天记两次只留一条', (function(){
    var c = {protein:findItem('p03'), fiber:findItem('f02'), carb:findItem('c11')};
    state.history.length = 0;
    state.today.pick = {combo:c, ev:evaluate(c, todayStr())};
    eat(); eat();
    var ok = state.history.filter(function(h){ return h.date === todayStr(); }).length === 1;
    undoTodaysEat(); state.history.length = 0; state.today.pick = null;
    return ok;
  })());

  chk('记账：吃完换餐再撤销，库存回到原样', (function(){
    var snap = function(){
      var m = {};
      state.inventory.forEach(function(x){ m[x.id + '@' + x.exp] = x.qty; });
      return JSON.stringify(m);
    };
    var s0 = snap();
    var c = {protein:findItem('p03'), fiber:findItem('f02'), carb:findItem('c11')};
    state.today.pick = {combo:c, ev:evaluate(c, todayStr())};
    eat(); reroll(); undoTodaysEat();
    var ok = snap() === s0;
    state.today.pick = null; state.history.length = 0;
    return ok;
  })());

  chk('换菜：撞硬约束时不会把今天这顿改坏', (function(){
    var c = {protein:findItem('p04'), fiber:findItem('f02'), carb:findItem('c12')};
    state.today.pick = {combo:c, ev:evaluate(c, todayStr())};
    var before = state.today.pick.combo.fiber.id;
    var beforeHand = state.today.pick.ev.hand;
    pickFromLib(findItem('f11'));          /* 虎皮青椒：和 p04 一样要盯锅 */
    var ok = state.today.pick.combo.fiber.id === before &&
             state.today.pick.ev.hand === beforeHand;
    state.today.pick = null;
    return ok;
  })());

  chk('库存：补货不会给过期那批续命', (function(){
    state.inventory.length = 0;
    state.inventory.push({id:'tomato', qty:1, exp:dstr(-1), added:dstr(-5)});
    invAdd('tomato', 1);
    var rows = state.inventory.filter(function(x){ return x.id === 'tomato'; });
    var ok = rows.length === 2 && rows[0].qty === 1 && invDays(rows[0]) < 0;
    state.inventory.length = 0;
    return ok;
  })());

  chk('库存：常备品不会变成看不见的库存', (function(){
    state.inventory.length = 0;
    addCustom('牛奶', 5);
    var ok = state.inventory.length === 0 && invList().length === 0;
    state.inventory.length = 0;
    return ok;
  })());

  chk('频率：7 天前吃过不算本周', (function(){
    state.history.length = 0;
    state.history.push({date:dstr(-7), p:'c13', red:1});
    var ok = weekCount('c13') === 0 && redCountWeek() === 0;
    state.history.length = 0;
    state.history.push({date:dstr(-6), p:'c13'});
    var ok2 = weekCount('c13') === 1;
    state.history.length = 0;
    return ok && ok2;
  })());

  chk('频率：两周 1 次的菜第 8 天也不会放回来', (function(){
    state.history.length = 0;
    state.history.push({date:dstr(-9), f:'c09'});
    var ev = evaluate({protein:findItem('p01'), fiber:findItem('f02'), carb:findItem('c09')}, todayStr());
    var ok = !ev.ok && ev.why.indexOf('这两周') >= 0;
    state.history.length = 0;
    return ok;
  })());

  chk('器具：三件不同器具会被判违规（原来这条约束是死代码）', (function(){
    var byName = function(n){ return ITEMS.filter(function(x){ return x.n.indexOf(n) >= 0; })[0]; };
    var combo = {protein:byName('煎鸡胸'), fiber:byName('凉拌菠菜'), carb:byName('全麦面包')};
    var vs = [combo.protein, combo.fiber, combo.carb].map(function(x){ return x && x.vessel; });
    if(vs.indexOf('pan') < 0 || vs.indexOf('water') < 0 || vs.indexOf('airfryer') < 0) return true;
    var ev = evaluate(combo, todayStr());
    return !ev.ok && ev.why.indexOf('器具') >= 0;
  })());

  chk('解析：整段一行、带「做法：」也能切出用料和步骤', (function(){
    var p = parseRecipeText('番茄炒蛋 2人份 这是我家常做的一道菜简单快手十分钟就能上桌孩子特别爱吃每次都能吃两碗饭 用料：番茄 2个 鸡蛋 2个 盐 适量 做法：1.番茄切块 2.鸡蛋打散 3.热锅倒油炒蛋盛出');
    return p && p.n === '番茄炒蛋' && p.needs.length === 2 && p.steps.length === 3;
  })());

  chk('解析：做法句子不会被当成食材', (function(){
    var p = parseRecipeText('番茄炒蛋\n用料\n番茄 2个\n鸡蛋 2个\n做法\n把鸡蛋打散，加一点盐\n小火煮两分钟');
    return p && p.needs.length === 2 && p.steps.length === 2 &&
           looksLikeIngredient('把番茄切块') === false &&
           looksLikeIngredient('小火煮两分钟') === false &&
           looksLikeIngredient('番茄 2个') === true;
  })());

  chk('解析：步骤里的「准备好所有材料」不会把后面切回用料段', (function(){
    var p = parseRecipeText('番茄炒蛋\n用料\n番茄 2个\n鸡蛋 2个\n做法\n1. 番茄切块\n2. 鸡蛋打散\n准备好所有材料\n3. 热锅倒油炒蛋');
    return p && p.steps.length === 4;
  })());

  chk('解析：没有用料时不会把「装盘」当作者', (function(){
    var p = parseRecipeText('凉拌黄瓜\n1. 黄瓜拍碎\n2. 装盘');
    return p && p.author === '' && p.steps.length === 2;
  })());

  chk('解析：菜名带份量也认得出', (function(){
    var p = parseRecipeText('番茄炒蛋 2人份\n用料\n番茄 2个\n鸡蛋 2个\n做法\n1. 切块');
    return p && p.n === '番茄炒蛋';
  })());

  chk('解析：区间数量「2~3个」认得出', (function(){
    var p = parseRecipeText('蒜香口蘑\n用料\n口蘑\n2~3个\n做法\n1. 切片\n2. 炒');
    return p && p.needs.length === 1 && p.unknown.length === 0 && p.steps.length === 2;
  })());

  chk('解析：序号后接冒号或全角括号也能拆', (function(){
    return splitSteps('做法：1.切块 2.打散 3.炒').length === 3 &&
           splitSteps('（1）切块（2）打散（3）炒').length === 3 &&
           stripStepNo('1）切块') === '切块';
  })());

  chk('解析：作者名不吞后面的括号', (function(){
    return pickAuthor('作者：小美（下厨房） 用料') === '小美';
  })());

  chk('编辑：清空作者、取消限量能真的存下去', (function(){
    var d = draftFrom(findItem('c13'));
    d.cap = null; d.author = '';
    saveRecipe(d);
    var ok = findItem('c13').cap == null && !findItem('c13').author;
    delete state.edits['c13']; rebuildItems();
    return ok;
  })());

  chk('待补录：自己填的没写作者，不认领指明作者的那条', (function(){
    state.pending = [{n:'番茄炒蛋', author:'五月孤芳'}];
    var n = dropFilledPending({n:'番茄炒蛋', author:''});
    var ok = n === 0 && state.pending.length === 1;
    state.pending = [];
    return ok;
  })());

  chk('备料：早上现做的不进「今晚」清单', (function(){
    var pl = prepList({protein:findItem('p04'), fiber:findItem('f02'), carb:findItem('c07')});
    return !pl.some(function(x){ return /早上现做/.test(x.text); });
  })());

  chk('备份：带 inventory 的陌生 JSON 也会被拒绝', (function(){
    var r = parseBackup('{"inventory":[]}');
    return !r.ok;
  })());

  chk('备份：选文件的内容能直接认出，不用先填进粘贴框', (function(){
    ui.rsTxt = ''; ui.rsParsed = null; ui.rsInfo = null;
    checkRestore(backupText());
    var ok = !!ui.rsParsed && ui.rsParsed.ok === 1 && !!ui.rsInfo && ui.rsInfo.ok === 1;
    ui.rsTxt = ''; ui.rsParsed = null; ui.rsInfo = null;
    return ok;
  })());

  var pre2 = document.createElement('pre');
  pre2.id = 'diag2';
  pre2.textContent = T.join('\n');
  document.body.appendChild(pre2);
}

/* 演示历史：?seed=1，让「记录」页有数据可看 */
if(location.search.indexOf('seed') >= 0 && !state.history.length){
  var demoLog = [
    [-1,'p03','f05','c12','煎鸡胸 + 凉拌空心菜 + 杂粮饭'],
    [-2,'p11','f13','c08','蒸豆腐饼 + 白灼菜心 + 全麦面包'],
    [-3,'p06','f16','c07','番茄酸辣鸡块 + 空气炸锅烤蔬菜 + 玉米'],
    [-4,'p09','f02','c02','洋葱炒肉 + 凉拌菠菜 + 红薯'],
    [-5,'p01','f14','c12','水煮蛋 + 蒜蓉西兰花 + 杂粮饭']
  ];

}

render();

/* ?new=1 直接打开「加一道菜」，方便在电脑上看版式；?edit=1 打开改菜谱 */

  ui.tab = 'lib';
  openEditor(findItem('p04'));
}
else if(location.search.indexOf('new=1') >= 0){
  ui.tab = 'lib';
  openEditor(null);

    ui.pasteTxt = '番茄炒蛋\n作者：爱做饭的姥姥\n用料\n番茄 2个\n鸡蛋 2个\n小葱 1根\n做法\n1. 番茄去皮切块。\n2. 鸡蛋打散，热锅倒油炒熟盛出。\n3. 下番茄炒出汁，倒回鸡蛋翻炒，撒葱花。\n小贴士\n番茄先用开水烫一下更好去皮。';
    document.getElementById('f_paste').value = ui.pasteTxt;
    doPasteParse();

}
else if(location.search.indexOf('one=') >= 0){
  var keepId = location.search.split('one=')[1].split('&')[0];
  ui.tab = 'lib'; ui.libCat = 'all';
  state.hidden = ITEMS.filter(function(x){ return x.id !== keepId; }).map(function(x){ return x.id; });
  rebuildItems(); render();
}
else if(location.search.indexOf('cat=') >= 0){
  ui.tab = 'lib';
  ui.libCat = location.search.split('cat=')[1].split('&')[0] || 'all';
  render();
}
else if(location.search.indexOf('pend=1') >= 0){
  ui.tab = 'lib';
  state.pending = [{n:'肉末嫩豆腐｜嫩滑口感爽口！这道快手菜超级下饭！！（减脂少油版）', author:'小何的减脂日常'},
                   {n:'银鱼蒸蛋', author:'某人'}];

}

else if(location.search.indexOf('set=1') >= 0){
  ui.sheet = true; ui.sheetType = 'settings'; renderSheet();
}
else if(location.search.indexOf('bk=1') >= 0){
  ui.bkText = backupText(); ui.sheet = true; ui.sheetType = 'backup'; renderSheet();
}
else if(location.search.indexOf('rs=1') >= 0){
  ui.sheet = true; ui.sheetType = 'restore'; renderSheet();
}

/* 只有 https（或 localhost）才注册 sw。file:// 和局域网 http 下注册会报错，直接跳过 */
if('serviceWorker' in navigator &&
   (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', function(){
    try{
      /* 新版本接管时自己刷一次。以前改了代码，装到桌面上的那个窗口
         死活不换，得手动去清缓存才看得到新版 */
      var hadCtrl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(hadCtrl && !window.__swReload){ window.__swReload = 1; location.reload(); }
      });
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    }catch(e){}
  });
}
